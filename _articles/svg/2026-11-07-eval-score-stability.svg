<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      .header { font-size: 14px; font-weight: 700; fill: #1a1a2e; }
      .subheader { font-size: 10px; fill: #6a6a8a; }
      .case-label { font-size: 10px; fill: #1a1a2e; font-weight: 500; }
      .score-dot { stroke-width: 1.5; }
      .zone-label { font-size: 9px; font-weight: 600; }
      .run-label { font-size: 9px; fill: #8a8aaa; }
      .fix-label { font-size: 8.5px; fill: #2d6a4e; font-weight: 600; font-style: italic; }
      .grid-line { stroke: #e8e8f0; stroke-width: 0.5; }
      .threshold { stroke: #d44a4a; stroke-width: 1; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="780" height="440" fill="#fafafa" rx="8"/>

  <text x="390" y="26" text-anchor="middle" class="header">Eval Score Stability Across 6 Runs</text>
  <text x="390" y="42" text-anchor="middle" class="subheader">Cases that score 5 never vary. Cases that score 3-4 always vary. Variance is signal, not noise.</text>

  <!-- Y axis: scores 1-5 -->
  <!-- Chart area: x=170..740, y=65..400 -->
  <!-- Score positions: 5=80, 4=150, 3=220, 2=290, 1=360 -->

  <!-- Grid lines -->
  <line x1="170" y1="80" x2="740" y2="80" class="grid-line"/>
  <line x1="170" y1="150" x2="740" y2="150" class="grid-line"/>
  <line x1="170" y1="220" x2="740" y2="220" class="grid-line"/>
  <line x1="170" y1="290" x2="740" y2="290" class="grid-line"/>
  <line x1="170" y1="360" x2="740" y2="360" class="grid-line"/>

  <!-- Score labels -->
  <text x="160" y="84" text-anchor="end" class="run-label">5</text>
  <text x="160" y="154" text-anchor="end" class="run-label">4</text>
  <text x="160" y="224" text-anchor="end" class="run-label">3</text>
  <text x="160" y="294" text-anchor="end" class="run-label">2</text>
  <text x="160" y="364" text-anchor="end" class="run-label">1</text>

  <!-- Floor=4 threshold line -->
  <line x1="170" y1="150" x2="740" y2="150" class="threshold"/>
  <text x="745" y="154" class="zone-label" fill="#d44a4a">floor target</text>

  <!-- Run columns: 6 runs at x=220,310,400,490,580,670 -->
  <text x="220" y="395" text-anchor="middle" class="run-label">Run 1</text>
  <text x="310" y="395" text-anchor="middle" class="run-label">Run 2</text>
  <text x="400" y="395" text-anchor="middle" class="run-label">Run 3</text>
  <text x="490" y="395" text-anchor="middle" class="run-label">Run 4</text>
  <text x="580" y="395" text-anchor="middle" class="run-label">Run 5</text>
  <text x="670" y="395" text-anchor="middle" class="run-label">Run 6</text>

  <!-- Vertical separator between pre-fix and post-fix -->
  <line x1="445" y1="60" x2="445" y2="390" stroke="#b0b0c0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="308" y="415" text-anchor="middle" class="run-label">before calibration</text>
  <text x="580" y="415" text-anchor="middle" class="run-label">after calibration</text>

  <!-- Stable 5s zone -->
  <rect x="172" y="66" width="566" height="28" rx="4" fill="#e8f6e8" opacity="0.4"/>
  <text x="175" y="60" class="zone-label" fill="#2d8a4e">STABLE (never vary)</text>

  <!-- suppressor-anger: always 5 -->
  <text x="5" y="84" class="case-label">suppressor-anger</text>
  <circle cx="220" cy="80" r="4" fill="#2d8a4e" class="score-dot"/>
  <circle cx="310" cy="80" r="4" fill="#2d8a4e" class="score-dot"/>
  <circle cx="400" cy="80" r="4" fill="#2d8a4e" class="score-dot"/>
  <circle cx="490" cy="80" r="4" fill="#2d8a4e" class="score-dot"/>
  <circle cx="580" cy="80" r="4" fill="#2d8a4e" class="score-dot"/>
  <circle cx="670" cy="80" r="4" fill="#2d8a4e" class="score-dot"/>
  <line x1="220" y1="80" x2="670" y2="80" stroke="#2d8a4e" stroke-width="1" opacity="0.4"/>

  <!-- Boundary zone -->
  <rect x="172" y="136" width="566" height="98" rx="4" fill="#f6eee8" opacity="0.3"/>
  <text x="175" y="132" class="zone-label" fill="#c87a20">BOUNDARY (vary 3-4)</text>

  <!-- incoherent-anger: 3,3,3 → 4,4 (FIXED) -->
  <text x="5" y="182" class="case-label">incoherent-anger</text>
  <circle cx="220" cy="220" r="5" fill="#d44a4a" class="score-dot" stroke="#d44a4a"/>
  <circle cx="310" cy="220" r="5" fill="#d44a4a" class="score-dot" stroke="#d44a4a"/>
  <circle cx="400" cy="220" r="5" fill="#d44a4a" class="score-dot" stroke="#d44a4a"/>
  <line x1="220" y1="220" x2="400" y2="220" stroke="#d44a4a" stroke-width="1.5" opacity="0.5"/>
  <!-- post-fix -->
  <circle cx="580" cy="150" r="5" fill="#2d8a4e" class="score-dot" stroke="#2d8a4e"/>
  <circle cx="670" cy="150" r="5" fill="#2d8a4e" class="score-dot" stroke="#2d8a4e"/>
  <line x1="580" y1="150" x2="670" y2="150" stroke="#2d8a4e" stroke-width="1.5" opacity="0.5"/>
  <text x="625" y="142" text-anchor="middle" class="fix-label">temporal staging</text>

  <!-- surface-shame: 4,3,2 → 5,5 (FIXED) -->
  <text x="5" y="252" class="case-label">surface-shame</text>
  <circle cx="220" cy="150" r="5" fill="#c87a20" class="score-dot" stroke="#c87a20"/>
  <circle cx="310" cy="220" r="5" fill="#d44a4a" class="score-dot" stroke="#d44a4a"/>
  <circle cx="400" cy="290" r="5" fill="#d44a4a" class="score-dot" stroke="#d44a4a"/>
  <line x1="220" y1="150" x2="400" y2="290" stroke="#d44a4a" stroke-width="1.5" opacity="0.5"/>
  <!-- post-fix -->
  <circle cx="580" cy="80" r="5" fill="#2d8a4e" class="score-dot" stroke="#2d8a4e"/>
  <circle cx="670" cy="80" r="5" fill="#2d8a4e" class="score-dot" stroke="#2d8a4e"/>
  <line x1="580" y1="80" x2="670" y2="80" stroke="#2d8a4e" stroke-width="1.5" opacity="0.5"/>
  <text x="625" y="72" text-anchor="middle" class="fix-label">pin RM</text>

  <!-- mixed-anger: 4,3,3,3,4,3 (still boundary) -->
  <text x="5" y="210" class="case-label">mixed-anger</text>
  <circle cx="220" cy="150" r="4" fill="#c87a20" class="score-dot" stroke="#c87a20"/>
  <circle cx="310" cy="220" r="4" fill="#c87a20" class="score-dot" stroke="#c87a20"/>
  <circle cx="400" cy="220" r="4" fill="#c87a20" class="score-dot" stroke="#c87a20"/>
  <circle cx="490" cy="220" r="4" fill="#c87a20" class="score-dot" stroke="#c87a20"/>
  <circle cx="580" cy="150" r="4" fill="#c87a20" class="score-dot" stroke="#c87a20"/>
  <circle cx="670" cy="220" r="4" fill="#c87a20" class="score-dot" stroke="#c87a20"/>
  <line x1="220" y1="150" x2="310" y2="220" stroke="#c87a20" stroke-width="1" opacity="0.4"/>
  <line x1="310" y1="220" x2="490" y2="220" stroke="#c87a20" stroke-width="1" opacity="0.4"/>
  <line x1="490" y1="220" x2="580" y2="150" stroke="#c87a20" stroke-width="1" opacity="0.4"/>
  <line x1="580" y1="150" x2="670" y2="220" stroke="#c87a20" stroke-width="1" opacity="0.4"/>

  <!-- Legend -->
  <rect x="172" y="405" width="566" height="28" rx="4" fill="#f8f8fc" stroke="#d8d8e0" stroke-width="0.5"/>
  <circle cx="195" cy="419" r="4" fill="#2d8a4e"/>
  <text x="205" y="423" class="run-label" fill="#1a1a2e">stable 4-5</text>
  <circle cx="295" cy="419" r="4" fill="#c87a20"/>
  <text x="305" y="423" class="run-label" fill="#1a1a2e">boundary 3-4</text>
  <circle cx="405" cy="419" r="4" fill="#d44a4a"/>
  <text x="415" y="423" class="run-label" fill="#1a1a2e">below floor</text>
  <line x1="505" y1="419" x2="535" y2="419" stroke="#d44a4a" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="540" y="423" class="run-label" fill="#1a1a2e">floor=4 target</text>
</svg>
