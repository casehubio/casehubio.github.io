<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .title { font-size: 16px; font-weight: 700; fill: #1e293b; }
    .subtitle { font-size: 11px; fill: #64748b; }
    .mono { font-family: "SF Mono", "Fira Code", monospace; font-size: 11px; }
    .label { font-size: 11px; font-weight: 600; fill: #1e293b; }
    .small { font-size: 9px; fill: #64748b; }
    .quad { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <text x="380" y="28" text-anchor="middle" class="title">Archetype Compatibility: Set Intersection Derivation</text>
  <text x="380" y="46" text-anchor="middle" class="subtitle">Compatible archetype families for an INTJ, Type 5 Enneagram agent</text>

  <!-- Framework inputs -->
  <rect x="30" y="70" width="170" height="100" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="115" y="92" text-anchor="middle" class="label" fill="#6366f1">MBTI: INTJ</text>
  <text x="115" y="112" text-anchor="middle" class="mono" fill="#475569" font-size="10">compatible families:</text>
  <rect x="48" y="120" width="52" height="18" rx="4" fill="#ddd6fe"/>
  <text x="74" y="133" text-anchor="middle" font-size="9" font-weight="600" fill="#5b21b6">SAGE</text>
  <rect x="106" y="120" width="70" height="18" rx="4" fill="#ddd6fe"/>
  <text x="141" y="133" text-anchor="middle" font-size="9" font-weight="600" fill="#5b21b6">MAGICIAN</text>
  <rect x="48" y="142" width="78" height="18" rx="4" fill="#ddd6fe"/>
  <text x="87" y="155" text-anchor="middle" font-size="9" font-weight="600" fill="#5b21b6">SOVEREIGN</text>

  <rect x="30" y="185" width="170" height="100" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="115" y="207" text-anchor="middle" class="label" fill="#16a34a">Enneagram: Type 5</text>
  <text x="115" y="227" text-anchor="middle" class="mono" fill="#475569" font-size="10">compatible families:</text>
  <rect x="48" y="235" width="52" height="18" rx="4" fill="#bbf7d0"/>
  <text x="74" y="248" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">SAGE</text>
  <rect x="106" y="235" width="72" height="18" rx="4" fill="#bbf7d0"/>
  <text x="142" y="248" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">EXPLORER</text>
  <rect x="48" y="257" width="70" height="18" rx="4" fill="#bbf7d0"/>
  <text x="83" y="270" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">MAGICIAN</text>

  <!-- Intersection arrow -->
  <line x1="200" y1="170" x2="260" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="230" y="163" text-anchor="middle" font-size="24" fill="#64748b">∩</text>

  <!-- Intersection result -->
  <rect x="270" y="130" width="190" height="80" rx="8" fill="#fefce8" stroke="#f59e0b" stroke-width="2" filter="url(#sh)"/>
  <text x="365" y="155" text-anchor="middle" class="label" fill="#92400e">Intersection</text>
  <rect x="295" y="165" width="52" height="20" rx="4" fill="#fde68a"/>
  <text x="321" y="179" text-anchor="middle" font-size="10" font-weight="700" fill="#78350f">SAGE</text>
  <rect x="355" y="165" width="80" height="20" rx="4" fill="#fde68a"/>
  <text x="395" y="179" text-anchor="middle" font-size="10" font-weight="700" fill="#78350f">MAGICIAN</text>

  <!-- Arrow to archetype grid -->
  <line x1="460" y1="170" x2="500" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="480" y="162" text-anchor="middle" font-size="10" fill="#64748b" font-weight="600">resolve</text>

  <!-- Archetype quadrant wheel -->
  <!-- SAGE sub-archetypes -->
  <rect x="510" y="70" width="230" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" filter="url(#sh)"/>
  <text x="520" y="90" class="quad" fill="#0891b2">INDEPENDENCE — SAGE</text>

  <rect x="525" y="100" width="70" height="22" rx="4" fill="#ecfeff" stroke="#67e8f9" stroke-width="1"/>
  <text x="560" y="115" text-anchor="middle" font-size="9" fill="#0891b2">detective</text>
  <rect x="600" y="100" width="60" height="22" rx="4" fill="#ecfeff" stroke="#67e8f9" stroke-width="1"/>
  <text x="630" y="115" text-anchor="middle" font-size="9" fill="#0891b2">mentor</text>
  <rect x="665" y="100" width="60" height="22" rx="4" fill="#ecfeff" stroke="#67e8f9" stroke-width="1"/>
  <text x="695" y="115" text-anchor="middle" font-size="9" fill="#0891b2">shaman</text>
  <rect x="525" y="128" width="75" height="22" rx="4" fill="#ecfeff" stroke="#67e8f9" stroke-width="1"/>
  <text x="562" y="143" text-anchor="middle" font-size="9" fill="#0891b2">translator</text>

  <text x="525" y="170" class="small">affinity: detective ← INTJ, type-5</text>
  <text x="525" y="182" class="small">affinity: shaman ← type-5</text>

  <!-- MAGICIAN sub-archetypes -->
  <rect x="510" y="200" width="230" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" filter="url(#sh)"/>
  <text x="520" y="220" class="quad" fill="#7c3aed">MASTERY — MAGICIAN</text>

  <rect x="525" y="230" width="70" height="22" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="560" y="245" text-anchor="middle" font-size="9" fill="#7c3aed">alchemist</text>
  <rect x="600" y="230" width="65" height="22" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="632" y="245" text-anchor="middle" font-size="9" fill="#7c3aed">engineer</text>
  <rect x="670" y="230" width="62" height="22" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="701" y="245" text-anchor="middle" font-size="9" fill="#7c3aed">innovator</text>
  <rect x="525" y="258" width="60" height="22" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="555" y="273" text-anchor="middle" font-size="9" fill="#7c3aed">scientist</text>

  <text x="525" y="300" class="small">affinity: alchemist ← INTJ, type-5</text>
  <text x="525" y="312" class="small">affinity: engineer ← INTJ, type-5</text>
  <text x="525" y="324" class="small">affinity: scientist ← INTJ, type-5</text>

  <!-- Bottom callout -->
  <rect x="30" y="350" width="710" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="374" class="label" font-size="12">All of this is in the manifest.</text>
  <text x="50" y="394" class="small" font-size="10" fill="#475569">archetypeCompatibility gives the family-level match. archetypeAffinities narrows to specific sub-archetypes.</text>
  <text x="50" y="412" class="small" font-size="10" fill="#475569">A frontend building an avatar picker doesn't need to understand set intersection — it reads the precomputed result.</text>
</svg>
