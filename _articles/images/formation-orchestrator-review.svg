<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">BottomUpFormationOrchestrator — Before / After Review</text>

  <!-- BEFORE side -->
  <text x="180" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">BEFORE</text>

  <!-- Observer box -->
  <rect x="30" y="65" width="300" height="45" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="180" y="83" text-anchor="middle" font-weight="500" fill="#991b1b">ChannelObserver.onMessage()</text>
  <text x="180" y="100" text-anchor="middle" font-size="11" fill="#7f1d1d">try-catch wraps projection only</text>

  <!-- Subscriber callback -->
  <rect x="50" y="125" width="260" height="40" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="180" y="150" text-anchor="middle" font-size="12" fill="#9a3412">sink.accept() → handleOutcome() — NO try-catch</text>

  <!-- Exception escapes -->
  <line x1="180" y1="165" x2="180" y2="195" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="60" y="198" width="240" height="35" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="220" text-anchor="middle" font-weight="600" font-size="12" fill="#dc2626">💥 Dispatch thread crashes</text>

  <!-- Double execution -->
  <rect x="30" y="250" width="300" height="55" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="180" y="270" text-anchor="middle" font-weight="500" fill="#991b1b">No execution guard</text>
  <text x="180" y="290" text-anchor="middle" font-size="11" fill="#7f1d1d">Thread A: handleOutcome() → proposeGroup()</text>
  <text x="180" y="305" text-anchor="middle" font-size="11" fill="#7f1d1d">Thread B: handleOutcome() → proposeGroup() ⚠️ duplicate</text>

  <!-- AFTER side -->
  <text x="540" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">AFTER</text>

  <!-- Observer box -->
  <rect x="390" y="65" width="300" height="45" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="540" y="83" text-anchor="middle" font-weight="500" fill="#166534">ChannelObserver.onMessage()</text>
  <text x="540" y="100" text-anchor="middle" font-size="11" fill="#14532d">projection update (unchanged)</text>

  <!-- Subscriber callback with try-catch -->
  <rect x="410" y="125" width="260" height="55" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="540" y="145" text-anchor="middle" font-size="12" fill="#166534">sink.accept() → try {</text>
  <text x="540" y="161" text-anchor="middle" font-size="12" fill="#166534">  handleOutcome()</text>
  <text x="540" y="177" text-anchor="middle" font-size="12" fill="#166534">} catch → emitter.fail(e)</text>

  <!-- Clean propagation -->
  <line x1="540" y1="180" x2="540" y2="210" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="420" y="213" width="240" height="35" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="235" text-anchor="middle" font-weight="600" font-size="12" fill="#16a34a">✓ Uni fails cleanly, cleanup runs</text>

  <!-- AtomicBoolean guard -->
  <rect x="390" y="265" width="300" height="55" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="540" y="285" text-anchor="middle" font-weight="500" fill="#166534">AtomicBoolean guard</text>
  <text x="540" y="305" text-anchor="middle" font-size="11" fill="#14532d">handled.compareAndSet(false, true)</text>
  <text x="540" y="320" text-anchor="middle" font-size="11" fill="#14532d">First caller wins — rest are no-ops</text>

  <!-- Divider -->
  <line x1="355" y1="60" x2="355" y2="340" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Summary bar -->
  <rect x="30" y="355" width="660" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="375" text-anchor="middle" font-size="12" fill="#475569">Two bugs in the seams: exception escape crashes dispatch thread, concurrent messages duplicate groups.</text>
  <text x="360" y="393" text-anchor="middle" font-size="12" font-weight="500" fill="#475569">Fix: try-catch + AtomicBoolean. First-wins semantics on both observer and timeout paths.</text>
</svg>
