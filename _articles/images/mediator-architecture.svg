<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28a745"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc3545"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Budget-Gated Conflict Mediation</text>

  <!-- Conflict source -->
  <rect x="20" y="55" width="140" height="50" rx="6" fill="#fff3cd" stroke="#e0a800" stroke-width="1.5"/>
  <text x="90" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">Conflict</text>
  <text x="90" y="93" text-anchor="middle" font-size="9" fill="#856404">Detected</text>

  <!-- Arrow to budget gate -->
  <line x1="160" y1="80" x2="210" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Budget gate diamond -->
  <polygon points="280,45 350,80 280,115 210,80" fill="#e8eef4" stroke="#0069d9" stroke-width="1.5"/>
  <text x="280" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#004085">Budget</text>
  <text x="280" y="90" text-anchor="middle" font-size="10" font-weight="bold" fill="#004085">Gate</text>

  <!-- Granted path -->
  <line x1="350" y1="80" x2="420" y2="80" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="385" y="73" font-size="9" fill="#28a745" font-weight="bold">granted</text>

  <!-- LLM Mediator -->
  <rect x="420" y="55" width="140" height="50" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="490" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#155724">LLM Mediator</text>
  <text x="490" y="91" text-anchor="middle" font-size="9" fill="#155724">StructuredAgentInvoker</text>

  <!-- Denied path -->
  <line x1="280" y1="115" x2="280" y2="195" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <text x="290" y="155" font-size="9" fill="#dc3545" font-weight="bold">denied</text>

  <!-- LLM error path -->
  <line x1="490" y1="105" x2="490" y2="195" stroke="#dc3545" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrRed)"/>
  <text x="500" y="155" font-size="9" fill="#dc3545">error</text>

  <!-- Heuristic fallback -->
  <rect x="210" y="200" width="350" height="50" rx="6" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="385" y="223" text-anchor="middle" font-size="11" font-weight="bold" fill="#721c24">Heuristic Fallback</text>
  <text x="385" y="239" text-anchor="middle" font-size="9" fill="#721c24">Deterministic per-type resolution — no LLM needed</text>

  <!-- Result arrows -->
  <line x1="560" y1="80" x2="630" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="560" y1="225" x2="630" y2="225" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Results -->
  <rect x="630" y="60" width="55" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
  <text x="657" y="84" text-anchor="middle" font-size="9" fill="#333">Resolved</text>

  <rect x="630" y="205" width="55" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
  <text x="657" y="222" text-anchor="middle" font-size="9" fill="#333">Fallback</text>
  <text x="657" y="234" text-anchor="middle" font-size="9" fill="#333">Applied</text>

  <!-- Legend -->
  <text x="30" y="290" font-size="10" fill="#666">Both paths update BeliefSet and notify affected swarms.</text>
  <text x="30" y="305" font-size="10" fill="#666">The system always resolves — it never drops a conflict silently.</text>
</svg>
