<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" fill="#f8fafc" rx="8"/>

  <!-- Strategy box -->
  <rect x="30" y="30" width="180" height="60" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="120" y="55" text-anchor="middle" font-weight="600" fill="#0c4a6e">SimulationStrategy</text>
  <text x="120" y="72" text-anchor="middle" font-size="11" fill="#475569">resolve(input) → output</text>

  <!-- Arrow: Strategy → PhasedCorpus -->
  <line x1="210" y1="60" x2="280" y2="60" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="52" text-anchor="middle" font-size="10" fill="#64748b">lookupByKey()</text>

  <!-- PhasedCorpus box -->
  <rect x="285" y="20" width="180" height="80" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="375" y="45" text-anchor="middle" font-weight="600" fill="#92400e">PhasedCorpus</text>
  <text x="375" y="62" text-anchor="middle" font-size="11" fill="#78350f">activePhase() →</text>
  <text x="375" y="77" text-anchor="middle" font-size="11" fill="#78350f">delegate to phase data</text>

  <!-- Arrow: PhasedCorpus → CorpusSelector -->
  <line x1="375" y1="100" x2="375" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="130" font-size="10" fill="#64748b">which phase?</text>

  <!-- CorpusSelector box -->
  <rect x="285" y="155" width="180" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="375" y="178" text-anchor="middle" font-weight="600" fill="#5b21b6">CorpusSelector</text>
  <text x="375" y="193" text-anchor="middle" font-size="11" fill="#6d28d9">activePhase() → "pending"</text>

  <!-- Phase data boxes -->
  <rect x="520" y="20" width="170" height="55" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="605" y="40" text-anchor="middle" font-weight="500" fill="#166534">Phase: pending</text>
  <text x="605" y="56" text-anchor="middle" font-size="11" fill="#15803d">{ status: "PENDING" }</text>

  <rect x="520" y="85" width="170" height="55" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="605" y="105" text-anchor="middle" font-weight="500" fill="#166534">Phase: shipped</text>
  <text x="605" y="121" text-anchor="middle" font-size="11" fill="#15803d">{ status: "SHIPPED" }</text>

  <rect x="520" y="150" width="170" height="55" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="605" y="170" text-anchor="middle" font-weight="500" fill="#166534">Phase: delivered</text>
  <text x="605" y="186" text-anchor="middle" font-size="11" fill="#15803d">{ status: "DELIVERED" }</text>

  <!-- Arrow: PhasedCorpus → Phase data -->
  <line x1="465" y1="50" x2="515" y2="47" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Four selector types -->
  <rect x="30" y="230" width="150" height="45" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
  <text x="105" y="250" text-anchor="middle" font-weight="500" fill="#9d174d">StateMachine</text>
  <text x="105" y="265" text-anchor="middle" font-size="10" fill="#be185d">step triggers</text>

  <rect x="200" y="230" width="150" height="45" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
  <text x="275" y="250" text-anchor="middle" font-weight="500" fill="#9d174d">Duration</text>
  <text x="275" y="265" text-anchor="middle" font-size="10" fill="#be185d">wall-clock time</text>

  <rect x="370" y="230" width="150" height="45" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
  <text x="445" y="250" text-anchor="middle" font-weight="500" fill="#9d174d">LookupCount</text>
  <text x="445" y="265" text-anchor="middle" font-size="10" fill="#be185d">Nth resolution</text>

  <rect x="540" y="230" width="150" height="45" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
  <text x="615" y="250" text-anchor="middle" font-weight="500" fill="#9d174d">Random</text>
  <text x="615" y="265" text-anchor="middle" font-size="10" fill="#be185d">weighted probability</text>

  <!-- Arrows from CorpusSelector to selector types -->
  <line x1="320" y1="205" x2="105" y2="225" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="345" y1="205" x2="275" y2="225" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="405" y1="205" x2="445" y2="225" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="430" y1="205" x2="615" y2="225" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Label -->
  <text x="360" y="308" text-anchor="middle" font-size="11" fill="#64748b">Four implementations — the strategy doesn't know phases exist</text>
</svg>
