<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #1a1a2e; }
    .label { font-size: 11px; fill: #1a1a2e; }
    .sublabel { font-size: 10px; fill: #666; }
    .arrow { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .box { stroke: #334155; stroke-width: 1.5; rx: 6; }
    .box-before { fill: #fef2f2; }
    .box-after { fill: #f0fdf4; }
    .box-shared { fill: #eff6ff; }
    .strike { stroke: #dc2626; stroke-width: 2; }
    .divider { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4,4; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <!-- Divider -->
  <line x1="355" y1="10" x2="355" y2="290" class="divider"/>

  <!-- Before: left side -->
  <text x="170" y="24" text-anchor="middle" class="title">Before: Class Hierarchy</text>

  <rect x="100" y="38" width="140" height="32" class="box box-shared"/>
  <text x="170" y="58" text-anchor="middle" class="label">CoordinationTopology</text>

  <line x1="115" y1="70" x2="82" y2="92" class="arrow"/>
  <line x1="170" y1="70" x2="170" y2="92" class="arrow"/>
  <line x1="225" y1="70" x2="262" y2="92" class="arrow"/>

  <rect x="30" y="92" width="105" height="28" class="box box-before"/>
  <text x="82" y="110" text-anchor="middle" class="label">HiveTopology</text>
  <line x1="30" y1="92" x2="135" y2="120" class="strike"/>

  <rect x="145" y="92" width="105" height="28" class="box box-before"/>
  <text x="197" y="110" text-anchor="middle" class="label">Distributed...</text>
  <line x1="145" y1="92" x2="250" y2="120" class="strike"/>

  <rect x="260" y="92" width="105" height="28" class="box box-before"/>
  <text x="312" y="110" text-anchor="middle" class="label">Hierarchical...</text>
  <line x1="260" y1="92" x2="365" y2="120" class="strike"/>

  <text x="82" y="148" text-anchor="middle" class="sublabel">onDegradation()</text>
  <text x="82" y="161" text-anchor="middle" class="sublabel">cascadeTriggered</text>
  <text x="82" y="174" text-anchor="middle" class="sublabel">cascadeThreshold</text>

  <text x="197" y="148" text-anchor="middle" class="sublabel">executeLocal()</text>
  <text x="197" y="161" text-anchor="middle" class="sublabel">return SUCCESS</text>

  <text x="312" y="148" text-anchor="middle" class="sublabel">onDegradation()</text>
  <text x="312" y="161" text-anchor="middle" class="sublabel">cascadeTriggered</text>
  <text x="312" y="174" text-anchor="middle" class="sublabel">cascadeThreshold</text>

  <text x="197" y="205" text-anchor="middle" class="sublabel" style="fill: #dc2626; font-style: italic;">Copy-paste across 4 classes</text>

  <!-- After: right side -->
  <text x="540" y="24" text-anchor="middle" class="title">After: Composable Builder</text>

  <rect x="440" y="38" width="200" height="32" class="box box-after"/>
  <text x="540" y="58" text-anchor="middle" class="label">TopologyBuilder</text>

  <line x1="490" y1="70" x2="490" y2="88" class="arrow"/>
  <line x1="540" y1="70" x2="540" y2="88" class="arrow"/>
  <line x1="590" y1="70" x2="590" y2="88" class="arrow"/>

  <rect x="450" y="88" width="80" height="24" class="box box-after"/>
  <text x="490" y="104" text-anchor="middle" class="sublabel">.hive(...)</text>

  <rect x="540" y="88" width="80" height="24" class="box box-after"/>
  <text x="580" y="104" text-anchor="middle" class="sublabel">.distributed(...)</text>

  <rect x="630" y="88" width="80" height="24" class="box box-after"/>
  <text x="670" y="104" text-anchor="middle" class="sublabel">.hierarchical(...)</text>

  <line x1="490" y1="112" x2="540" y2="135" class="arrow"/>
  <line x1="580" y1="112" x2="540" y2="135" class="arrow"/>
  <line x1="670" y1="112" x2="540" y2="135" class="arrow"/>

  <rect x="450" y="135" width="180" height="28" class="box box-after"/>
  <text x="540" y="153" text-anchor="middle" class="label">ComposableTopology</text>

  <line x1="500" y1="163" x2="460" y2="185" class="arrow"/>
  <line x1="540" y1="163" x2="540" y2="185" class="arrow"/>
  <line x1="580" y1="163" x2="620" y2="185" class="arrow"/>

  <rect x="395" y="185" width="130" height="24" class="box box-shared"/>
  <text x="460" y="201" text-anchor="middle" class="sublabel">LoopPlanner</text>

  <rect x="535" y="185" width="130" height="24" class="box box-shared"/>
  <text x="600" y="201" text-anchor="middle" class="sublabel">OutcomeExecutor</text>

  <rect x="395" y="218" width="130" height="24" class="box box-shared"/>
  <text x="460" y="234" text-anchor="middle" class="sublabel">DegradationCascade</text>

  <rect x="535" y="218" width="130" height="24" class="box box-shared"/>
  <text x="600" y="234" text-anchor="middle" class="sublabel">FeedbackHandler</text>

  <text x="540" y="268" text-anchor="middle" class="sublabel" style="fill: #16a34a; font-style: italic;">One class, four strategies, zero duplication</text>
</svg>
