<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="ar-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="ar-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <filter id="s" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .title { font-size: 14px; font-weight: 700; fill: #1e293b; }
    .subtitle { font-size: 11px; fill: #64748b; }
    .mono { font-family: "SF Mono", "Fira Code", monospace; font-size: 10px; fill: #475569; }
    .label { font-size: 11px; font-weight: 600; fill: #1e293b; }
    .small { font-size: 9px; fill: #64748b; }
  </style>

  <!-- Before side -->
  <text x="190" y="26" text-anchor="middle" class="title" fill="#dc2626">Before: Duplicated Data</text>

  <!-- Java enums -->
  <rect x="20" y="40" width="160" height="120" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" filter="url(#s)"/>
  <text x="100" y="62" text-anchor="middle" class="label" fill="#6366f1">eidos-vocab</text>
  <text x="40" y="82" class="mono">MbtiTypeTerm.java</text>
  <text x="40" y="96" class="mono">EnneagramTerm.java</text>
  <text x="40" y="110" class="mono">DiscTerm.java</text>
  <text x="40" y="124" class="mono">BelbinTerm.java</text>
  <text x="40" y="138" class="mono">+ 4 more enums</text>

  <!-- Crossed-out sync -->
  <line x1="180" y1="100" x2="200" y2="100" stroke="#dc2626" stroke-width="2"/>
  <text x="190" y="93" text-anchor="middle" font-size="18" fill="#dc2626">✗</text>

  <!-- TS copies -->
  <rect x="210" y="40" width="160" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#s)"/>
  <text x="290" y="62" text-anchor="middle" class="label" fill="#dc2626">blocks-ui</text>
  <text x="230" y="82" class="mono" fill="#991b1b">framework-descriptors.ts</text>
  <text x="230" y="96" class="mono" fill="#991b1b">disposition-mapping.ts</text>
  <text x="230" y="110" class="mono" fill="#991b1b">compatibility-matrix.ts</text>
  <text x="230" y="130" class="small" fill="#dc2626">hand-maintained copies</text>
  <text x="230" y="143" class="small" fill="#dc2626">less rich, drift risk</text>

  <!-- Divergence indicators -->
  <rect x="20" y="175" width="350" height="45" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="40" y="195" class="label" fill="#dc2626" font-size="10">Problems:</text>
  <text x="115" y="195" class="small" fill="#991b1b" font-size="10">No sync mechanism · values drift silently · TS has z.string() not z.enum()</text>
  <text x="40" y="210" class="small" fill="#991b1b" font-size="10">New vocabulary term in Java? Someone has to remember to update 3 TS files.</text>

  <!-- After side -->
  <text x="575" y="26" text-anchor="middle" class="title" fill="#16a34a">After: Single Source of Truth</text>

  <!-- Java enums -->
  <rect x="420" y="40" width="140" height="100" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" filter="url(#s)"/>
  <text x="490" y="62" text-anchor="middle" class="label" fill="#6366f1">eidos-vocab</text>
  <text x="440" y="82" class="mono">Java enums</text>
  <text x="440" y="96" class="mono">(authoritative)</text>
  <text x="440" y="120" class="small" fill="#6366f1">build-time generation</text>

  <!-- Arrow down -->
  <line x1="490" y1="140" x2="490" y2="170" stroke="#16a34a" stroke-width="2" marker-end="url(#ar-green)"/>

  <!-- JSON manifest -->
  <rect x="420" y="175" width="140" height="55" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#s)"/>
  <text x="490" y="200" text-anchor="middle" class="label" fill="#16a34a" font-size="10">personality-vocab.json</text>
  <text x="490" y="218" text-anchor="middle" class="small" fill="#16a34a">in the JAR, always current</text>

  <!-- Arrows to consumers -->
  <line x1="560" y1="200" x2="610" y2="160" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ar-green)"/>
  <line x1="560" y1="200" x2="610" y2="200" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ar-green)"/>
  <line x1="560" y1="200" x2="610" y2="240" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ar-green)"/>

  <!-- Consumer boxes -->
  <rect x="615" y="143" width="125" height="30" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="677" y="162" text-anchor="middle" class="mono" fill="#16a34a">blocks-ui</text>

  <rect x="615" y="185" width="125" height="30" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="677" y="204" text-anchor="middle" class="mono" fill="#16a34a">any frontend</text>

  <rect x="615" y="227" width="125" height="30" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="677" y="246" text-anchor="middle" class="mono" fill="#16a34a">documentation</text>

  <!-- Result box -->
  <rect x="420" y="275" width="320" height="70" rx="6" fill="#f0fdf4" stroke="#34d399" stroke-width="1"/>
  <text x="440" y="295" class="label" fill="#059669" font-size="10">Result:</text>
  <text x="440" y="312" class="small" fill="#475569" font-size="10">Add a term in Java → manifest updates at build time → consumers pick it up</text>
  <text x="440" y="328" class="small" fill="#475569" font-size="10">TS gets z.enum() types. No hand-maintained copies. No drift.</text>
</svg>
