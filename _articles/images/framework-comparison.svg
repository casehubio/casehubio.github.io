<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="system-ui, -apple-system, sans-serif">

  <!-- Left: typical framework -->
  <rect x="20" y="20" width="340" height="320" rx="12" fill="#fafafa" stroke="#dadce0" stroke-width="1.5"/>
  <text x="40" y="50" font-size="14" font-weight="bold" fill="#c62828">Typical multi-agent framework</text>
  <text x="40" y="72" font-size="11" fill="#5f6368">Agents are peers. No structure. No lifecycle.</text>

  <!-- Scattered agents -->
  <circle cx="100" cy="140" r="22" fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
  <text x="92" y="144" font-size="10" font-weight="bold" fill="#c62828">A1</text>
  <circle cx="200" cy="120" r="22" fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
  <text x="192" y="124" font-size="10" font-weight="bold" fill="#c62828">A2</text>
  <circle cx="280" cy="160" r="22" fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
  <text x="272" y="164" font-size="10" font-weight="bold" fill="#c62828">A3</text>
  <circle cx="150" cy="200" r="22" fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
  <text x="142" y="204" font-size="10" font-weight="bold" fill="#c62828">A4</text>
  <circle cx="250" cy="220" r="22" fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
  <text x="242" y="224" font-size="10" font-weight="bold" fill="#c62828">A5</text>

  <!-- Chaotic lines -->
  <line x1="122" y1="140" x2="178" y2="120" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="222" y1="120" x2="258" y2="160" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="100" y1="162" x2="150" y2="178" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="200" y1="142" x2="250" y2="198" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="172" y1="200" x2="228" y2="220" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="122" y1="148" x2="258" y2="152" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="150" y1="222" x2="280" y2="182" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Problems -->
  <text x="40" y="272" font-size="10" fill="#c62828">? Who can do what?</text>
  <text x="40" y="290" font-size="10" fill="#c62828">? How do teams form?</text>
  <text x="40" y="308" font-size="10" fill="#c62828">? What happens when roles conflict?</text>
  <text x="40" y="326" font-size="10" fill="#c62828">? How do you restructure safely?</text>

  <!-- Right: with org layer -->
  <rect x="400" y="20" width="340" height="320" rx="12" fill="#fafafa" stroke="#dadce0" stroke-width="1.5"/>
  <text x="420" y="50" font-size="14" font-weight="bold" fill="#1a73e8">With an organisational layer</text>
  <text x="420" y="72" font-size="11" fill="#5f6368">Groups, roles, policies, lifecycle.</text>

  <!-- Group boundary -->
  <rect x="430" y="90" width="280" height="150" rx="16" fill="#e8f0fe" stroke="#4285f4" stroke-width="2" stroke-dasharray="0"/>
  <text x="448" y="112" font-size="10" fill="#1a73e8" font-weight="bold">Review Team (ACTIVE)</text>

  <!-- Structured agents with roles -->
  <circle cx="490" cy="160" r="22" fill="#c8e6c9" stroke="#43a047" stroke-width="1.5"/>
  <text x="478" y="156" font-size="9" font-weight="bold" fill="#2e7d32">A1</text>
  <text x="475" y="170" font-size="8" fill="#2e7d32">reviewer</text>

  <circle cx="590" cy="140" r="22" fill="#c8e6c9" stroke="#43a047" stroke-width="1.5"/>
  <text x="578" y="136" font-size="9" font-weight="bold" fill="#2e7d32">A2</text>
  <text x="578" y="150" font-size="8" fill="#2e7d32">author</text>

  <circle cx="660" cy="180" r="22" fill="#c8e6c9" stroke="#43a047" stroke-width="1.5"/>
  <text x="648" y="176" font-size="9" font-weight="bold" fill="#2e7d32">A3</text>
  <text x="643" y="190" font-size="8" fill="#2e7d32">reviewer</text>

  <!-- Constraint label -->
  <rect x="445" y="200" width="250" height="26" rx="4" fill="#fff" stroke="#4285f4" stroke-width="1"/>
  <text x="458" y="218" font-size="9" fill="#1a73e8">1-3 reviewers | 1 author | author != auditor</text>

  <!-- Answers -->
  <text x="420" y="272" font-size="10" fill="#1a73e8">RoleSpec: cardinality + incompatibility</text>
  <text x="420" y="290" font-size="10" fill="#1a73e8">FormationRules: 3 paths, policy-gated</text>
  <text x="420" y="308" font-size="10" fill="#1a73e8">Bidirectional incompatibility checking</text>
  <text x="420" y="326" font-size="10" fill="#1a73e8">Desired-state reconciliation + rollback</text>
</svg>
