<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="system-ui, sans-serif" font-size="12">
  <rect width="620" height="320" fill="#fafafa" rx="6"/>

  <!-- shell box -->
  <rect x="160" y="20" width="300" height="280" fill="none" stroke="#4d99cc" stroke-width="2" rx="8" stroke-dasharray="8,4"/>
  <text x="310" y="14" text-anchor="middle" fill="#4d99cc" font-weight="600" font-size="11">agency-summarisation-timeline (shell)</text>

  <!-- DataSourceMixin -->
  <rect x="30" y="60" width="120" height="50" fill="#e0f0ff" stroke="#4d99cc" stroke-width="1.5" rx="6"/>
  <text x="90" y="82" text-anchor="middle" fill="#0066cc" font-weight="600" font-size="11">DSM</text>
  <text x="90" y="96" text-anchor="middle" fill="#0066cc" font-size="10">snapshot endpoint</text>

  <!-- DataSourceAdapter -->
  <rect x="30" y="180" width="120" height="50" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5" rx="6"/>
  <text x="90" y="202" text-anchor="middle" fill="#856404" font-weight="600" font-size="11">DSA</text>
  <text x="90" y="216" text-anchor="middle" fill="#856404" font-size="10">narrative endpoint</text>

  <!-- _snapshot state -->
  <rect x="180" y="60" width="100" height="40" fill="#d4edda" stroke="#28a745" stroke-width="1" rx="4"/>
  <text x="230" y="84" text-anchor="middle" fill="#155724" font-size="11">_snapshot</text>

  <!-- _narrativeSteps state -->
  <rect x="180" y="180" width="100" height="40" fill="#d4edda" stroke="#28a745" stroke-width="1" rx="4"/>
  <text x="230" y="200" text-anchor="middle" fill="#155724" font-size="10">_narrativeSteps</text>

  <!-- lanes -->
  <rect x="320" y="45" width="120" height="28" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="4"/>
  <text x="380" y="63" text-anchor="middle" fill="#333" font-size="11">L1 — Raw Events</text>

  <rect x="320" y="80" width="120" height="28" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="4"/>
  <text x="380" y="98" text-anchor="middle" fill="#333" font-size="11">L2 — Episodes</text>

  <rect x="320" y="115" width="120" height="28" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="4"/>
  <text x="380" y="133" text-anchor="middle" fill="#333" font-size="11">L3 — Phases</text>

  <rect x="320" y="180" width="120" height="28" fill="#fff3cd" stroke="#b8860b" stroke-width="1" rx="4"/>
  <text x="380" y="198" text-anchor="middle" fill="#856404" font-size="11">L4 — Narrative</text>

  <!-- arrows: DSM → _snapshot -->
  <line x1="150" y1="85" x2="178" y2="80" stroke="#4d99cc" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- arrows: _snapshot → lanes L1-L3 -->
  <line x1="280" y1="70" x2="318" y2="59" stroke="#28a745" stroke-width="1"/>
  <line x1="280" y1="80" x2="318" y2="94" stroke="#28a745" stroke-width="1"/>
  <line x1="280" y1="85" x2="318" y2="129" stroke="#28a745" stroke-width="1"/>

  <!-- arrows: DSA → _narrativeSteps -->
  <line x1="150" y1="205" x2="178" y2="200" stroke="#b8860b" stroke-width="1.5" marker-end="url(#arrow-gold)"/>

  <!-- arrows: _narrativeSteps → L4 -->
  <line x1="280" y1="200" x2="318" y2="194" stroke="#28a745" stroke-width="1"/>

  <!-- fallback dotted line: _snapshot → _narrativeSteps -->
  <line x1="230" y1="100" x2="230" y2="178" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="255" y="145" fill="#999" font-size="9" font-style="italic">fallback</text>

  <!-- legend -->
  <rect x="340" y="240" width="14" height="14" fill="#e0f0ff" stroke="#4d99cc" rx="2"/>
  <text x="360" y="252" fill="#333" font-size="10">DataSourceMixin (primary)</text>

  <rect x="340" y="260" width="14" height="14" fill="#fff3cd" stroke="#b8860b" rx="2"/>
  <text x="360" y="272" fill="#333" font-size="10">DataSourceAdapter (narrative)</text>

  <line x1="340" y1="287" x2="354" y2="287" stroke="#999" stroke-dasharray="4,3"/>
  <text x="360" y="291" fill="#333" font-size="10">fallback when no narrative-endpoint</text>

  <!-- arrow markers -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4d99cc"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#b8860b"/>
    </marker>
  </defs>
</svg>
