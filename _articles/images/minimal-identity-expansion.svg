<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr2" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">6 fields in → full agent prompt out</text>

  <!-- Input box -->
  <rect x="30" y="50" width="220" height="230" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="140" y="75" text-anchor="middle" font-weight="700" fill="#854d0e">YAML input</text>

  <text x="50" y="105" fill="#713f12" font-size="12" font-family="monospace">id: code-reviewer</text>
  <text x="50" y="125" fill="#713f12" font-size="12" font-family="monospace">name: Code Reviewer</text>
  <text x="50" y="145" fill="#713f12" font-size="12" font-family="monospace">slot: reviewer</text>
  <text x="50" y="165" fill="#713f12" font-size="12" font-family="monospace">domain: software-eng</text>
  <text x="50" y="185" fill="#713f12" font-size="12" font-family="monospace">archetype: sage</text>
  <text x="50" y="205" fill="#713f12" font-size="12" font-family="monospace">adjectives:</text>
  <text x="50" y="225" fill="#713f12" font-size="12" font-family="monospace">  - cautious</text>
  <text x="50" y="245" fill="#713f12" font-size="12" font-family="monospace">  - methodical</text>
  <text x="50" y="270" fill="#854d0e" font-size="11" font-style="italic">No MBTI. No axes. No briefing.</text>

  <!-- Arrow -->
  <line x1="250" y1="165" x2="298" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="274" y="155" text-anchor="middle" fill="#64748b" font-size="10">auto</text>

  <!-- Output box -->
  <rect x="300" y="50" width="390" height="270" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="495" y="75" text-anchor="middle" font-weight="700" fill="#166534">Rendered system prompt</text>

  <text x="320" y="105" fill="#14532d" font-weight="600" font-size="12">## Role</text>
  <text x="320" y="122" fill="#166534" font-size="11">reviewer — Domain: software-engineering</text>

  <text x="320" y="148" fill="#14532d" font-weight="600" font-size="12">## Personality</text>
  <text x="320" y="165" fill="#166534" font-size="11">Sage — cautious, methodical</text>

  <text x="320" y="191" fill="#14532d" font-weight="600" font-size="12">## How You Operate</text>
  <text x="320" y="208" fill="#166534" font-size="11">Social: autonomous | Rules: flexible</text>
  <text x="320" y="223" fill="#166534" font-size="11">Risk: cautious | Autonomy: independent</text>

  <text x="320" y="249" fill="#14532d" font-weight="600" font-size="12">## Operating Principles</text>
  <text x="320" y="266" fill="#166534" font-size="11">You are a reviewer in the software-engineering</text>
  <text x="320" y="281" fill="#166534" font-size="11">domain, embodying the sage archetype.</text>
  <text x="320" y="296" fill="#166534" font-size="11">Your approach is cautious and methodical.</text>
</svg>
