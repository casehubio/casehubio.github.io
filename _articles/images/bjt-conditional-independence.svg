<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Inter, -apple-system, sans-serif">
  <rect width="720" height="260" fill="#fafaf9" rx="8"/>

  <!-- Left: Weighted (linear) -->
  <text x="180" y="25" font-size="12" font-weight="600" text-anchor="middle" fill="#1e293b">Weighted (Linear)</text>
  <rect x="30" y="38" width="300" height="200" fill="white" stroke="#e2e8f0" rx="5"/>

  <text x="45" y="62" font-size="10" fill="#64748b">Domain match delta:</text>
  <!-- Bar: high overlap context -->
  <rect x="175" y="70" width="144" height="18" fill="#93c5fd" rx="3"/>
  <text x="170" y="83" font-size="9" text-anchor="end" fill="#475569">overlap=high</text>
  <text x="325" y="83" font-size="9" fill="#1e40af" font-weight="600">0.240</text>
  <!-- Bar: low overlap context -->
  <rect x="175" y="95" width="144" height="18" fill="#93c5fd" rx="3"/>
  <text x="170" y="108" font-size="9" text-anchor="end" fill="#475569">overlap=low</text>
  <text x="325" y="108" font-size="9" fill="#1e40af" font-weight="600">0.240</text>

  <text x="180" y="145" font-size="10" text-anchor="middle" fill="#64748b">Same delta regardless of context.</text>
  <text x="180" y="162" font-size="10" text-anchor="middle" fill="#64748b">Each variable contributes independently.</text>
  <text x="180" y="182" font-size="10" text-anchor="middle" fill="#991b1b">Cannot model: "domain matters less</text>
  <text x="180" y="197" font-size="10" text-anchor="middle" fill="#991b1b">when overlap already confirms relevance"</text>

  <!-- Right: BJT (conditional independence) -->
  <text x="540" y="25" font-size="12" font-weight="600" text-anchor="middle" fill="#1e293b">BJT (Conditional Independence)</text>
  <rect x="390" y="38" width="300" height="200" fill="white" stroke="#e2e8f0" rx="5"/>

  <text x="405" y="62" font-size="10" fill="#64748b">Domain match delta:</text>
  <!-- Bar: high overlap context — SHORTER -->
  <rect x="535" y="70" width="146" height="18" fill="#86efac" rx="3"/>
  <text x="530" y="83" font-size="9" text-anchor="end" fill="#475569">overlap=high</text>
  <text x="687" y="83" font-size="9" fill="#166534" font-weight="600">0.243</text>
  <!-- Bar: low overlap context — LONGER -->
  <rect x="535" y="95" width="123" height="18" fill="#86efac" rx="3"/>
  <text x="530" y="108" font-size="9" text-anchor="end" fill="#475569">overlap=low</text>
  <text x="664" y="108" font-size="9" fill="#166534" font-weight="600">0.206</text>

  <text x="540" y="145" font-size="10" text-anchor="middle" fill="#64748b">Different delta depending on context.</text>
  <text x="540" y="162" font-size="10" text-anchor="middle" fill="#64748b">Variables interact through the CPT.</text>
  <text x="540" y="182" font-size="10" text-anchor="middle" fill="#166534">Models: "overlap already high →</text>
  <text x="540" y="197" font-size="10" text-anchor="middle" fill="#166534">domain match adds less marginal value"</text>
</svg>
