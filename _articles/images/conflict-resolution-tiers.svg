<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="l0" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e8f4e8"/><stop offset="100%" stop-color="#d4edda"/></linearGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e8eef4"/><stop offset="100%" stop-color="#cce5ff"/></linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f4ece8"/><stop offset="100%" stop-color="#ffeeba"/></linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f4e8e8"/><stop offset="100%" stop-color="#f5c6cb"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Signal Escalation: L0 → L3</text>

  <!-- L0 -->
  <rect x="40" y="55" width="640" height="70" rx="8" fill="url(#l0)" stroke="#28a745" stroke-width="1.5"/>
  <text x="60" y="78" font-size="13" font-weight="bold" fill="#155724">L0 — Broadcast</text>
  <text x="60" y="98" font-size="11" fill="#155724">All signals flow through CoordinationBus. Zero cost. Every swarm sees everything.</text>
  <text x="60" y="113" font-size="10" fill="#666" font-style="italic">No filtering, no judgment. Pure information propagation.</text>

  <!-- Arrow L0 → L1 -->
  <line x1="360" y1="125" x2="360" y2="145" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="140" font-size="9" fill="#888">relevance filter</text>

  <!-- L1 -->
  <rect x="40" y="150" width="640" height="70" rx="8" fill="url(#l1)" stroke="#0069d9" stroke-width="1.5"/>
  <text x="60" y="173" font-size="13" font-weight="bold" fill="#004085">L1 — Relevance Scoring</text>
  <text x="60" y="193" font-size="11" fill="#004085">Bayesian junction tree scores each signal per receiving swarm. Amplifies or drops.</text>
  <text x="60" y="208" font-size="10" fill="#666" font-style="italic">Cheap — learned parameters, no LLM. Filters noise, surfaces signal.</text>

  <!-- Arrow L1 → L2 -->
  <line x1="360" y1="220" x2="360" y2="240" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="235" font-size="9" fill="#888">escalation gate</text>

  <!-- L2 -->
  <rect x="40" y="245" width="640" height="70" rx="8" fill="url(#l2)" stroke="#e0a800" stroke-width="1.5"/>
  <text x="60" y="268" font-size="13" font-weight="bold" fill="#856404">L2 — Belief Revision (AGM)</text>
  <text x="60" y="288" font-size="11" fill="#856404">BeliefSet.revise() detects contradictions. Contracts least-entrenched beliefs first.</text>
  <text x="60" y="303" font-size="10" fill="#666" font-style="italic">Mechanical — formal logic, no LLM. Identifies what conflicts, not how to resolve it.</text>

  <!-- Arrow L2 → L3 -->
  <line x1="360" y1="315" x2="360" y2="335" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="330" font-size="9" fill="#888">contradiction detected</text>

  <!-- L3 -->
  <rect x="40" y="340" width="640" height="55" rx="8" fill="url(#l3)" stroke="#dc3545" stroke-width="1.5"/>
  <text x="60" y="363" font-size="13" font-weight="bold" fill="#721c24">L3 — LLM-Mediated Resolution</text>
  <text x="60" y="383" font-size="11" fill="#721c24">LLM reasons about conflicting conclusions. Budget-gated, heuristic fallback.</text>

  <!-- Cost annotations -->
  <text x="700" y="90" text-anchor="end" font-size="10" fill="#28a745" font-weight="bold">FREE</text>
  <text x="700" y="185" text-anchor="end" font-size="10" fill="#0069d9" font-weight="bold">CHEAP</text>
  <text x="700" y="280" text-anchor="end" font-size="10" fill="#e0a800" font-weight="bold">CHEAP</text>
  <text x="700" y="370" text-anchor="end" font-size="10" fill="#dc3545" font-weight="bold">EXPENSIVE</text>
</svg>
