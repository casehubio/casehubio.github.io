<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Avatar Conversation Architecture</text>

  <!-- Browser panel -->
  <rect x="30" y="50" width="200" height="340" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="130" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Browser</text>
  <line x1="30" y1="80" x2="230" y2="80" stroke="#e2e8f0"/>

  <rect x="45" y="95" width="170" height="45" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="130" y="113" text-anchor="middle" font-size="11" font-weight="500" fill="#1e40af">conversation-panel</text>
  <text x="130" y="128" text-anchor="middle" font-size="10" fill="#3b82f6">Lit 3.x + SSE</text>

  <rect x="45" y="155" width="170" height="35" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="130" y="177" text-anchor="middle" font-size="11" fill="#166534">POST /avatar/message</text>

  <rect x="45" y="205" width="170" height="35" rx="4" fill="#fef3c7" stroke="#fde68a"/>
  <text x="130" y="222" text-anchor="middle" font-size="10" fill="#92400e">← SSE: TextDelta, ToolResult</text>
  <text x="130" y="234" text-anchor="middle" font-size="10" fill="#92400e">   ActionCard, SessionComplete</text>

  <rect x="45" y="260" width="170" height="50" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="130" y="280" text-anchor="middle" font-size="10" fill="#64748b">Message bubbles</text>
  <text x="130" y="294" text-anchor="middle" font-size="10" fill="#64748b">Markdown + DOMPurify</text>

  <rect x="45" y="325" width="170" height="50" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="130" y="345" text-anchor="middle" font-size="10" fill="#64748b">Action cards</text>
  <text x="130" y="359" text-anchor="middle" font-size="10" fill="#64748b">Confirmation dialogs</text>

  <!-- Arrow: Browser → Server -->
  <line x1="230" y1="170" x2="280" y2="170" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="255" y="162" text-anchor="middle" font-size="9" fill="#3b82f6">POST</text>

  <!-- Arrow: Server → Browser -->
  <line x1="280" y1="220" x2="230" y2="220" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="212" text-anchor="middle" font-size="9" fill="#d97706">SSE</text>

  <!-- Server panel -->
  <rect x="290" y="50" width="200" height="340" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="390" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Quarkus Server</text>
  <line x1="290" y1="80" x2="490" y2="80" stroke="#e2e8f0"/>

  <rect x="305" y="95" width="170" height="35" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="390" y="117" text-anchor="middle" font-size="11" font-weight="500" fill="#1e40af">LifeAvatarResource</text>

  <rect x="305" y="145" width="170" height="45" rx="4" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="390" y="163" text-anchor="middle" font-size="11" font-weight="500" fill="#0369a1">CognitiveAgentService</text>
  <text x="390" y="178" text-anchor="middle" font-size="10" fill="#0284c7">per-user sessions</text>

  <rect x="305" y="205" width="170" height="35" rx="4" fill="#fdf4ff" stroke="#e9d5ff"/>
  <text x="390" y="227" text-anchor="middle" font-size="11" fill="#7e22ce">AvatarDescriptorProvider</text>

  <rect x="305" y="255" width="170" height="35" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="390" y="277" text-anchor="middle" font-size="11" fill="#047857">DomainContextProvider</text>

  <rect x="305" y="305" width="170" height="35" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="390" y="327" text-anchor="middle" font-size="11" fill="#c2410c">AvatarEventMapper</text>

  <rect x="305" y="355" width="170" height="25" rx="4" fill="#fef2f2" stroke="#fecaca"/>
  <text x="390" y="372" text-anchor="middle" font-size="10" fill="#991b1b">AgentEvent → AvatarEvent</text>

  <!-- LLM panel -->
  <rect x="520" y="50" width="170" height="170" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="605" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">LLM Backend</text>
  <line x1="520" y1="80" x2="690" y2="80" stroke="#e2e8f0"/>

  <rect x="535" y="95" width="140" height="35" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="605" y="117" text-anchor="middle" font-size="11" fill="#7e22ce">AgentProvider</text>

  <rect x="535" y="145" width="140" height="35" rx="4" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="605" y="162" text-anchor="middle" font-size="10" fill="#5b21b6">openSession()</text>
  <text x="605" y="174" text-anchor="middle" font-size="10" fill="#5b21b6">query() → Multi</text>

  <rect x="535" y="195" width="140" height="15" rx="3" fill="#f1f5f9"/>
  <text x="605" y="206" text-anchor="middle" font-size="9" fill="#64748b">Claude / OpenAI / Demo</text>

  <!-- MCP panel -->
  <rect x="520" y="250" width="170" height="140" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="605" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">MCP Tools</text>
  <line x1="520" y1="280" x2="690" y2="280" stroke="#e2e8f0"/>

  <text x="535" y="298" font-size="10" fill="#475569">• life/tasks — CRUD</text>
  <text x="535" y="314" font-size="10" fill="#475569">• life/actors — lookup</text>
  <text x="535" y="330" font-size="10" fill="#475569">• life/cases — start case</text>
  <text x="535" y="346" font-size="10" fill="#475569">• life/dashboard — briefing</text>
  <text x="535" y="362" font-size="10" fill="#475569">• life/analytics</text>
  <text x="535" y="378" font-size="10" fill="#475569">• life/events</text>

  <!-- Arrow: Server → LLM -->
  <line x1="490" y1="165" x2="530" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: LLM → MCP -->
  <line x1="605" y1="215" x2="605" y2="245" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="618" y="233" font-size="9" fill="#64748b">tool calls</text>
</svg>
