<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="720" height="280" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Step Completion Drives State Machine Drives Corpus</text>

  <!-- Playbook steps row -->
  <text x="20" y="60" font-size="10" font-weight="600" fill="#64748b" text-transform="uppercase" letter-spacing="1">PLAYBOOK STEPS</text>

  <rect x="20" y="70" width="140" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="90" y="94" text-anchor="middle" font-weight="500" fill="#92400e">check-order</text>

  <rect x="200" y="70" width="160" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="280" y="94" text-anchor="middle" font-weight="500" fill="#92400e">process-payment</text>

  <rect x="400" y="70" width="140" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="470" y="94" text-anchor="middle" font-weight="500" fill="#92400e">ship-order</text>

  <line x1="160" y1="90" x2="195" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="90" x2="395" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- advance() calls -->
  <line x1="90" y1="110" x2="90" y2="145" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="95" y="135" font-size="9" fill="#0284c7">advance()</text>

  <line x1="280" y1="110" x2="280" y2="145" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="285" y="135" font-size="9" fill="#0284c7">advance()</text>

  <line x1="470" y1="110" x2="470" y2="145" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="475" y="135" font-size="9" fill="#0284c7">advance()</text>

  <!-- State machine row -->
  <text x="20" y="162" font-size="10" font-weight="600" fill="#64748b" text-transform="uppercase" letter-spacing="1">STATE MACHINE</text>

  <rect x="20" y="170" width="100" height="36" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="70" y="192" text-anchor="middle" font-weight="600" font-size="11" fill="#0c4a6e">pending</text>

  <rect x="160" y="170" width="100" height="36" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="210" y="192" text-anchor="middle" font-weight="600" font-size="11" fill="#0c4a6e">checked</text>

  <rect x="310" y="170" width="100" height="36" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="360" y="192" text-anchor="middle" font-weight="600" font-size="11" fill="#0c4a6e">paid</text>

  <rect x="460" y="170" width="100" height="36" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="510" y="192" text-anchor="middle" font-weight="700" font-size="11" fill="#166534">shipped</text>

  <line x1="120" y1="188" x2="155" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="260" y1="188" x2="305" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="188" x2="455" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Corpus response row -->
  <text x="20" y="230" font-size="10" font-weight="600" fill="#64748b" text-transform="uppercase" letter-spacing="1">AGENT RESPONSE</text>

  <rect x="20" y="238" width="130" height="30" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="85" y="257" text-anchor="middle" font-size="10" fill="#c2410c">"ORD-5501 is PENDING"</text>

  <rect x="190" y="238" width="140" height="30" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="260" y="257" text-anchor="middle" font-size="10" fill="#c2410c">"ORD-5501 is CHECKED"</text>

  <rect x="370" y="238" width="170" height="30" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="455" y="257" text-anchor="middle" font-size="10" fill="#c2410c">"Payment confirmed"</text>

  <!-- Final state label -->
  <rect x="590" y="162" width="110" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="645" y="183" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">FINAL STATE</text>
  <text x="645" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">shipped</text>

  <line x1="560" y1="188" x2="585" y2="188" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
