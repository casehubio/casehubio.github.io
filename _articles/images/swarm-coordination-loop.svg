<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">The Swarm Coordination Loop</text>

  <!-- Team Formation -->
  <rect x="40" y="60" width="160" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Team Formation</text>
  <text x="120" y="106" text-anchor="middle" font-size="10" fill="#3b82f6">LLM selects agents,</text>
  <text x="120" y="118" text-anchor="middle" font-size="10" fill="#3b82f6">assigns roles</text>

  <!-- Agent Work -->
  <rect x="280" y="60" width="160" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Agent Work</text>
  <text x="360" y="106" text-anchor="middle" font-size="10" fill="#b45309">Parallel execution,</text>
  <text x="360" y="118" text-anchor="middle" font-size="10" fill="#b45309">observations reported</text>

  <!-- Collective Reasoning -->
  <rect x="520" y="60" width="160" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Collective Reasoning</text>
  <text x="600" y="106" text-anchor="middle" font-size="10" fill="#3b82f6">LLM synthesises</text>
  <text x="600" y="118" text-anchor="middle" font-size="10" fill="#3b82f6">multi-agent perspectives</text>

  <!-- Convergence Check -->
  <polygon points="360,190 440,240 360,290 280,240" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="360" y="236" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Converged?</text>
  <text x="360" y="252" text-anchor="middle" font-size="9" fill="#15803d">consensus + stability</text>

  <!-- Provisioning -->
  <rect x="520" y="204" width="160" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Provisioning</text>
  <text x="600" y="250" text-anchor="middle" font-size="10" fill="#3b82f6">LLM advises: add</text>
  <text x="600" y="262" text-anchor="middle" font-size="10" fill="#3b82f6">or remove agents?</text>

  <!-- Result -->
  <rect x="280" y="330" width="160" height="52" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="360" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Result</text>

  <!-- Deadlock -->
  <rect x="60" y="214" width="120" height="52" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="120" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">Escalate</text>

  <!-- Arrows -->
  <!-- Formation → Work -->
  <line x1="200" y1="96" x2="276" y2="96" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Work → Reasoning -->
  <line x1="440" y1="96" x2="516" y2="96" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Reasoning → Convergence -->
  <line x1="600" y1="132" x2="600" y2="170" stroke="#475569" stroke-width="1"/>
  <line x1="600" y1="170" x2="444" y2="228" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Convergence → Result (yes) -->
  <line x1="360" y1="290" x2="360" y2="326" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="372" y="312" font-size="10" fill="#22c55e" font-weight="600">yes</text>

  <!-- Convergence → Deadlock -->
  <line x1="280" y1="240" x2="184" y2="240" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="232" y="232" font-size="10" fill="#ef4444" font-weight="600">deadlock</text>

  <!-- Convergence → Provisioning (no, continue) -->
  <line x1="440" y1="240" x2="516" y2="240" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="478" y="232" font-size="10" fill="#475569" font-weight="600">no</text>

  <!-- Provisioning → back to Formation (loop) -->
  <path d="M 600 276 L 600 390 L 120 390 L 120 136" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow-blue)"/>
  <text x="360" y="404" text-anchor="middle" font-size="10" fill="#3b82f6" font-style="italic">re-form team with updated context</text>

  <!-- Legend: LLM-powered boxes -->
  <rect x="42" y="330" width="12" height="12" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="60" y="341" font-size="10" fill="#475569">LLM-powered decision</text>
</svg>
