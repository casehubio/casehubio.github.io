<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" style="max-width:520px;font-family:system-ui,sans-serif">
  <rect width="520" height="300" fill="#fafafa" rx="6"/>

  <!-- Source boxes -->
  <rect x="20" y="30" width="130" height="50" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="85" y="52" font-size="11" fill="#3730a3" text-anchor="middle">Mood</text>
  <text x="85" y="66" font-size="9" fill="#6366f1" text-anchor="middle">arousal + dominance</text>

  <rect x="170" y="30" width="130" height="50" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="235" y="52" font-size="11" fill="#3730a3" text-anchor="middle">Personality</text>
  <text x="235" y="66" font-size="9" fill="#6366f1" text-anchor="middle">disposition weight</text>

  <rect x="320" y="30" width="160" height="50" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="400" y="52" font-size="11" fill="#9d174d" text-anchor="middle">Appraisal</text>
  <text x="400" y="66" font-size="9" fill="#db2777" text-anchor="middle">tanh(FEAR+SHAME) ≈ 0.67</text>

  <!-- Arrows down -->
  <line x1="85" y1="80" x2="260" y2="120" stroke="#6366f1" stroke-width="1"/>
  <line x1="235" y1="80" x2="260" y2="120" stroke="#6366f1" stroke-width="1"/>
  <line x1="400" y1="80" x2="260" y2="120" stroke="#db2777" stroke-width="1"/>

  <!-- Accumulator -->
  <rect x="175" y="120" width="170" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="260" y="137" font-size="11" fill="#92400e" text-anchor="middle">Σ totalDelta</text>
  <text x="260" y="151" font-size="9" fill="#d97706" text-anchor="middle">0.15 + 0.10 + 0.67 = 0.92</text>

  <!-- Arrow to tanh -->
  <line x1="260" y1="160" x2="260" y2="185" stroke="#d97706" stroke-width="1.5"/>

  <!-- tanh box -->
  <rect x="195" y="185" width="130" height="35" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="260" y="207" font-size="13" fill="#15803d" text-anchor="middle" font-weight="bold">tanh(0.92)</text>

  <!-- Arrow to result -->
  <line x1="260" y1="220" x2="260" y2="248" stroke="#16a34a" stroke-width="1.5"/>

  <!-- Result -->
  <rect x="165" y="248" width="190" height="35" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="260" y="270" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">0.73 (was 1.0)</text>

  <!-- Old path annotation -->
  <text x="430" y="140" font-size="9" fill="#999" text-anchor="start">Old: linear sum</text>
  <text x="430" y="152" font-size="9" fill="#999" text-anchor="start">→ clamp at 1.0</text>
  <line x1="345" y1="140" x2="425" y2="140" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3,3"/>

  <text x="430" y="207" font-size="9" fill="#16a34a" text-anchor="start">New: tanh</text>
  <text x="430" y="219" font-size="9" fill="#16a34a" text-anchor="start">→ 0.73</text>
</svg>
