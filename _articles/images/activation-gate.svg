<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="700" height="280" fill="#fafafa" rx="8"/>

  <!-- FORMING state -->
  <rect x="30" y="100" width="120" height="50" rx="25" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="90" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">FORMING</text>

  <!-- Arrow to gate -->
  <line x1="150" y1="125" x2="230" y2="125" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="190" y="118" text-anchor="middle" font-size="10" fill="#64748b">activateGroup()</text>

  <!-- Validation gate -->
  <polygon points="300,85 360,125 300,165 240,125" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="300" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">min</text>
  <text x="300" y="134" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">card?</text>

  <!-- Pass path -->
  <line x1="360" y1="125" x2="450" y2="125" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="405" y="118" text-anchor="middle" font-size="10" fill="#16a34a">pass</text>

  <!-- ACTIVE state -->
  <rect x="460" y="100" width="120" height="50" rx="25" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="520" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">ACTIVE</text>

  <!-- Fail path -->
  <line x1="300" y1="165" x2="300" y2="220" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="318" y="195" font-size="10" fill="#dc2626">fail</text>

  <!-- Error -->
  <rect x="220" y="220" width="160" height="36" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="300" y="243" text-anchor="middle" font-size="11" fill="#991b1b">OrgValidationException</text>

  <!-- Role check detail -->
  <rect x="400" y="20" width="270" height="60" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="535" y="40" text-anchor="middle" font-size="11" fill="#334155">For each RoleSpec where min &gt; 0:</text>
  <text x="535" y="58" text-anchor="middle" font-size="11" fill="#334155">count(adoptions) ≥ minCardinality</text>
  <line x1="400" y1="50" x2="360" y2="100" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
