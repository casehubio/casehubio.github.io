<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <style>
      text { font-size: 13px; fill: #1a1a2e; }
      .title { font-size: 14px; font-weight: 600; }
      .subtitle { font-size: 11px; fill: #64748b; }
      .box { rx: 6; ry: 6; stroke-width: 1.5; }
      .arrow { stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="440" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" class="title" font-size="16">SUPERVISOR Gating — Layered Model</text>

  <!-- Vocabulary layer -->
  <rect x="240" y="50" width="240" height="50" class="box" fill="#e8eaf6" stroke="#5c6bc0"/>
  <text x="360" y="72" text-anchor="middle" class="title" fill="#283593">PlatformRole.SUPERVISOR</text>
  <text x="360" y="88" text-anchor="middle" class="subtitle">"oversees, approves/rejects, gates progression"</text>

  <!-- Marker layer -->
  <rect x="200" y="120" width="320" height="44" class="box" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="360" y="147" text-anchor="middle" class="title" fill="#1565c0">SupervisorGateBehavior</text>
  <text x="360" y="160" text-anchor="middle" class="subtitle">marker interface</text>

  <!-- Arrow vocab → marker -->
  <line x1="360" y1="100" x2="360" y2="120" class="arrow" stroke="#64748b"/>

  <!-- Two gate implementations -->
  <rect x="60" y="190" width="260" height="60" class="box" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="190" y="215" text-anchor="middle" class="title" fill="#2e7d32">OversightGateService</text>
  <text x="190" y="233" text-anchor="middle" class="subtitle">worker-action gates · PlannedAction approval</text>

  <rect x="400" y="190" width="260" height="60" class="box" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="530" y="215" text-anchor="middle" class="title" fill="#2e7d32">ConductorInboxManager</text>
  <text x="530" y="233" text-anchor="middle" class="subtitle">evolution-pipeline gates · stage approval</text>

  <!-- Arrows marker → gates -->
  <line x1="300" y1="164" x2="190" y2="190" class="arrow" stroke="#64748b"/>
  <line x1="420" y1="164" x2="530" y2="190" class="arrow" stroke="#64748b"/>

  <!-- Classifier (separate concern) -->
  <rect x="60" y="280" width="260" height="55" class="box" fill="#fff3e0" stroke="#ffa726"/>
  <text x="190" y="303" text-anchor="middle" class="title" fill="#e65100">ActionRiskClassifier</text>
  <text x="190" y="320" text-anchor="middle" class="subtitle">classifier · decides IF gating needed</text>

  <!-- Escalation provider -->
  <rect x="400" y="280" width="260" height="55" class="box" fill="#fff3e0" stroke="#ffa726"/>
  <text x="530" y="303" text-anchor="middle" class="title" fill="#e65100">EscalationProvider</text>
  <text x="530" y="320" text-anchor="middle" class="subtitle">evaluator · decides IF escalation needed</text>

  <!-- Arrows gates → classifiers -->
  <line x1="190" y1="250" x2="190" y2="280" class="arrow" stroke="#64748b"/>
  <line x1="530" y1="250" x2="530" y2="280" class="arrow" stroke="#64748b"/>

  <!-- Labels on arrows -->
  <text x="140" y="270" class="subtitle">precedes</text>
  <text x="480" y="270" class="subtitle">precedes</text>

  <!-- Legend -->
  <rect x="60" y="370" width="600" height="55" rx="6" fill="#f5f5f5" stroke="#e0e0e0"/>
  <rect x="80" y="385" width="14" height="14" rx="2" fill="#e8eaf6" stroke="#5c6bc0"/>
  <text x="100" y="396" class="subtitle">Vocabulary</text>
  <rect x="180" y="385" width="14" height="14" rx="2" fill="#e3f2fd" stroke="#42a5f5"/>
  <text x="200" y="396" class="subtitle">Type marker</text>
  <rect x="280" y="385" width="14" height="14" rx="2" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="300" y="396" class="subtitle">Gate implementations</text>
  <rect x="440" y="385" width="14" height="14" rx="2" fill="#fff3e0" stroke="#ffa726"/>
  <text x="460" y="396" class="subtitle">Classifiers (separate concern)</text>
</svg>
