<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#546e7a"/>
    </marker>
  </defs>

  <!-- Engine box -->
  <rect x="20" y="20" width="320" height="340" rx="10" fill="#f5f5f5" stroke="#90a4ae" stroke-width="2"/>
  <text x="40" y="50" font-size="16" font-weight="700" fill="#37474f">Engine</text>
  <text x="40" y="68" font-size="11" fill="#78909c">Mechanical · No LLM dependency</text>

  <rect x="40" y="85" width="280" height="40" rx="6" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1"/>
  <text x="55" y="110" font-size="12" fill="#283593">SwarmDescriptor · TopologyType</text>

  <rect x="40" y="135" width="280" height="40" rx="6" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1"/>
  <text x="55" y="160" font-size="12" fill="#283593">MultiSwarmRegistry SPI</text>

  <rect x="40" y="185" width="280" height="40" rx="6" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1"/>
  <text x="55" y="210" font-size="12" fill="#283593">SwarmCoordinationListener + swarmId</text>

  <rect x="40" y="235" width="280" height="40" rx="6" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1"/>
  <text x="55" y="260" font-size="12" fill="#283593">SwarmCoordinationEvent (moved here)</text>

  <rect x="40" y="285" width="280" height="40" rx="6" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1"/>
  <text x="55" y="310" font-size="12" fill="#283593">CrossSwarmConvergenceEvaluator</text>

  <!-- Agency box -->
  <rect x="380" y="20" width="320" height="340" rx="10" fill="#fff8e1" stroke="#ffa000" stroke-width="2"/>
  <text x="400" y="50" font-size="16" font-weight="700" fill="#e65100">Agency</text>
  <text x="400" y="68" font-size="11" fill="#bf360c">Intelligence · Classical AI + LLM</text>

  <rect x="400" y="85" width="280" height="40" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="415" y="110" font-size="12" fill="#e65100">MultiSwarmTopology (L0–L3)</text>

  <rect x="400" y="135" width="280" height="40" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="415" y="160" font-size="12" fill="#e65100">BJT Relevance Scoring (neocortex)</text>

  <rect x="400" y="185" width="280" height="40" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="415" y="210" font-size="12" fill="#e65100">BeliefSet Conflict Detection (AGM)</text>

  <rect x="400" y="235" width="280" height="40" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1"/>
  <text x="415" y="260" font-size="12" fill="#e65100">Budget · Degradation · Heuristics</text>

  <rect x="400" y="285" width="280" height="40" rx="6" fill="#fce4ec" stroke="#e91e63" stroke-width="1"/>
  <text x="415" y="310" font-size="12" fill="#880e4f">L3 LLM Mediation (optional)</text>

  <!-- Arrows: engine → agency -->
  <path d="M320,105 L400,105" stroke="#546e7a" stroke-width="1.5" marker-end="url(#a2)"/>
  <path d="M320,155 L400,155" stroke="#546e7a" stroke-width="1.5" marker-end="url(#a2)"/>
  <path d="M320,205 L400,205" stroke="#546e7a" stroke-width="1.5" marker-end="url(#a2)"/>
</svg>
