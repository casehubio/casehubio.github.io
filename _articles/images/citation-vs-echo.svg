<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
    .label { font-size: 12px; fill: #2d3436; }
    .memory-box { fill: #e8f4f8; stroke: #74b9ce; stroke-width: 1.5; rx: 6; }
    .citation-box { fill: #fdecea; stroke: #d4644a; stroke-width: 1.5; rx: 6; }
    .echo-box { fill: #e8f5e9; stroke: #4a8c5c; stroke-width: 1.5; rx: 6; }
    .quote { font-size: 11px; fill: #444; font-style: italic; }
    .bad { font-size: 10px; fill: #d4644a; font-weight: 600; }
    .good { font-size: 10px; fill: #4a8c5c; font-weight: 600; }
    .arrow { stroke: #636e72; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    .dim { font-size: 10px; fill: #888; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#636e72"/>
    </marker>
  </defs>

  <!-- Source memory -->
  <rect x="220" y="20" width="280" height="50" class="memory-box"/>
  <text x="360" y="40" text-anchor="middle" class="label" font-weight="600">Formation memory</text>
  <text x="360" y="56" text-anchor="middle" class="quote">"Age 10 — found buried treasure in the garden"</text>

  <!-- Fork arrows -->
  <path d="M 280 70 L 160 110" class="arrow"/>
  <path d="M 440 70 L 560 110" class="arrow"/>

  <!-- Citation path (bad) -->
  <text x="160" y="104" text-anchor="middle" class="bad">✗ NARRATIVE CITATION</text>
  <rect x="30" y="115" width="260" height="70" class="citation-box"/>
  <text x="160" y="136" text-anchor="middle" class="quote">"Like when you found the</text>
  <text x="160" y="150" text-anchor="middle" class="quote">treasure as a child,</text>
  <text x="160" y="164" text-anchor="middle" class="quote">warmth spreads through you."</text>

  <text x="160" y="208" text-anchor="middle" class="dim">References the event</text>
  <text x="160" y="222" text-anchor="middle" class="dim">Memory as simile</text>
  <text x="160" y="236" text-anchor="middle" class="dim">Tells, doesn't embody</text>

  <rect x="80" y="252" width="160" height="28" rx="4" fill="#fdecea" stroke="#d4644a"/>
  <text x="160" y="271" text-anchor="middle" font-size="12" fill="#d4644a" font-weight="600">Formation echo: 1</text>

  <!-- Echo path (good) -->
  <text x="560" y="104" text-anchor="middle" class="good">✓ SOMATIC ECHO</text>
  <rect x="430" y="115" width="260" height="70" class="echo-box"/>
  <text x="560" y="136" text-anchor="middle" class="quote">"Your chest opens the way it</text>
  <text x="560" y="150" text-anchor="middle" class="quote">first opened at ten, crouched</text>
  <text x="560" y="164" text-anchor="middle" class="quote">over buried treasure."</text>

  <text x="560" y="208" text-anchor="middle" class="dim">Describes what the body does NOW</text>
  <text x="560" y="222" text-anchor="middle" class="dim">Memory as somatic imprint</text>
  <text x="560" y="236" text-anchor="middle" class="dim">Shows, doesn't tell</text>

  <rect x="480" y="252" width="160" height="28" rx="4" fill="#e8f5e9" stroke="#4a8c5c"/>
  <text x="560" y="271" text-anchor="middle" font-size="12" fill="#4a8c5c" font-weight="600">Formation echo: 4+</text>
</svg>
