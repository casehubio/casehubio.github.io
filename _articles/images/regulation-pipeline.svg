<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Regulation as Decision Layer — Unified Decision, Distributed Execution</text>

  <!-- DERIVED Phase box -->
  <rect x="30" y="50" width="540" height="200" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="50" y="72" font-size="11" font-weight="600" fill="#94a3b8">DERIVED PHASE</text>

  <!-- Appraisal -->
  <rect x="60" y="90" width="200" height="65" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Appraisal</text>
  <text x="160" y="132" text-anchor="middle" font-size="10" fill="#3b82f6">Scherer SEC → CognitiveEmotion</text>
  <text x="160" y="145" text-anchor="middle" font-size="10" fill="#3b82f6">intensity, PAD, action tendencies</text>

  <!-- Arrow: Appraisal → Regulation -->
  <line x1="260" y1="122" x2="320" y2="122" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Regulation (the new thing) -->
  <rect x="325" y="85" width="225" height="75" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="437" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Emotion Regulation</text>
  <text x="437" y="124" text-anchor="middle" font-size="10" fill="#16a34a">discrepancy gate → LLM call</text>
  <text x="437" y="140" text-anchor="middle" font-size="10" fill="#16a34a">strategy selection + narrative</text>
  <text x="437" y="152" text-anchor="middle" font-size="9" fill="#15803d" font-style="italic">NEW</text>

  <!-- MindMap store -->
  <rect x="360" y="180" width="160" height="45" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="440" y="200" text-anchor="middle" font-size="10" font-weight="500" fill="#854d0e">MindMap</text>
  <text x="440" y="215" text-anchor="middle" font-size="9" fill="#a16207">RegulationResult nodes</text>
  <line x1="437" y1="160" x2="437" y2="178" stroke="#ca8a04" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Output arrow to Drive Rendering -->
  <line x1="550" y1="110" x2="620" y2="110" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Output arrow to Goal Pipeline -->
  <line x1="550" y1="140" x2="620" y2="310" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr-orange)"/>

  <!-- Drive Rendering (internal strategies) -->
  <rect x="625" y="70" width="240" height="90" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="745" y="95" text-anchor="middle" font-size="12" font-weight="600" fill="#7e22ce">Drive Rendering</text>
  <text x="745" y="112" text-anchor="middle" font-size="10" fill="#9333ea">renderInternalState()</text>
  <text x="745" y="128" text-anchor="middle" font-size="10" fill="#a855f7">suppressed drives, reframed text</text>
  <text x="745" y="145" text-anchor="middle" font-size="9" fill="#7e22ce">strategies 3-5: attention, reappraisal, suppression</text>

  <!-- Goal Pipeline (environmental strategies) -->
  <rect x="625" y="280" width="240" height="90" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="745" y="305" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">Goal Pipeline</text>
  <text x="745" y="322" text-anchor="middle" font-size="10" fill="#ea580c">GoalProposalOrchestrator</text>
  <text x="745" y="338" text-anchor="middle" font-size="10" fill="#ea580c">avoidance constraints, new goals</text>
  <text x="745" y="355" text-anchor="middle" font-size="9" fill="#9a3412">strategies 1-2: situation selection, modification</text>

  <!-- LLM Prompt output -->
  <line x1="745" y1="160" x2="745" y2="190" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="665" y="195" width="160" height="45" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="745" y="215" text-anchor="middle" font-size="11" font-weight="500" fill="#7e22ce">LLM Prompt</text>
  <text x="745" y="230" text-anchor="middle" font-size="9" fill="#9333ea">"you feel the pull but hold back"</text>

  <!-- Legend -->
  <rect x="30" y="380" width="12" height="12" rx="2" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="48" y="391" font-size="10" fill="#334155">Decision layer (new)</text>
  <rect x="200" y="380" width="12" height="12" rx="2" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="218" y="391" font-size="10" fill="#334155">Internal strategy execution</text>
  <rect x="420" y="380" width="12" height="12" rx="2" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="438" y="391" font-size="10" fill="#334155">Environmental strategy execution</text>
</svg>
