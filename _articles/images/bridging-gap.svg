<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Detection side -->
  <rect x="30" y="40" width="200" height="240" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="130" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#0369a1">Engine (Detection)</text>

  <rect x="55" y="70" width="150" height="44" rx="8" fill="#fff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="130" y="90" text-anchor="middle" font-size="11" fill="#0c4a6e">RoleTracker</text>
  <text x="130" y="103" text-anchor="middle" font-size="9" fill="#64748b">behavioral clustering</text>

  <rect x="55" y="134" width="150" height="44" rx="8" fill="#fff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="130" y="154" text-anchor="middle" font-size="11" fill="#0c4a6e">DetectedRole</text>
  <text x="130" y="167" text-anchor="middle" font-size="9" fill="#64748b">emergent, probabilistic</text>

  <rect x="55" y="198" width="150" height="44" rx="8" fill="#fff" stroke="#7dd3fc" stroke-width="1"/>
  <text x="130" y="218" text-anchor="middle" font-size="11" fill="#0c4a6e">SwarmCoordinationEvent</text>
  <text x="130" y="231" text-anchor="middle" font-size="9" fill="#64748b">fires on role change</text>

  <!-- The gap -->
  <rect x="270" y="90" width="180" height="140" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="360" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">The Gap</text>
  <text x="360" y="145" text-anchor="middle" font-size="10" fill="#991b1b">DetectedRole knows</text>
  <text x="360" y="160" text-anchor="middle" font-size="10" fill="#991b1b">what agents DO.</text>
  <text x="360" y="185" text-anchor="middle" font-size="10" fill="#991b1b">AgentRole defines</text>
  <text x="360" y="200" text-anchor="middle" font-size="10" fill="#991b1b">what agents ARE.</text>

  <line x1="230" y1="160" x2="268" y2="160" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" stroke-dasharray="4 3"/>
  <line x1="452" y1="160" x2="488" y2="160" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)" stroke-dasharray="4 3"/>

  <!-- Declaration side -->
  <rect x="490" y="40" width="200" height="240" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="590" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">Agency (Declaration)</text>

  <rect x="515" y="70" width="150" height="44" rx="8" fill="#fff" stroke="#86efac" stroke-width="1"/>
  <text x="590" y="90" text-anchor="middle" font-size="11" fill="#14532d">AgentRole</text>
  <text x="590" y="103" text-anchor="middle" font-size="9" fill="#64748b">declared, structural</text>

  <rect x="515" y="134" width="150" height="44" rx="8" fill="#fff" stroke="#86efac" stroke-width="1"/>
  <text x="590" y="154" text-anchor="middle" font-size="11" fill="#14532d">TopologyDescriptor</text>
  <text x="590" y="167" text-anchor="middle" font-size="9" fill="#64748b">maps agents to roles</text>

  <rect x="515" y="198" width="150" height="44" rx="8" fill="#fff" stroke="#86efac" stroke-width="1"/>
  <text x="590" y="218" text-anchor="middle" font-size="11" fill="#14532d">HiveTopology</text>
  <text x="590" y="231" text-anchor="middle" font-size="9" fill="#64748b">orchestration patterns</text>

  <!-- Arrows within each side -->
  <line x1="130" y1="114" x2="130" y2="132" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="130" y1="178" x2="130" y2="196" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="590" y1="114" x2="590" y2="132" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="590" y1="178" x2="590" y2="196" stroke="#475569" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Caption -->
  <text x="360" y="305" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">Nothing connects emergent behavior to declared structure</text>
</svg>
