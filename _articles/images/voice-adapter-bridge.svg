<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Agency box -->
  <rect x="20" y="20" width="340" height="280" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="190" y="48" text-anchor="middle" font-weight="700" fill="#92400e" font-size="15">agency / speech-api</text>

  <rect x="40" y="68" width="180" height="32" rx="4" fill="#fff" stroke="#d97706"/>
  <text x="130" y="89" text-anchor="middle" fill="#92400e">SpeechToTextService</text>

  <rect x="40" y="110" width="180" height="32" rx="4" fill="#fff" stroke="#d97706"/>
  <text x="130" y="131" text-anchor="middle" fill="#92400e">TextToSpeechService</text>

  <rect x="40" y="160" width="140" height="26" rx="4" fill="#fff" stroke="#d97706"/>
  <text x="110" y="178" text-anchor="middle" fill="#92400e" font-size="11">TranscriptionResult</text>

  <rect x="40" y="194" width="140" height="26" rx="4" fill="#fff" stroke="#d97706"/>
  <text x="110" y="212" text-anchor="middle" fill="#92400e" font-size="11">SynthesisResult</text>

  <rect x="40" y="228" width="140" height="26" rx="4" fill="#fff" stroke="#d97706"/>
  <text x="110" y="246" text-anchor="middle" fill="#92400e" font-size="11">SynthesisOptions</text>

  <text x="200" y="275" text-anchor="middle" fill="#92400e" font-size="11" font-style="italic">+ 4 more model types</text>

  <!-- Connectors box -->
  <rect x="440" y="20" width="340" height="280" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="610" y="48" text-anchor="middle" font-weight="700" fill="#1e40af" font-size="15">connectors / voice-spi</text>

  <rect x="460" y="68" width="180" height="32" rx="4" fill="#fff" stroke="#2563eb"/>
  <text x="550" y="89" text-anchor="middle" fill="#1e40af">SpeechToText</text>

  <rect x="460" y="110" width="180" height="32" rx="4" fill="#fff" stroke="#2563eb"/>
  <text x="550" y="131" text-anchor="middle" fill="#1e40af">TextToSpeech</text>

  <rect x="460" y="160" width="140" height="26" rx="4" fill="#fff" stroke="#2563eb"/>
  <text x="530" y="178" text-anchor="middle" fill="#1e40af" font-size="11">TranscriptionResult</text>

  <rect x="460" y="194" width="140" height="26" rx="4" fill="#fff" stroke="#2563eb"/>
  <text x="530" y="212" text-anchor="middle" fill="#1e40af" font-size="11">SynthesisResult</text>

  <rect x="460" y="228" width="140" height="26" rx="4" fill="#fff" stroke="#2563eb"/>
  <text x="530" y="246" text-anchor="middle" fill="#1e40af" font-size="11">SynthesisOptions</text>

  <text x="620" y="275" text-anchor="middle" fill="#1e40af" font-size="11" font-style="italic">+ 4 more model types</text>

  <!-- Adapter bridge -->
  <rect x="310" y="120" width="180" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="138" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="600">SherpaVoicePlatform</text>
  <text x="400" y="155" text-anchor="middle" fill="#991b1b" font-size="11" font-style="italic">field-by-field mapping</text>

  <!-- Arrows -->
  <line x1="220" y1="84" x2="308" y2="130" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="220" y1="126" x2="308" y2="142" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="492" y1="130" x2="460" y2="84" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)" transform="rotate(180 476 107)"/>
  <line x1="490" y1="142" x2="460" y2="126" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)" transform="rotate(180 475 134)"/>

  <!-- Label -->
  <text x="400" y="328" text-anchor="middle" fill="#64748b" font-size="12" font-style="italic">Before: parallel type hierarchies with adapter bridge</text>
</svg>
