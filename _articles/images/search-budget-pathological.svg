<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <rect width="720" height="340" fill="#fafafa" rx="8"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#333">The Pathological Boundary</text>
  <text x="360" y="46" text-anchor="middle" font-size="10" fill="#888">Same parameters, extreme values — not a separate mode</text>

  <!-- Column headers -->
  <text x="60" y="80" font-size="10" font-weight="600" fill="#555">State</text>
  <text x="220" y="80" text-anchor="middle" font-size="10" font-weight="600" fill="#4a90d9">Breadth</text>
  <text x="340" y="80" text-anchor="middle" font-size="10" font-weight="600" fill="#e6994d">Laterality</text>
  <text x="460" y="80" text-anchor="middle" font-size="10" font-weight="600" fill="#5ba85b">Depth</text>
  <text x="580" y="80" text-anchor="middle" font-size="10" font-weight="600" fill="#c75050">Convergence</text>

  <line x1="40" y1="90" x2="700" y2="90" stroke="#ddd" stroke-width="1"/>

  <!-- Healthy exploration -->
  <text x="60" y="120" font-size="11" fill="#333">Healthy</text>
  <text x="60" y="134" font-size="11" fill="#333">exploration</text>
  <rect x="190" y="107" width="60" height="18" rx="9" fill="#4a90d9" fill-opacity="0.4" stroke="#4a90d9" stroke-width="1"/>
  <text x="220" y="120" text-anchor="middle" font-size="9" fill="#2c5f8a">0.5–0.7</text>
  <rect x="310" y="107" width="60" height="18" rx="9" fill="#e6994d" fill-opacity="0.3" stroke="#e6994d" stroke-width="1"/>
  <text x="340" y="120" text-anchor="middle" font-size="9" fill="#996633">0.3–0.6</text>
  <rect x="430" y="107" width="60" height="18" rx="9" fill="#5ba85b" fill-opacity="0.3" stroke="#5ba85b" stroke-width="1"/>
  <text x="460" y="120" text-anchor="middle" font-size="9" fill="#3a6a3a">0.3–0.5</text>
  <rect x="550" y="107" width="60" height="18" rx="9" fill="#c75050" fill-opacity="0.3" stroke="#c75050" stroke-width="1"/>
  <text x="580" y="120" text-anchor="middle" font-size="9" fill="#8a3030">0.4–0.6</text>

  <!-- Intense pursuit -->
  <text x="60" y="172" font-size="11" fill="#555">Intense</text>
  <text x="60" y="186" font-size="11" fill="#555">pursuit</text>
  <rect x="190" y="159" width="60" height="18" rx="9" fill="#4a90d9" fill-opacity="0.25" stroke="#4a90d9" stroke-width="1"/>
  <text x="220" y="172" text-anchor="middle" font-size="9" fill="#2c5f8a">0.3–0.5</text>
  <rect x="310" y="159" width="60" height="18" rx="9" fill="#e6994d" fill-opacity="0.2" stroke="#e6994d" stroke-width="1"/>
  <text x="340" y="172" text-anchor="middle" font-size="9" fill="#996633">0.2–0.4</text>
  <rect x="430" y="159" width="60" height="18" rx="9" fill="#5ba85b" fill-opacity="0.55" stroke="#5ba85b" stroke-width="1"/>
  <text x="460" y="172" text-anchor="middle" font-size="9" fill="#3a6a3a">0.6–0.8</text>
  <rect x="550" y="159" width="60" height="18" rx="9" fill="#c75050" fill-opacity="0.2" stroke="#c75050" stroke-width="1"/>
  <text x="580" y="172" text-anchor="middle" font-size="9" fill="#8a3030">0.2–0.4</text>

  <line x1="40" y1="210" x2="700" y2="210" stroke="#c75050" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="685" y="207" text-anchor="end" font-size="8" fill="#c75050" font-style="italic">pathological threshold</text>

  <!-- Fixation -->
  <rect x="42" y="222" width="656" height="44" rx="4" fill="#c75050" fill-opacity="0.06"/>
  <text x="60" y="248" font-size="11" font-weight="600" fill="#8a2020">Fixation</text>
  <rect x="195" y="235" width="50" height="18" rx="9" fill="#4a90d9" fill-opacity="0.08" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="220" y="248" text-anchor="middle" font-size="9" fill="#888">≈ 0</text>
  <rect x="315" y="235" width="50" height="18" rx="9" fill="#e6994d" fill-opacity="0.05" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="340" y="248" text-anchor="middle" font-size="9" fill="#888">0</text>
  <rect x="435" y="235" width="50" height="18" rx="9" fill="#5ba85b" fill-opacity="0.8" stroke="#5ba85b" stroke-width="1.5"/>
  <text x="460" y="248" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">1.0</text>
  <rect x="555" y="235" width="50" height="18" rx="9" fill="#c75050" fill-opacity="0.08" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="580" y="248" text-anchor="middle" font-size="9" fill="#888">0</text>

  <!-- Rumination -->
  <rect x="42" y="272" width="656" height="44" rx="4" fill="#c75050" fill-opacity="0.06"/>
  <text x="60" y="298" font-size="11" font-weight="600" fill="#8a2020">Rumination</text>
  <rect x="195" y="285" width="50" height="18" rx="9" fill="#4a90d9" fill-opacity="0.08" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="220" y="298" text-anchor="middle" font-size="9" fill="#888">≈ 0</text>
  <rect x="315" y="285" width="50" height="18" rx="9" fill="#e6994d" fill-opacity="0.05" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="340" y="298" text-anchor="middle" font-size="9" fill="#888">0</text>
  <rect x="435" y="285" width="50" height="18" rx="9" fill="#5ba85b" fill-opacity="0.8" stroke="#5ba85b" stroke-width="1.5"/>
  <text x="460" y="298" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">1.0</text>
  <rect x="555" y="285" width="50" height="18" rx="9" fill="#c75050" fill-opacity="0.08" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="580" y="298" text-anchor="middle" font-size="9" fill="#888">0</text>

  <text x="360" y="330" text-anchor="middle" font-size="9" fill="#888">Breadth collapses, laterality collapses, convergence fails — depth keeps going but retraces the same ground</text>
</svg>
