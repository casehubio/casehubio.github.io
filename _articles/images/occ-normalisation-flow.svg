<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">OCC Emotion Normalisation — Two-Layer Defence</text>

  <!-- Layer 1: Python Extraction -->
  <rect x="30" y="55" width="660" height="120" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="50" y="78" font-size="12" font-weight="600" fill="#1d4ed8">Layer 1 — Python Extraction Pipeline</text>

  <!-- LLM box -->
  <rect x="60" y="95" width="120" height="55" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <text x="120" y="118" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">LLM Enrichment</text>
  <text x="120" y="135" text-anchor="middle" font-size="10" fill="#64748b">"Use ONLY 22 types"</text>

  <!-- Arrow -->
  <line x1="180" y1="122" x2="228" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="204" y="115" text-anchor="middle" font-size="9" fill="#94a3b8">may invent</text>

  <!-- Non-canonical box -->
  <rect x="230" y="95" width="130" height="55" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="295" y="115" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">"despair" 0.8</text>
  <text x="295" y="132" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">"anxiety" 0.6</text>
  <text x="295" y="148" text-anchor="middle" font-size="10" fill="#dc2626">non-canonical</text>

  <!-- Arrow -->
  <line x1="360" y1="122" x2="408" y2="122" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Assembler normalise -->
  <rect x="410" y="95" width="130" height="55" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <text x="475" y="115" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">normalise_occ()</text>
  <text x="475" y="132" text-anchor="middle" font-size="10" fill="#64748b">33 alias mappings</text>
  <text x="475" y="147" text-anchor="middle" font-size="10" fill="#64748b">assemble_corpus.py</text>

  <!-- Arrow -->
  <line x1="540" y1="122" x2="568" y2="122" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Canonical box -->
  <rect x="570" y="95" width="105" height="55" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="622" y="115" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">"distress" 0.8</text>
  <text x="622" y="132" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">"fear" 0.6</text>
  <text x="622" y="148" text-anchor="middle" font-size="10" fill="#16a34a">canonical</text>

  <!-- Layer 2: Java Import -->
  <rect x="30" y="195" width="660" height="120" rx="6" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="50" y="218" font-size="12" font-weight="600" fill="#7c3aed">Layer 2 — Java Import (defence in depth)</text>

  <!-- corpus.json -->
  <rect x="60" y="235" width="120" height="55" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <text x="120" y="258" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">corpus.json</text>
  <text x="120" y="275" text-anchor="middle" font-size="10" fill="#64748b">normalised types</text>

  <!-- Arrow -->
  <line x1="180" y1="262" x2="228" y2="262" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LifeEventHandler -->
  <rect x="230" y="235" width="180" height="55" rx="4" fill="#fff" stroke="#cbd5e1"/>
  <text x="320" y="255" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">LifeEventHandler</text>
  <text x="320" y="272" text-anchor="middle" font-size="10" fill="#64748b">EmotionType.normalise()</text>
  <text x="320" y="287" text-anchor="middle" font-size="10" fill="#64748b">29 aliases + drop unknown</text>

  <!-- Arrow -->
  <line x1="410" y1="262" x2="458" y2="262" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Memory store -->
  <rect x="460" y="235" width="130" height="55" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="525" y="255" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">Memory Store</text>
  <text x="525" y="272" text-anchor="middle" font-size="10" fill="#16a34a">canonical types only</text>
  <text x="525" y="287" text-anchor="middle" font-size="10" fill="#16a34a">aligned with enum</text>
</svg>
