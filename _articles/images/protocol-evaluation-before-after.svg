<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Left: Before -->
  <text x="200" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Before — dual-mode wiring</text>

  <!-- NegotiationProtocol box -->
  <rect x="80" y="40" width="240" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="67" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">NegotiationProtocol</text>

  <!-- Arrows down to two evaluators -->
  <line x1="140" y1="84" x2="100" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="84" x2="300" y2="120" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>

  <!-- Projection evaluator (kept) -->
  <rect x="10" y="122" width="180" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="100" y="149" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">ProjectionEvaluator</text>

  <!-- Playbook evaluator (removed) -->
  <rect x="210" y="122" width="180" height="44" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="300" y="149" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">PlaybookStateEvaluator</text>

  <!-- Projection → ChannelProjector -->
  <line x1="100" y1="166" x2="100" y2="200" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="20" y="202" width="160" height="36" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="100" y="225" text-anchor="middle" font-size="10" fill="#166534">ChannelProjector (qhorus)</text>

  <!-- Playbook → PlaybookProtocolEvaluator -->
  <line x1="300" y1="166" x2="300" y2="200" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <rect x="210" y="202" width="180" height="36" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="300" y="219" text-anchor="middle" font-size="10" fill="#991b1b">PlaybookProtocolEvaluator</text>
  <text x="300" y="232" text-anchor="middle" font-size="9" fill="#b91c1c" font-style="italic">platform — RETIRED</text>

  <!-- Supporting classes -->
  <rect x="210" y="252" width="180" height="36" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="300" y="269" text-anchor="middle" font-size="10" fill="#991b1b">AdvisoryMapper</text>
  <text x="300" y="282" text-anchor="middle" font-size="9" fill="#b91c1c" font-style="italic">maps retired types</text>
  <line x1="300" y1="238" x2="300" y2="252" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="210" y="300" width="180" height="36" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="300" y="317" text-anchor="middle" font-size="10" fill="#991b1b">LifecycleHandler</text>
  <text x="300" y="330" text-anchor="middle" font-size="9" fill="#b91c1c" font-style="italic">template loading</text>
  <line x1="300" y1="288" x2="300" y2="300" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Divider -->
  <line x1="415" y1="20" x2="415" y2="360" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Right: After -->
  <text x="620" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">After — clean extension point</text>

  <!-- NegotiationProtocol box -->
  <rect x="500" y="40" width="240" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="620" y="67" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">NegotiationProtocol</text>

  <!-- Arrow down to SPI -->
  <line x1="620" y1="84" x2="620" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ProtocolStateEvaluator SPI -->
  <rect x="510" y="122" width="220" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="620" y="145" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">«SPI» ProtocolStateEvaluator</text>
  <text x="620" y="159" text-anchor="middle" font-size="9" fill="#3b82f6">@FunctionalInterface</text>

  <!-- Arrow to projection (default) -->
  <line x1="580" y1="166" x2="540" y2="205" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="540" y="195" text-anchor="middle" font-size="9" fill="#16a34a" font-weight="500">default</text>

  <!-- Arrow to custom (future) -->
  <line x1="660" y1="166" x2="720" y2="205" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="710" y="195" text-anchor="middle" font-size="9" fill="#64748b">extensible</text>

  <!-- Projection evaluator -->
  <rect x="440" y="208" width="200" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="540" y="235" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">ProjectionEvaluator</text>

  <!-- Custom evaluator placeholder -->
  <rect x="660" y="208" width="140" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="730" y="231" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">YourEvaluator</text>
  <text x="730" y="245" text-anchor="middle" font-size="9" fill="#94a3b8">implements SPI</text>

  <!-- Projection → ChannelProjector -->
  <line x1="540" y1="252" x2="540" y2="286" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="450" y="288" width="180" height="36" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="540" y="311" text-anchor="middle" font-size="10" fill="#166534">ChannelProjector (qhorus)</text>

  <!-- Legend -->
  <rect x="460" y="340" width="12" height="12" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="478" y="351" font-size="9" fill="#64748b">Production path</text>
  <rect x="570" y="340" width="12" height="12" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="588" y="351" font-size="9" fill="#64748b">Removed</text>
  <rect x="650" y="340" width="12" height="12" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="668" y="351" font-size="9" fill="#64748b">Extension point</text>
</svg>
