<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Reactive Agent vs. Regulated Agent</text>

  <!-- REACTIVE path (top) -->
  <rect x="30" y="48" width="820" height="120" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="50" y="68" font-size="11" font-weight="600" fill="#dc2626">WITHOUT REGULATION</text>

  <rect x="55" y="82" width="140" height="55" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="125" y="103" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">Situation</text>
  <text x="125" y="118" text-anchor="middle" font-size="9" fill="#64748b">Muttley undermines</text>
  <text x="125" y="129" text-anchor="middle" font-size="9" fill="#64748b">in front of group</text>

  <line x1="195" y1="108" x2="240" y2="108" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="245" y="82" width="130" height="55" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="310" y="103" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">Appraisal</text>
  <text x="310" y="118" text-anchor="middle" font-size="9" fill="#dc2626">anger: 0.85</text>
  <text x="310" y="129" text-anchor="middle" font-size="9" fill="#dc2626">dominance threat</text>

  <line x1="375" y1="108" x2="420" y2="108" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="425" y="82" width="160" height="55" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="505" y="103" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">Direct Expression</text>
  <text x="505" y="118" text-anchor="middle" font-size="9" fill="#dc2626">full anger → drives</text>
  <text x="505" y="129" text-anchor="middle" font-size="9" fill="#dc2626">confrontation tendency</text>

  <line x1="585" y1="108" x2="630" y2="108" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="635" y="82" width="190" height="55" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="730" y="100" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Behaviour</text>
  <text x="730" y="115" text-anchor="middle" font-size="9" fill="#dc2626">"You snarl at Muttley,</text>
  <text x="730" y="127" text-anchor="middle" font-size="9" fill="#dc2626">fists clenched, voice rising"</text>

  <!-- REGULATED path (bottom) -->
  <rect x="30" y="188" width="820" height="135" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="50" y="208" font-size="11" font-weight="600" fill="#16a34a">WITH REGULATION</text>

  <rect x="55" y="222" width="140" height="55" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="125" y="243" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">Situation</text>
  <text x="125" y="258" text-anchor="middle" font-size="9" fill="#64748b">Muttley undermines</text>
  <text x="125" y="269" text-anchor="middle" font-size="9" fill="#64748b">in front of group</text>

  <line x1="195" y1="248" x2="240" y2="248" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="245" y="222" width="130" height="55" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="310" y="243" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">Appraisal</text>
  <text x="310" y="258" text-anchor="middle" font-size="9" fill="#dc2626">anger: 0.85</text>
  <text x="310" y="269" text-anchor="middle" font-size="9" fill="#dc2626">dominance threat</text>

  <line x1="375" y1="248" x2="420" y2="248" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="425" y="218" width="160" height="65" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="505" y="237" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Regulation</text>
  <text x="505" y="252" text-anchor="middle" font-size="9" fill="#16a34a">response modulation</text>
  <text x="505" y="263" text-anchor="middle" font-size="9" fill="#16a34a">effectiveness: 0.6</text>
  <text x="505" y="274" text-anchor="middle" font-size="9" fill="#15803d">anger 0.85 → 0.40</text>

  <line x1="585" y1="248" x2="630" y2="248" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="635" y="222" width="190" height="55" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="730" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Behaviour</text>
  <text x="730" y="255" text-anchor="middle" font-size="9" fill="#16a34a">"Your jaw tightens. You force</text>
  <text x="730" y="267" text-anchor="middle" font-size="9" fill="#16a34a">your hands flat, voice level"</text>
</svg>
