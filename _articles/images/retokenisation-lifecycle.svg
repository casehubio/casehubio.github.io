<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
  </defs>

  <text x="380" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Retroactive Tokenisation: Enriching Historical Memories</text>

  <!-- Before: literal text -->
  <rect x="20" y="50" width="210" height="70" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="125" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Stored Memory (before)</text>
  <text x="125" y="88" text-anchor="middle" font-size="9" fill="#991b1b">"Frida painted a self-portrait</text>
  <text x="125" y="100" text-anchor="middle" font-size="9" fill="#991b1b">while Diego watched."</text>

  <line x1="230" y1="85" x2="270" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Phase 1: strip -->
  <rect x="275" y="50" width="190" height="70" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="370" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">RetokenisationPhase</text>
  <text x="370" y="86" text-anchor="middle" font-size="9" fill="#3730a3">1. stripTokens(text)</text>
  <text x="370" y="98" text-anchor="middle" font-size="9" fill="#3730a3">2. tokenise(plain, trie)</text>
  <text x="370" y="110" text-anchor="middle" font-size="9" fill="#3730a3">3. updateText(memId, new)</text>

  <line x1="465" y1="85" x2="505" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- After: tokenised text -->
  <rect x="510" y="50" width="230" height="70" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="625" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Stored Memory (after)</text>
  <text x="625" y="88" text-anchor="middle" font-size="9" fill="#166534">"{{p1:full:Frida}} painted a self-</text>
  <text x="625" y="100" text-anchor="middle" font-size="9" fill="#166534">portrait while {{p2:full:Diego}} watched."</text>

  <!-- Trie source -->
  <rect x="100" y="160" width="180" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="190" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Surface Form Trie</text>
  <text x="190" y="195" text-anchor="middle" font-size="9" fill="#92400e">Frida → p1 | Diego → p2</text>
  <text x="190" y="207" text-anchor="middle" font-size="9" fill="#92400e">Kahlo → p1 | Rivera → p2</text>

  <line x1="280" y1="185" x2="345" y2="125" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Consolidation scheduler -->
  <rect x="370" y="160" width="180" height="55" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="460" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">Consolidation Scheduler</text>
  <text x="460" y="195" text-anchor="middle" font-size="9" fill="#5b21b6">periodic, idle-gated</text>
  <text x="460" y="207" text-anchor="middle" font-size="9" fill="#5b21b6">cursor-based pagination</text>

  <line x1="420" y1="160" x2="395" y2="125" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Key insight -->
  <rect x="100" y="240" width="560" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="380" y="260" text-anchor="middle" font-size="10" fill="#475569">Memories are retroactively enriched — no migration needed, no downtime, no batch job.</text>
</svg>
