<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <marker id="arwRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea4335"/>
    </marker>
  </defs>

  <!-- Formation column -->
  <text x="20" y="25" font-size="11" fill="#888" font-weight="bold">FORMATION</text>

  <rect x="40" y="40" width="120" height="36" rx="8" fill="#fff3e0" stroke="#f9a825" stroke-width="2"/>
  <text x="68" y="63" font-size="13" font-weight="bold" fill="#e65100">PROPOSED</text>

  <rect x="40" y="120" width="120" height="36" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="68" y="143" font-size="13" font-weight="bold" fill="#2e7d32">FORMING</text>

  <!-- Arrows from PROPOSED -->
  <path d="M 100 76 L 100 118" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="108" y="100" font-size="10" fill="#43a047">approved</text>

  <path d="M 160 58 L 240 58" stroke="#ea4335" stroke-width="1.5" marker-end="url(#arwRed)"/>

  <!-- REJECTED -->
  <rect x="245" y="40" width="110" height="36" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2"/>
  <text x="264" y="63" font-size="13" font-weight="bold" fill="#c62828">REJECTED</text>

  <!-- Active column -->
  <text x="250" y="115" font-size="11" fill="#888" font-weight="bold">OPERATIONAL</text>

  <rect x="250" y="130" width="120" height="44" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.5"/>
  <text x="285" y="157" font-size="15" font-weight="bold" fill="#1a73e8">ACTIVE</text>

  <!-- FORMING → ACTIVE -->
  <path d="M 160 138 L 248 148" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- FORMING → FAILED -->
  <path d="M 100 156 L 100 200" stroke="#ea4335" stroke-width="1.5" marker-end="url(#arwRed)"/>
  <text x="108" y="182" font-size="10" fill="#ea4335">failed</text>

  <rect x="40" y="205" width="120" height="36" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2"/>
  <text x="78" y="228" font-size="13" font-weight="bold" fill="#c62828">FAILED</text>

  <!-- ACTIVE → REORGANISING -->
  <rect x="430" y="130" width="150" height="40" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
  <text x="443" y="155" font-size="13" font-weight="bold" fill="#6a1b9a">REORGANISING</text>

  <path d="M 370 150 L 428 150" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="380" y="142" font-size="10" fill="#5f6368">reorg</text>

  <!-- REORGANISING → ACTIVE (back) -->
  <path d="M 430 170 Q 400 190 370 170" stroke="#43a047" stroke-width="1.5" marker-end="url(#arw)" fill="none"/>
  <text x="382" y="196" font-size="10" fill="#43a047">reconciled</text>

  <!-- Dissolution column -->
  <text x="250" y="225" font-size="11" fill="#888" font-weight="bold">DISSOLUTION</text>

  <rect x="250" y="240" width="130" height="36" rx="8" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
  <text x="269" y="263" font-size="13" font-weight="bold" fill="#e65100">DISSOLVING</text>

  <!-- ACTIVE → DISSOLVING -->
  <path d="M 310 174 L 310 238" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- DISSOLVING → DISSOLVED -->
  <rect x="250" y="320" width="130" height="36" rx="8" fill="#efebe9" stroke="#795548" stroke-width="2"/>
  <text x="273" y="343" font-size="13" font-weight="bold" fill="#4e342e">DISSOLVED</text>

  <path d="M 315 276 L 315 318" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="322" y="300" font-size="10" fill="#5f6368">all left</text>

  <!-- Legend -->
  <rect x="480" y="240" width="200" height="110" rx="8" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="495" y="262" font-size="11" font-weight="bold" fill="#3c4043">Formation paths</text>
  <circle cx="505" cy="280" r="5" fill="#f9a825"/>
  <text x="518" y="284" font-size="10" fill="#5f6368">Bottom-up → PROPOSED</text>
  <circle cx="505" cy="300" r="5" fill="#43a047"/>
  <text x="518" y="304" font-size="10" fill="#5f6368">Emergence → FORMING</text>
  <circle cx="505" cy="320" r="5" fill="#1a73e8"/>
  <text x="518" y="324" font-size="10" fill="#5f6368">Top-down → FORMING</text>
  <line x1="495" y1="335" x2="590" y2="335" stroke="#ea4335" stroke-width="1.5"/>
  <text x="518" y="345" font-size="10" fill="#ea4335">Terminal states</text>
</svg>
