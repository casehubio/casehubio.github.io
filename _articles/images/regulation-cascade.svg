<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
  <style>
    text { font-family: 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
    .subtitle { font-size: 11px; fill: #666; }
    .box-label { font-size: 12px; font-weight: 600; fill: #fff; }
    .box-detail { font-size: 10px; fill: #fff; opacity: 0.9; }
    .annotation { font-size: 10px; fill: #555; font-style: italic; }
    .tick-label { font-size: 9px; fill: #888; }
    .arrow { fill: none; stroke: #555; stroke-width: 1.5; marker-end: url(#arrowhead); }
    .cascade-arrow { fill: none; stroke: #c0392b; stroke-width: 2; stroke-dasharray: 5,3; marker-end: url(#redarrow); }
    .fade-bar { rx: 3; ry: 3; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <marker id="redarrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c0392b"/>
    </marker>
    <linearGradient id="fatigueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="50%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="effectGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2980b9"/>
      <stop offset="100%" stop-color="#e74c3c"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="380" y="24" text-anchor="middle" class="title">The Regulation Cascade — Four Systems Composing into Breakthrough</text>
  <text x="380" y="42" text-anchor="middle" class="subtitle">Cognitive load biases strategy → fatigue degrades capacity → monitor detects failure → emotion breaks through</text>

  <!-- Timeline -->
  <line x1="60" y1="380" x2="720" y2="380" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="400" class="tick-label">tick 1</text>
  <text x="170" y="400" class="tick-label">tick 3</text>
  <text x="280" y="400" class="tick-label">tick 5</text>
  <text x="390" y="400" class="tick-label">tick 7</text>
  <text x="500" y="400" class="tick-label">tick 9</text>
  <text x="610" y="400" class="tick-label">tick 11</text>
  <text x="700" y="400" class="tick-label">tick 12</text>

  <!-- Layer 1: Cognitive Load -->
  <rect x="60" y="65" width="660" height="48" rx="6" fill="#2c3e50" opacity="0.9"/>
  <text x="80" y="85" class="box-label">Cognitive Load Estimator</text>
  <text x="80" y="101" class="box-detail">drives=4, goals=3, ToM=3 → HIGH → biases toward simple strategies (suppression, distraction)</text>

  <!-- Layer 2: Regulation Strategy (with fatigue gradient) -->
  <rect x="60" y="128" width="660" height="48" rx="6" fill="#2980b9" opacity="0.9"/>
  <text x="80" y="148" class="box-label">Regulation Strategy Selection</text>
  <text x="80" y="164" class="box-detail">HIGH load + personality → RESPONSE_MODULATION (suppression) selected repeatedly</text>

  <!-- Layer 3: Fatigue accumulation bar -->
  <rect x="60" y="191" width="660" height="48" rx="6" fill="#555" opacity="0.15"/>
  <rect x="60" y="191" width="660" height="48" rx="6" fill="url(#fatigueGrad)" opacity="0.85"/>
  <text x="80" y="211" class="box-label" fill="#1a1a2e">Suppression Fatigue (Bosse 2010)</text>
  <text x="80" y="227" class="box-detail" fill="#1a1a2e">α decays: 0.50 → 0.42 → 0.35 → 0.28 → 0.21 → 0.14 → 0.07 → 0.00</text>

  <!-- Fatigue tick markers -->
  <line x1="60" y1="240" x2="60" y2="248" stroke="#27ae60" stroke-width="2"/>
  <line x1="170" y1="240" x2="170" y2="248" stroke="#7f8c00" stroke-width="2"/>
  <line x1="280" y1="240" x2="280" y2="248" stroke="#d4a017" stroke-width="2"/>
  <line x1="390" y1="240" x2="390" y2="248" stroke="#e67e22" stroke-width="2"/>
  <line x1="500" y1="240" x2="500" y2="248" stroke="#d35400" stroke-width="2"/>
  <line x1="610" y1="240" x2="610" y2="248" stroke="#c0392b" stroke-width="2"/>

  <!-- Layer 4: Effectiveness decline -->
  <rect x="60" y="258" width="660" height="48" rx="6" fill="url(#effectGrad)" opacity="0.85"/>
  <text x="80" y="278" class="box-label">Regulation Effectiveness</text>
  <text x="80" y="294" class="box-detail">0.70 → 0.55 → 0.40 → 0.30 → 0.20 → 0.12 → 0.05</text>

  <!-- Layer 5: Monitor -->
  <rect x="60" y="321" width="440" height="42" rx="6" fill="#7f8c8d" opacity="0.85"/>
  <text x="80" y="341" class="box-label">Regulation Monitor (Gross 2015)</text>
  <text x="80" y="355" class="box-detail">3 consecutive declines → ⚠ STRATEGY FAILING</text>

  <!-- Breakthrough box -->
  <rect x="520" y="321" width="200" height="42" rx="6" fill="#c0392b" opacity="0.95"/>
  <text x="540" y="341" class="box-label">⚠ BREAKTHROUGH</text>
  <text x="540" y="355" class="box-detail">effectiveness &lt; 0.10 — emotion</text>

  <!-- Cascade arrows -->
  <path d="M 390 113 L 390 128" class="arrow"/>
  <path d="M 390 176 L 390 191" class="arrow"/>
  <path d="M 390 239 L 390 258" class="arrow"/>
  <path d="M 390 306 L 390 321" class="arrow"/>
  <path d="M 500 342 L 518 342" class="cascade-arrow"/>

  <!-- Annotations -->
  <text x="720" y="90" text-anchor="end" class="annotation">Petter 2025</text>
  <text x="720" y="153" text-anchor="end" class="annotation">LLM-guided</text>
  <text x="720" y="216" text-anchor="end" class="annotation">Bosse 2010</text>
  <text x="720" y="283" text-anchor="end" class="annotation">observable</text>
  <text x="720" y="346" text-anchor="end" class="annotation">Gross 2015</text>
</svg>
