<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="380" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Hybrid A/C Prompt Routing</text>

  <!-- Disposition input -->
  <rect x="20" y="140" width="130" height="60" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="85" y="162" text-anchor="middle" font-size="11" font-weight="500" fill="#7e22ce">Disposition Axes</text>
  <text x="85" y="178" text-anchor="middle" font-size="9" fill="#7e22ce">bold + strict</text>

  <!-- Tension scorer -->
  <rect x="190" y="130" width="140" height="80" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <text x="260" y="158" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">DispositionTension</text>
  <text x="260" y="176" text-anchor="middle" font-size="10" fill="#64748b">6-pair lookup table</text>
  <text x="260" y="192" text-anchor="middle" font-size="10" fill="#64748b">max tension score</text>

  <line x1="150" y1="170" x2="185" y2="170" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Decision diamond -->
  <polygon points="420,170 470,140 520,170 470,200" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="470" y="174" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">&gt; 0.5?</text>

  <line x1="330" y1="170" x2="415" y2="170" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Path A -->
  <rect x="540" y="50" width="160" height="90" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="620" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Path A (default)</text>
  <text x="620" y="90" text-anchor="middle" font-size="9" fill="#334155">Default system prompt</text>
  <text x="620" y="104" text-anchor="middle" font-size="9" fill="#334155">+ personality suffix</text>
  <text x="620" y="118" text-anchor="middle" font-size="9" fill="#334155">in user prompt</text>
  <text x="620" y="135" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">"Classify as this character"</text>

  <line x1="495" y1="145" x2="535" y2="100" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="502" y="118" font-size="9" fill="#3b82f6">no</text>

  <!-- Path C -->
  <rect x="540" y="220" width="160" height="110" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="620" y="242" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Path C (tension)</text>
  <text x="620" y="260" text-anchor="middle" font-size="9" fill="#334155">Personality frame in</text>
  <text x="620" y="274" text-anchor="middle" font-size="9" fill="#334155">system prompt + tension</text>
  <text x="620" y="288" text-anchor="middle" font-size="9" fill="#334155">narrative + topology</text>
  <text x="620" y="302" text-anchor="middle" font-size="9" fill="#334155">+ suffix in user prompt</text>
  <text x="620" y="322" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">"Through this character's lens"</text>

  <line x1="495" y1="195" x2="535" y2="260" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="502" y="232" font-size="9" fill="#ef4444">yes</text>

  <!-- Tension table excerpt -->
  <rect x="20" y="260" width="420" height="100" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="230" y="282" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Tension Pairs</text>
  <text x="30" y="300" font-size="9" fill="#475569" font-family="monospace">bold + strict       → 1.0  approach vs inhibition</text>
  <text x="30" y="316" font-size="9" fill="#475569" font-family="monospace">high auton + avoid  → 0.9  independent won't confront</text>
  <text x="30" y="332" font-size="9" fill="#475569" font-family="monospace">coop + high auton   → 0.8  group-oriented self-directed</text>
  <text x="30" y="348" font-size="9" fill="#475569" font-family="monospace">competitive + strict → 0.6  driven to win bound by rules</text>
</svg>
