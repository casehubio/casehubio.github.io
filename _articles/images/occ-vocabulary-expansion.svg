<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
    <marker id="arrow-new" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2d7d46"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 15px; font-weight: 600; fill: #333; }
    .subtitle { font-size: 11px; fill: #888; }
    .sec-label { font-size: 11px; fill: #444; }
    .occ-label { font-size: 11px; fill: #444; }
    .occ-new { font-size: 11px; fill: #2d7d46; font-weight: 600; }
    .drive-label { font-size: 10px; fill: #666; }
    .box { rx: 4; ry: 4; }
    .sec-box { fill: #e8f0fe; stroke: #4285f4; stroke-width: 1; }
    .occ-box { fill: #fef7e0; stroke: #f9ab00; stroke-width: 1; }
    .occ-box-new { fill: #e6f4ea; stroke: #2d7d46; stroke-width: 1.5; stroke-dasharray: 4,2; }
    .drive-box { fill: #f3e8fd; stroke: #9334e6; stroke-width: 1; }
    .gap-box { fill: #fce8e6; stroke: #d93025; stroke-width: 1; rx: 4; ry: 4; }
    .connector { stroke: #999; stroke-width: 1; fill: none; marker-end: url(#arrow); }
    .connector-new { stroke: #2d7d46; stroke-width: 1.5; fill: none; marker-end: url(#arrow-new); stroke-dasharray: 5,3; }
    .connector-gap { stroke: #d93025; stroke-width: 1; fill: none; stroke-dasharray: 3,3; }
    .section-label { font-size: 13px; font-weight: 600; fill: #555; }
    .divider { stroke: #ddd; stroke-width: 1; stroke-dasharray: 4,4; }
  </style>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" class="title">SEC to OCC Emotion Mapping — Vocabulary Expansion</text>
  <text x="400" y="46" text-anchor="middle" class="subtitle">Dashed green = new mappings added in #1024</text>

  <!-- Divider -->
  <line x1="0" y1="230" x2="800" y2="230" class="divider"/>
  <text x="20" y="72" class="section-label">BEFORE</text>
  <text x="20" y="252" class="section-label">AFTER</text>

  <!-- ===== BEFORE section ===== -->
  <!-- SEC dimensions -->
  <rect x="30" y="85" width="130" height="28" class="box sec-box"/>
  <text x="95" y="104" text-anchor="middle" class="sec-label">novelty: 0.85</text>
  <rect x="30" y="120" width="130" height="28" class="box sec-box"/>
  <text x="95" y="139" text-anchor="middle" class="sec-label">conduciveness: 0.3</text>
  <rect x="30" y="155" width="130" height="28" class="box sec-box"/>
  <text x="95" y="174" text-anchor="middle" class="sec-label">internal-std: 0.2</text>
  <rect x="30" y="190" width="130" height="28" class="box sec-box"/>
  <text x="95" y="209" text-anchor="middle" class="sec-label">urgency: 0.8</text>

  <!-- OCC emotions (before) -->
  <rect x="250" y="85" width="100" height="28" class="box occ-box"/>
  <text x="300" y="104" text-anchor="middle" class="occ-label">HOPE</text>
  <rect x="250" y="120" width="100" height="28" class="box occ-box"/>
  <text x="300" y="139" text-anchor="middle" class="occ-label">JOY</text>
  <rect x="250" y="155" width="100" height="28" class="box occ-box"/>
  <text x="300" y="174" text-anchor="middle" class="occ-label">SHAME</text>

  <!-- Gap boxes -->
  <rect x="250" y="190" width="100" height="28" class="gap-box"/>
  <text x="300" y="209" text-anchor="middle" font-size="10" fill="#d93025">no INTEREST</text>

  <!-- Connectors (before) -->
  <line x1="160" y1="99" x2="248" y2="99" class="connector"/>
  <line x1="160" y1="134" x2="248" y2="134" class="connector"/>
  <line x1="160" y1="169" x2="248" y2="169" class="connector"/>
  <line x1="160" y1="204" x2="248" y2="204" class="connector-gap"/>

  <!-- Drive output (before) -->
  <rect x="440" y="85" width="140" height="28" class="box drive-box"/>
  <text x="510" y="104" text-anchor="middle" class="drive-label">CURIOSITY: 0.33</text>
  <rect x="440" y="120" width="140" height="28" class="box drive-box"/>
  <text x="510" y="139" text-anchor="middle" class="drive-label">AUTONOMY: 1.0 (sat.)</text>
  <rect x="440" y="155" width="140" height="28" class="box drive-box"/>
  <text x="510" y="174" text-anchor="middle" class="drive-label">AFFILIATION: 0.1</text>

  <!-- Tendency (before) -->
  <rect x="650" y="85" width="120" height="28" class="box occ-box"/>
  <text x="710" y="104" text-anchor="middle" class="occ-label">ATTENDING</text>
  <rect x="650" y="120" width="120" height="28" class="gap-box"/>
  <text x="710" y="139" text-anchor="middle" font-size="10" fill="#d93025">no DOMINANCE</text>

  <line x1="350" y1="99" x2="438" y2="99" class="connector"/>
  <line x1="350" y1="169" x2="438" y2="134" class="connector"/>
  <line x1="350" y1="169" x2="438" y2="162" class="connector"/>

  <!-- ===== AFTER section ===== -->
  <!-- SEC dimensions -->
  <rect x="30" y="265" width="130" height="28" class="box sec-box"/>
  <text x="95" y="284" text-anchor="middle" class="sec-label">novelty: 0.85</text>
  <rect x="30" y="300" width="130" height="28" class="box sec-box"/>
  <text x="95" y="319" text-anchor="middle" class="sec-label">conduciveness: 0.3</text>
  <rect x="30" y="335" width="130" height="28" class="box sec-box"/>
  <text x="95" y="354" text-anchor="middle" class="sec-label">internal-std: 0.2</text>
  <rect x="30" y="370" width="130" height="28" class="box sec-box"/>
  <text x="95" y="389" text-anchor="middle" class="sec-label">controllability: 0.7</text>
  <rect x="30" y="405" width="130" height="28" class="box sec-box"/>
  <text x="95" y="424" text-anchor="middle" class="sec-label">urgency: 0.8</text>

  <!-- OCC emotions (after) -->
  <rect x="250" y="265" width="100" height="28" class="box occ-box"/>
  <text x="300" y="284" text-anchor="middle" class="occ-label">HOPE</text>
  <rect x="250" y="300" width="100" height="28" class="box occ-box"/>
  <text x="300" y="319" text-anchor="middle" class="occ-label">JOY</text>
  <rect x="250" y="335" width="100" height="28" class="box occ-box-new"/>
  <text x="300" y="354" text-anchor="middle" class="occ-new">INTEREST</text>
  <rect x="250" y="370" width="100" height="28" class="box occ-box-new"/>
  <text x="300" y="389" text-anchor="middle" class="occ-new">REMORSE</text>

  <!-- Connectors (after) -->
  <line x1="160" y1="279" x2="248" y2="279" class="connector"/>
  <line x1="160" y1="314" x2="248" y2="314" class="connector"/>
  <line x1="160" y1="279" x2="248" y2="349" class="connector-new"/>
  <line x1="160" y1="354" x2="248" y2="383" class="connector-new"/>
  <line x1="160" y1="384" x2="248" y2="383" class="connector-new"/>

  <!-- Drive output (after) -->
  <rect x="440" y="265" width="140" height="28" class="box drive-box"/>
  <text x="510" y="284" text-anchor="middle" class="drive-label">CURIOSITY: 0.60</text>
  <rect x="440" y="300" width="140" height="28" class="box drive-box"/>
  <text x="510" y="319" text-anchor="middle" class="drive-label">AUTONOMY: 0.8</text>
  <rect x="440" y="335" width="140" height="28" class="box drive-box"/>
  <text x="510" y="354" text-anchor="middle" class="drive-label">AFFILIATION: 1.0</text>

  <!-- Tendency (after) -->
  <rect x="650" y="265" width="120" height="28" class="box occ-box"/>
  <text x="710" y="284" text-anchor="middle" class="occ-label">ATTENDING</text>
  <rect x="650" y="300" width="120" height="28" class="box occ-box-new"/>
  <text x="710" y="319" text-anchor="middle" class="occ-new">DOMINANCE</text>

  <line x1="350" y1="279" x2="438" y2="279" class="connector"/>
  <line x1="350" y1="349" x2="438" y2="279" class="connector-new"/>
  <line x1="350" y1="383" x2="438" y2="349" class="connector-new"/>
  <line x1="350" y1="314" x2="438" y2="305" class="connector"/>

  <!-- Annotations -->
  <text x="510" y="389" text-anchor="middle" font-size="10" fill="#2d7d46" font-style="italic">controllability gates guilt vs shame</text>
  <text x="710" y="349" text-anchor="middle" font-size="10" fill="#2d7d46" font-style="italic">urgency + threat = take charge</text>
  <text x="510" y="449" text-anchor="middle" font-size="10" fill="#888">arousal boost: urgency*0.4 + novelty*0.3</text>
</svg>
