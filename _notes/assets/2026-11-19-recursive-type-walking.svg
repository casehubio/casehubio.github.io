<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="22" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Recursive writeProperty walks the full type tree</text>

  <!-- Top level: writeProperty -->
  <rect x="200" y="38" width="280" height="34" rx="6" fill="#e8f4fd" stroke="#2980b9" stroke-width="1.5"/>
  <text x="340" y="60" text-anchor="middle" font-size="12" fill="#2980b9" font-weight="600">writeProperty(field.asType())</text>

  <!-- Branch: List<T>? -->
  <line x1="260" y1="72" x2="140" y2="104" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="420" y1="72" x2="540" y2="104" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Left branch: List -->
  <rect x="40" y="106" width="200" height="30" rx="6" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="140" y="126" text-anchor="middle" font-size="11" fill="#333">List&lt;T&gt;? extract T</text>

  <line x1="80" y1="136" x2="80" y2="166" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="200" y1="136" x2="200" y2="166" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Left-left: T is record -->
  <rect x="10" y="168" width="140" height="30" rx="6" fill="#f0faf4" stroke="#27ae60" stroke-width="1.5"/>
  <text x="80" y="188" text-anchor="middle" font-size="11" fill="#27ae60">T is record</text>

  <line x1="80" y1="198" x2="80" y2="228" stroke="#27ae60" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="8" y="230" width="144" height="34" rx="6" fill="#f0faf4" stroke="#27ae60" stroke-width="1.5"/>
  <text x="80" y="250" text-anchor="middle" font-size="10" fill="#27ae60">writeRecordSchema(T)</text>
  <text x="80" y="260" text-anchor="middle" font-size="9" fill="#888">walks components</text>

  <!-- Recursive arrow back up -->
  <path d="M8,247 Q-20,180 200,55" fill="none" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="20" y="162" font-size="10" fill="#8e44ad" transform="rotate(-60, 20, 162)">recursive</text>

  <!-- Left-right: T is simple -->
  <rect x="160" y="168" width="100" height="30" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/>
  <text x="210" y="188" text-anchor="middle" font-size="11" fill="#7d6608">T is simple</text>

  <line x1="210" y1="198" x2="210" y2="228" stroke="#d4ac0d" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="150" y="230" width="120" height="34" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/>
  <text x="210" y="252" text-anchor="middle" font-size="10" font-family="monospace" fill="#7d6608">items: {type}</text>

  <!-- Right branch: Record? -->
  <rect x="440" y="106" width="200" height="30" rx="6" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="540" y="126" text-anchor="middle" font-size="11" fill="#333">Record? standalone</text>

  <line x1="540" y1="136" x2="540" y2="166" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="460" y="168" width="160" height="34" rx="6" fill="#f0faf4" stroke="#27ae60" stroke-width="1.5"/>
  <text x="540" y="188" text-anchor="middle" font-size="10" fill="#27ae60">writeRecordSchema(T)</text>
  <text x="540" y="198" text-anchor="middle" font-size="9" fill="#888">same method</text>

  <!-- Recursive arrow from standalone -->
  <path d="M460,185 Q390,120 380,55" fill="none" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="390" y="130" font-size="10" fill="#8e44ad" transform="rotate(-70, 390, 130)">recursive</text>

  <!-- Right-right: simple fallback -->
  <rect x="440" y="230" width="200" height="30" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="540" y="250" text-anchor="middle" font-size="11" fill="#666">Simple type: toJsonType()</text>
  <line x1="600" y1="136" x2="600" y2="228" stroke="#999" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#a)"/>
  <text x="620" y="186" font-size="10" fill="#999">else</text>

  <!-- Bottom: shared method highlight -->
  <rect x="160" y="290" width="360" height="34" rx="8" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="340" y="312" text-anchor="middle" font-size="12" fill="#8e44ad" font-weight="600">writeRecordSchema: shared by List&lt;Record&gt; and standalone Record</text>
</svg>
