<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1.2"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#c0392b" stroke-width="1.2"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#27ae60" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#333">TypeMirror carries structure — toString() discards it</text>

  <!-- Left path: toString() -->
  <text x="180" y="58" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="600">Before: toString()</text>

  <rect x="60" y="70" width="240" height="36" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="180" y="93" text-anchor="middle" font-size="12" fill="#333">field.asType().toString()</text>

  <line x1="180" y1="106" x2="180" y2="130" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>

  <rect x="40" y="132" width="280" height="36" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
  <text x="180" y="155" text-anchor="middle" font-size="12" fill="#c0392b" font-family="monospace">"java.util.List&lt;TextMark&gt;"</text>

  <line x1="180" y1="168" x2="180" y2="192" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>

  <rect x="60" y="194" width="240" height="36" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="180" y="217" text-anchor="middle" font-size="12" fill="#333">startsWith("java.util.List")</text>

  <line x1="180" y1="230" x2="180" y2="254" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>

  <rect x="60" y="256" width="240" height="44" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
  <text x="180" y="275" text-anchor="middle" font-size="11" font-family="monospace" fill="#c0392b">{ "type": "array" }</text>
  <text x="180" y="292" text-anchor="middle" font-size="10" fill="#888">no items — element type lost</text>

  <!-- Right path: TypeMirror -->
  <text x="540" y="58" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="600">After: TypeMirror API</text>

  <rect x="420" y="70" width="240" height="36" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="540" y="93" text-anchor="middle" font-size="12" fill="#333">field.asType() → DeclaredType</text>

  <line x1="540" y1="106" x2="540" y2="130" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <rect x="400" y="132" width="280" height="36" rx="6" fill="#f0faf4" stroke="#27ae60" stroke-width="1.5"/>
  <text x="540" y="155" text-anchor="middle" font-size="12" fill="#27ae60">dt.getTypeArguments() → [TextMark]</text>

  <line x1="540" y1="168" x2="540" y2="192" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <rect x="420" y="194" width="240" height="36" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="540" y="217" text-anchor="middle" font-size="12" fill="#333">isRecordType() → getRecordComponents()</text>

  <line x1="540" y1="230" x2="540" y2="254" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <rect x="380" y="256" width="320" height="44" rx="6" fill="#f0faf4" stroke="#27ae60" stroke-width="1.5"/>
  <text x="540" y="275" text-anchor="middle" font-size="11" font-family="monospace" fill="#27ae60">{ "type": "array", "items": { ... } }</text>
  <text x="540" y="292" text-anchor="middle" font-size="10" fill="#888">properties, required — full schema</text>
</svg>
