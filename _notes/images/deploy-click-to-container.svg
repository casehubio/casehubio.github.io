<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" font-family="'SF Mono', 'Fira Code', monospace" font-size="11">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-grn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="740" height="320" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="370" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b" font-family="system-ui, sans-serif">Click to Container: the full deploy path</text>

  <!-- Row 1: UI layer -->
  <rect x="20" y="44" width="120" height="50" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="64" text-anchor="middle" font-weight="600" fill="#1e40af" font-size="10" font-family="system-ui, sans-serif">Deploy Tab</text>
  <text x="80" y="78" text-anchor="middle" fill="#1e3a8a" font-size="9">select row</text>

  <line x1="140" y1="69" x2="168" y2="69" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="170" y="44" width="130" height="50" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="235" y="64" text-anchor="middle" font-weight="600" fill="#1e40af" font-size="10" font-family="system-ui, sans-serif">actionButton</text>
  <text x="235" y="78" text-anchor="middle" fill="#1e3a8a" font-size="9">POST /deploy</text>

  <line x1="300" y1="69" x2="328" y2="69" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="330" y="44" width="160" height="50" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="410" y="64" text-anchor="middle" font-weight="500" fill="#334155" font-size="10" font-family="system-ui, sans-serif">TopologyCatalogueResource</text>
  <text x="410" y="78" text-anchor="middle" fill="#64748b" font-size="9">compile + plan + deploy</text>

  <line x1="490" y1="69" x2="518" y2="69" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="520" y="44" width="200" height="50" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="620" y="64" text-anchor="middle" font-weight="500" fill="#334155" font-size="10" font-family="system-ui, sans-serif">DesiredState Reconciler</text>
  <text x="620" y="78" text-anchor="middle" fill="#64748b" font-size="9">graph diff → provision nodes</text>

  <!-- Row 2: Target routing -->
  <rect x="330" y="120" width="160" height="50" rx="5" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="410" y="140" text-anchor="middle" font-weight="600" fill="#9a3412" font-size="10" font-family="system-ui, sans-serif">resolveTarget()</text>
  <text x="410" y="154" text-anchor="middle" fill="#78350f" font-size="9">override: "podman"</text>

  <line x1="410" y1="94" x2="410" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="490" y1="145" x2="518" y2="145" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="520" y="120" width="200" height="50" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="620" y="140" text-anchor="middle" font-weight="600" fill="#166534" font-size="10" font-family="system-ui, sans-serif">PodmanDeploymentTarget</text>
  <text x="620" y="154" text-anchor="middle" fill="#16a34a" font-size="9">deploy(imageRef, config)</text>

  <!-- Row 3: Containers -->
  <text x="370" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" font-family="system-ui, sans-serif">Podman containers (dependency order)</text>

  <rect x="40" y="224" width="150" height="44" rx="5" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="115" y="244" text-anchor="middle" font-weight="500" fill="#0c4a6e" font-size="10" font-family="system-ui, sans-serif">manifest</text>
  <text x="115" y="258" text-anchor="middle" fill="#0369a1" font-size="9">schema registry</text>

  <line x1="190" y1="246" x2="218" y2="246" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-grn)"/>

  <rect x="220" y="224" width="150" height="44" rx="5" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="295" y="244" text-anchor="middle" font-weight="500" fill="#0c4a6e" font-size="10" font-family="system-ui, sans-serif">eidos</text>
  <text x="295" y="258" text-anchor="middle" fill="#0369a1" font-size="9">type system</text>

  <line x1="370" y1="246" x2="398" y2="246" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-grn)"/>

  <rect x="400" y="224" width="150" height="44" rx="5" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="475" y="244" text-anchor="middle" font-weight="500" fill="#0c4a6e" font-size="10" font-family="system-ui, sans-serif">engine</text>
  <text x="475" y="258" text-anchor="middle" fill="#0369a1" font-size="9">case runtime</text>

  <line x1="550" y1="246" x2="578" y2="246" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-grn)"/>

  <rect x="580" y="224" width="140" height="44" rx="5" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="650" y="244" text-anchor="middle" font-weight="500" fill="#0c4a6e" font-size="10" font-family="system-ui, sans-serif">my-llm</text>
  <text x="650" y="258" text-anchor="middle" fill="#0369a1" font-size="9">LLM application</text>

  <!-- Arrow from PodmanTarget down to containers -->
  <line x1="620" y1="170" x2="620" y2="198" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- sequence label -->
  <text x="370" y="296" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui, sans-serif">manifest → eidos → engine → my-llm (provisioned in dependency order)</text>
</svg>
