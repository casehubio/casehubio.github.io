<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, sans-serif" font-size="13">
  <!-- Left: What we built -->
  <text x="170" y="24" text-anchor="middle" fill="#f87171" font-weight="600" font-size="14">What we built</text>

  <rect x="20" y="40" width="300" height="260" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>

  <!-- Grid lines (confusing) -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.4">
    <line x1="45" y1="40" x2="45" y2="300"/>
    <line x1="70" y1="40" x2="70" y2="300"/>
    <line x1="95" y1="40" x2="95" y2="300"/>
    <line x1="120" y1="40" x2="120" y2="300"/>
    <line x1="145" y1="40" x2="145" y2="300"/>
    <line x1="170" y1="40" x2="170" y2="300"/>
    <line x1="195" y1="40" x2="195" y2="300"/>
    <line x1="220" y1="40" x2="220" y2="300"/>
    <line x1="245" y1="40" x2="245" y2="300"/>
    <line x1="270" y1="40" x2="270" y2="300"/>
    <line x1="295" y1="40" x2="295" y2="300"/>
    <line x1="20" y1="100" x2="320" y2="100"/>
    <line x1="20" y1="160" x2="320" y2="160"/>
    <line x1="20" y1="220" x2="320" y2="220"/>
  </g>

  <!-- Ghost rectangle (detached from content) -->
  <rect x="130" y="110" width="120" height="50" rx="4" fill="#3b82f6" opacity="0.3" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="190" y="140" text-anchor="middle" fill="#60a5fa" font-size="10">ghost (overlay)</text>

  <!-- Faded original -->
  <rect x="30" y="50" width="120" height="50" rx="4" fill="#1e293b" opacity="0.4" stroke="#475569" stroke-width="1"/>
  <text x="90" y="80" text-anchor="middle" fill="#94a3b8" font-size="10" opacity="0.5">Panel A</text>

  <!-- Other panels jumping around -->
  <rect x="160" y="170" width="140" height="40" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="230" y="195" text-anchor="middle" fill="#94a3b8" font-size="10">Panel B (pushed??)</text>

  <text x="170" y="260" text-anchor="middle" fill="#f87171" font-size="11">Panels jump unpredictably.</text>
  <text x="170" y="276" text-anchor="middle" fill="#f87171" font-size="11">Ghost detached from layout.</text>

  <!-- Right: What works -->
  <text x="540" y="24" text-anchor="middle" fill="#22c55e" font-weight="600" font-size="14">What works (Gridstack model)</text>

  <rect x="400" y="40" width="300" height="260" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>

  <!-- Panel B stays put -->
  <rect x="540" y="50" width="150" height="50" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="615" y="80" text-anchor="middle" fill="#e2e8f0" font-size="10">Panel B</text>

  <!-- Placeholder at drop target -->
  <rect x="410" y="110" width="140" height="50" rx="4" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6"/>
  <text x="480" y="140" text-anchor="middle" fill="#22c55e" font-size="10">placeholder</text>

  <!-- Panel C pushed DOWN predictably -->
  <rect x="410" y="170" width="280" height="40" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="550" y="195" text-anchor="middle" fill="#94a3b8" font-size="10">Panel C (pushed down ↓)</text>

  <!-- Dragged panel following cursor -->
  <rect x="430" y="95" width="140" height="50" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
  <text x="500" y="125" text-anchor="middle" fill="#e2e8f0" font-size="10">Panel A (dragging)</text>

  <text x="540" y="260" text-anchor="middle" fill="#22c55e" font-size="11">Placeholder shows exactly where</text>
  <text x="540" y="276" text-anchor="middle" fill="#22c55e" font-size="11">it lands. Gravity pulls up.</text>
</svg>
