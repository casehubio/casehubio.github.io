<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Left column: Consolidation Scheduler -->
  <rect x="20" y="20" width="300" height="300" rx="8" fill="#f0f4ff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="170" y="46" text-anchor="middle" font-weight="600" font-size="14" fill="#334155">Consolidation Scheduler</text>
  <text x="170" y="62" text-anchor="middle" font-size="11" fill="#64748b">every 5 min</text>

  <rect x="40" y="78" width="260" height="28" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.8"/>
  <text x="170" y="97" text-anchor="middle" font-size="12" fill="#475569">27 existing phases (10–50)</text>

  <rect x="40" y="118" width="260" height="28" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="170" y="137" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">HygieneAdaptationPhase @48</text>

  <rect x="60" y="160" width="220" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="0.6"/>
  <text x="170" y="176" text-anchor="middle" font-size="11" fill="#64748b">read tenantGapSummary()</text>

  <rect x="60" y="190" width="220" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="0.6"/>
  <text x="170" y="206" text-anchor="middle" font-size="11" fill="#64748b">compute eviction pressure</text>

  <rect x="60" y="220" width="220" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="0.6"/>
  <text x="170" y="236" text-anchor="middle" font-size="11" fill="#64748b">adjust retentionThreshold ±0.02</text>

  <rect x="60" y="250" width="220" height="22" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="0.8"/>
  <text x="170" y="266" text-anchor="middle" font-size="11" fill="#166534">write AdaptiveRetentionConfig</text>

  <rect x="60" y="280" width="220" height="22" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="170" y="296" text-anchor="middle" font-size="11" fill="#92400e">fire HygieneAdaptationEvent</text>

  <!-- Right column: Hygiene Scheduler -->
  <rect x="360" y="20" width="300" height="300" rx="8" fill="#fff7ed" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="510" y="46" text-anchor="middle" font-weight="600" font-size="14" fill="#334155">Hygiene Scheduler</text>
  <text x="510" y="62" text-anchor="middle" font-size="11" fill="#64748b">external cadence</text>

  <rect x="380" y="88" width="260" height="28" rx="4" fill="#fed7aa" stroke="#f97316" stroke-width="1.2"/>
  <text x="510" y="107" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">MemoryHygieneOrchestrator</text>

  <rect x="400" y="130" width="220" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="0.6"/>
  <text x="510" y="146" text-anchor="middle" font-size="11" fill="#64748b">read configSupplier.current()</text>

  <rect x="400" y="160" width="220" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="0.6"/>
  <text x="510" y="176" text-anchor="middle" font-size="11" fill="#64748b">score memories via RetentionConfig</text>

  <rect x="400" y="190" width="220" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="0.6"/>
  <text x="510" y="206" text-anchor="middle" font-size="11" fill="#64748b">evict below threshold</text>

  <rect x="400" y="220" width="220" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="0.6"/>
  <text x="510" y="236" text-anchor="middle" font-size="11" fill="#64748b">consolidate similar survivors</text>

  <rect x="400" y="258" width="220" height="22" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="510" y="274" text-anchor="middle" font-size="11" fill="#1e40af">write KnowledgeGapSummary</text>

  <!-- Arrows between columns -->
  <path d="M280,261 C340,261 340,139 380,139" fill="none" stroke="#22c55e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="332" y="185" text-anchor="middle" font-size="10" fill="#166534" transform="rotate(-90,332,185)">config</text>

  <path d="M400,269 C340,269 340,171 280,171" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="348" y="235" text-anchor="middle" font-size="10" fill="#1e40af" transform="rotate(-90,348,235)">quality</text>
</svg>
