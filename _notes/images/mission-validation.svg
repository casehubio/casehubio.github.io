<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="mv-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="680" height="320" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Mission Commitment Validation Pipeline</text>

  <!-- Step 1 -->
  <rect x="30" y="50" width="180" height="70" rx="6" fill="#f0f9ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">1. Mission exists?</text>
  <text x="120" y="92" text-anchor="middle" font-size="10" fill="#475569">missionName matches</text>
  <text x="120" y="106" text-anchor="middle" font-size="10" fill="#475569">a MissionSpec on the spec</text>

  <line x1="210" y1="85" x2="250" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#mv-arr)"/>

  <!-- Step 2 -->
  <rect x="260" y="50" width="180" height="70" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="350" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">2. Required role?</text>
  <text x="350" y="92" text-anchor="middle" font-size="10" fill="#475569">agent holds at least one</text>
  <text x="350" y="106" text-anchor="middle" font-size="10" fill="#475569">role in requiredRoles set</text>

  <line x1="440" y1="85" x2="480" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#mv-arr)"/>

  <!-- Step 3 -->
  <rect x="490" y="50" width="160" height="70" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="570" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#6b21a8">3. Capacity?</text>
  <text x="570" y="92" text-anchor="middle" font-size="10" fill="#475569">current committers</text>
  <text x="570" y="106" text-anchor="middle" font-size="10" fill="#475569">&lt; maxCommitters</text>

  <!-- Fulfilment path -->
  <text x="340" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Mission Fulfilment Validation</text>

  <rect x="180" y="180" width="160" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="260" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Min committers?</text>
  <text x="260" y="222" text-anchor="middle" font-size="10" fill="#475569">current committers</text>
  <text x="260" y="236" text-anchor="middle" font-size="10" fill="#475569">≥ minCommitters</text>

  <line x1="340" y1="215" x2="390" y2="215" stroke="#64748b" stroke-width="1.5" marker-end="url(#mv-arr)"/>

  <rect x="400" y="180" width="160" height="70" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Fulfilled</text>
  <text x="480" y="222" text-anchor="middle" font-size="10" fill="#475569">all commitments for</text>
  <text x="480" y="236" text-anchor="middle" font-size="10" fill="#475569">this mission cleared</text>

  <!-- Rationale -->
  <text x="340" y="290" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Each check is a hard gate — failure throws OrgValidationException</text>
  <text x="340" y="306" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">before any state mutation occurs</text>
</svg>
