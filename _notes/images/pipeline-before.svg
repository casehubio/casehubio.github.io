<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="340" fill="#fafafa" rx="8"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Before — Spatial-Coupled Orchestrator</text>

  <!-- Orchestrator box -->
  <rect x="180" y="50" width="320" height="240" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="340" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">KnowledgePipelineOrchestrator</text>

  <!-- Internal hardcoded pieces -->
  <rect x="200" y="88" width="130" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="265" y="111" text-anchor="middle" font-size="11" fill="#991b1b">List&lt;LocationPlatform&gt;</text>

  <rect x="350" y="88" width="130" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="415" y="111" text-anchor="middle" font-size="11" fill="#991b1b">SpatialCacheStore</text>

  <rect x="200" y="136" width="130" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="265" y="159" text-anchor="middle" font-size="11" fill="#991b1b">SpatialBlockingStrategy</text>

  <rect x="350" y="136" width="130" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="415" y="159" text-anchor="middle" font-size="11" fill="#991b1b">Place→CachedEntity</text>

  <rect x="200" y="184" width="130" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="265" y="207" text-anchor="middle" font-size="11" fill="#991b1b">ExpansionStrategy</text>

  <rect x="350" y="184" width="130" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="415" y="207" text-anchor="middle" font-size="11" fill="#991b1b">geohashPrecision</text>

  <!-- Callout -->
  <rect x="200" y="234" width="280" height="36" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-dasharray="4,3"/>
  <text x="340" y="257" text-anchor="middle" font-size="12" font-weight="500" fill="#991b1b">Every field is location-specific</text>

  <!-- External provider -->
  <rect x="20" y="130" width="120" height="44" rx="4" fill="#e0e7ff" stroke="#818cf8"/>
  <text x="80" y="148" text-anchor="middle" font-size="11" fill="#3730a3">LocationPlatform</text>
  <text x="80" y="164" text-anchor="middle" font-size="10" fill="#6366f1">(Google, Apple)</text>
  <line x1="140" y1="152" x2="180" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-b)"/>

  <!-- Query -->
  <rect x="540" y="130" width="120" height="44" rx="4" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="600" y="148" text-anchor="middle" font-size="11" fill="#065f46">KnowledgeQuery</text>
  <text x="600" y="164" text-anchor="middle" font-size="10" fill="#059669">(sealed → location)</text>
  <line x1="540" y1="152" x2="500" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-b)"/>
</svg>
