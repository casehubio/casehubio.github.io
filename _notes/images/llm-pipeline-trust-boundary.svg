<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" fill="#fafaf9" rx="8"/>

  <!-- LLM Zone -->
  <rect x="30" y="30" width="260" height="280" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="160" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Generative (Probabilistic)</text>

  <!-- Pipeline Zone -->
  <rect x="430" y="30" width="260" height="280" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="560" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Mechanical (Deterministic)</text>

  <!-- Trust Boundary -->
  <rect x="310" y="30" width="100" height="280" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="360" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">TRUST</text>
  <text x="360" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">BOUNDARY</text>

  <!-- LLM Output -->
  <rect x="55" y="90" width="210" height="40" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="1"/>
  <text x="160" y="115" text-anchor="middle" font-size="12" fill="#78350f">intensityDelta: -0.9</text>

  <rect x="55" y="150" width="210" height="40" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="1"/>
  <text x="160" y="175" text-anchor="middle" font-size="12" fill="#78350f">goalOps for SUPPRESSION</text>

  <rect x="55" y="210" width="210" height="40" rx="6" fill="#fff" stroke="#f59e0b" stroke-width="1"/>
  <text x="160" y="235" text-anchor="middle" font-size="12" fill="#78350f">hint: SUPPRESS_INFO (ordinal)</text>

  <!-- Boundary Actions -->
  <text x="360" y="115" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">CLAMP</text>
  <text x="360" y="175" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">REJECT</text>
  <text x="360" y="235" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">REORDER</text>

  <!-- Pipeline Input -->
  <rect x="455" y="90" width="210" height="40" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
  <text x="560" y="115" text-anchor="middle" font-size="12" fill="#1e3a5f">intensityDelta: -0.5</text>

  <rect x="455" y="150" width="210" height="40" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
  <text x="560" y="175" text-anchor="middle" font-size="12" fill="#1e3a5f">narrative only (empty [])</text>

  <rect x="455" y="210" width="210" height="40" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
  <text x="560" y="235" text-anchor="middle" font-size="12" fill="#1e3a5f">hint: AVOIDANCE (priority)</text>

  <!-- Arrows -->
  <line x1="265" y1="110" x2="310" y2="110" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="410" y1="110" x2="455" y2="110" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="265" y1="170" x2="310" y2="170" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="410" y1="170" x2="455" y2="170" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="265" y1="230" x2="310" y2="230" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="410" y1="230" x2="455" y2="230" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="360" y="290" text-anchor="middle" font-size="11" fill="#64748b">The prompt is documentation. The parser is the contract.</text>
</svg>
