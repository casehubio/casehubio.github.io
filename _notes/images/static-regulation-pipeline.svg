<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <text x="410" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Static Regulation — Personality Computed Once, Never Updated</text>

  <!-- Personality Traits -->
  <rect x="20" y="60" width="160" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Personality Traits</text>
  <text x="100" y="106" text-anchor="middle" font-size="10" fill="#3b82f6">avoidant, cooperative</text>
  <text x="100" y="120" text-anchor="middle" font-size="10" fill="#3b82f6">low autonomy, conservative</text>

  <!-- Arrow -->
  <line x1="180" y1="100" x2="220" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="200" y="90" text-anchor="middle" font-size="9" fill="#94a3b8">once</text>

  <!-- CDE Derivation -->
  <rect x="225" y="60" width="160" height="80" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="305" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="#854d0e">CDE Derivation</text>
  <text x="305" y="106" text-anchor="middle" font-size="10" fill="#a16207">reappraisal: 0.30</text>
  <text x="305" y="120" text-anchor="middle" font-size="10" fill="#a16207">suppression: 0.80</text>
  <text x="305" y="134" text-anchor="middle" font-size="10" fill="#a16207">redirect: 0.85</text>

  <!-- Arrow -->
  <line x1="385" y1="100" x2="425" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="405" y="90" text-anchor="middle" font-size="9" fill="#94a3b8">fixed</text>

  <!-- Predictor -->
  <rect x="430" y="60" width="160" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="510" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Predictor</text>
  <text x="510" y="106" text-anchor="middle" font-size="10" fill="#16a34a">personality x emotion</text>
  <text x="510" y="120" text-anchor="middle" font-size="10" fill="#16a34a">pin or fall-through</text>

  <!-- Arrow -->
  <line x1="590" y1="100" x2="630" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Strategy -->
  <rect x="635" y="60" width="160" height="80" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="715" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="#7e22ce">Strategy</text>
  <text x="715" y="106" text-anchor="middle" font-size="10" fill="#9333ea">same answer every time</text>
  <text x="715" y="120" text-anchor="middle" font-size="10" fill="#9333ea">episode 1 = episode 50</text>

  <!-- Problem callout -->
  <rect x="540" y="155" width="260" height="32" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="670" y="176" text-anchor="middle" font-size="11" font-weight="500" fill="#dc2626">No feedback from outcomes</text>
</svg>
