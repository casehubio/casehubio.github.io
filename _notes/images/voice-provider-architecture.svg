<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13">
  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-weight="700" font-size="16" fill="#0f172a">Voice Provider Architecture — connectors owns the full stack</text>

  <!-- VoicePlatform SPI layer -->
  <rect x="140" y="50" width="540" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="75" text-anchor="middle" font-weight="700" fill="#1e40af" font-size="14">voice-spi</text>
  <text x="230" y="100" text-anchor="middle" fill="#1e40af" font-size="11">VoicePlatform</text>
  <text x="350" y="100" text-anchor="middle" fill="#1e40af" font-size="11">VoiceRegistry</text>
  <text x="490" y="100" text-anchor="middle" fill="#1e40af" font-size="11">RoutingVoicePlatformService</text>
  <text x="610" y="100" text-anchor="middle" fill="#1e40af" font-size="11">VoiceManifestLoader</text>

  <!-- Manifest config -->
  <rect x="700" y="55" width="110" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="755" y="78" text-anchor="middle" font-weight="600" fill="#166534" font-size="11">voice-config.yaml</text>
  <text x="755" y="95" text-anchor="middle" fill="#166534" font-size="10">priority chain</text>
  <text x="755" y="110" text-anchor="middle" fill="#166534" font-size="10">6 levels</text>
  <line x1="700" y1="90" x2="680" y2="90" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Provider modules row -->
  <text x="410" y="165" text-anchor="middle" font-weight="600" fill="#475569" font-size="13">Provider Modules (each ships META-INF/voice-catalog.yaml)</text>

  <!-- voice-kokoro -->
  <rect x="30" y="185" width="170" height="110" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="115" y="210" text-anchor="middle" font-weight="700" fill="#92400e" font-size="12">voice-kokoro</text>
  <text x="115" y="230" text-anchor="middle" fill="#92400e" font-size="10">KokoroVoicePlatform</text>
  <text x="115" y="248" text-anchor="middle" fill="#92400e" font-size="10">82M params, 26 voices</text>
  <text x="115" y="266" text-anchor="middle" fill="#92400e" font-size="10">int8: 88MB shared model</text>
  <text x="115" y="284" text-anchor="middle" fill="#78350f" font-size="9" font-style="italic">auto-download via Provisioner</text>
  <line x1="115" y1="185" x2="300" y2="130" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- voice-vits -->
  <rect x="220" y="185" width="150" height="110" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="295" y="210" text-anchor="middle" font-weight="700" fill="#92400e" font-size="12">voice-vits</text>
  <text x="295" y="230" text-anchor="middle" fill="#92400e" font-size="10">VitsVoicePlatform</text>
  <text x="295" y="248" text-anchor="middle" fill="#92400e" font-size="10">Piper VITS models</text>
  <text x="295" y="266" text-anchor="middle" fill="#92400e" font-size="10">lightweight, fast</text>
  <text x="295" y="284" text-anchor="middle" fill="#78350f" font-size="9" font-style="italic">auto-download via Provisioner</text>
  <line x1="295" y1="185" x2="350" y2="130" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- stt-whisper -->
  <rect x="390" y="185" width="150" height="110" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="465" y="210" text-anchor="middle" font-weight="700" fill="#3730a3" font-size="12">stt-whisper</text>
  <text x="465" y="230" text-anchor="middle" fill="#3730a3" font-size="10">WhisperVoicePlatform</text>
  <text x="465" y="248" text-anchor="middle" fill="#3730a3" font-size="10">Whisper.cpp STT</text>
  <text x="465" y="266" text-anchor="middle" fill="#3730a3" font-size="10">multiple model sizes</text>
  <text x="465" y="284" text-anchor="middle" fill="#312e81" font-size="9" font-style="italic">auto-download via Provisioner</text>
  <line x1="465" y1="185" x2="430" y2="130" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- voice-ref -->
  <rect x="560" y="185" width="140" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="630" y="210" text-anchor="middle" font-weight="700" fill="#166534" font-size="12">voice-ref</text>
  <text x="630" y="230" text-anchor="middle" fill="#166534" font-size="10">ReferenceVoicePlatform</text>
  <text x="630" y="248" text-anchor="middle" fill="#166534" font-size="10">canned STT</text>
  <text x="630" y="266" text-anchor="middle" fill="#166534" font-size="10">silent WAV TTS</text>
  <text x="630" y="284" text-anchor="middle" fill="#166534" font-size="9" font-style="italic">no download needed</text>
  <line x1="630" y1="185" x2="530" y2="130" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Provisioner box -->
  <rect x="30" y="330" width="510" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="285" y="355" text-anchor="middle" font-weight="700" fill="#9a3412" font-size="13">Provisioner (shared infrastructure)</text>
  <text x="130" y="378" text-anchor="middle" fill="#9a3412" font-size="10">SHA-256 verified download</text>
  <text x="285" y="378" text-anchor="middle" fill="#9a3412" font-size="10">~/.casehub/models/ cache</text>
  <text x="430" y="378" text-anchor="middle" fill="#9a3412" font-size="10">file locking + retry</text>
  <text x="285" y="398" text-anchor="middle" fill="#9a3412" font-size="10">casehub.speech.auto-download=true</text>

  <!-- Native libs -->
  <rect x="560" y="330" width="250" height="80" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="685" y="355" text-anchor="middle" font-weight="700" fill="#9d174d" font-size="13">Native Libs (per-platform JARs)</text>
  <text x="685" y="378" text-anchor="middle" fill="#9d174d" font-size="10">osx-arm64 · osx-x64 · linux-x64</text>
  <text x="685" y="398" text-anchor="middle" fill="#9d174d" font-size="10">linux-arm64 · win-x64</text>

  <!-- Consumers -->
  <rect x="140" y="445" width="540" height="55" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="410" y="468" text-anchor="middle" font-weight="600" fill="#334155" font-size="13">Consumers: agency, chat-app, any casehubio service</text>
  <text x="410" y="488" text-anchor="middle" fill="#64748b" font-size="11">inject VoicePlatform or RoutingVoicePlatformService — no speech-specific interfaces needed</text>
  <line x1="410" y1="445" x2="410" y2="410" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
