<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .layer-box { rx: 8; ry: 8; stroke-width: 2; }
      .layer-title { font-size: 13px; font-weight: 700; }
      .layer-desc { font-size: 11px; fill: #c9cdd5; }
      .layer-detail { font-size: 10px; fill: #8b8fa3; }
      .arrow { stroke: #6366f1; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .compose-label { font-size: 10px; fill: #6366f1; font-weight: 600; }
      .title { font-size: 15px; font-weight: 700; fill: #e4e6eb; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="700" height="320" fill="#0f1117" rx="8"/>

  <text x="350" y="30" text-anchor="middle" class="title">Three Composable Interaction Layers</text>

  <!-- Layer 1: Pill Filters -->
  <rect x="30" y="55" width="190" height="220" fill="#1a1d27" class="layer-box" stroke="#34d399"/>
  <text x="125" y="80" text-anchor="middle" class="layer-title" fill="#34d399">1. Pill Filters</text>
  <text x="125" y="100" text-anchor="middle" class="layer-desc">Region-level toggle</text>

  <rect x="50" y="115" width="150" height="28" fill="#232733" rx="14"/>
  <text x="125" y="133" text-anchor="middle" class="layer-detail" fill="#34d399">Social Cognition</text>

  <rect x="50" y="150" width="150" height="28" fill="#34d39920" rx="14" stroke="#34d399" stroke-width="1"/>
  <text x="125" y="168" text-anchor="middle" class="layer-detail" fill="#34d399">Planning &amp; Executive ✓</text>

  <rect x="50" y="185" width="150" height="28" fill="#232733" rx="14"/>
  <text x="125" y="203" text-anchor="middle" class="layer-detail" fill="#34d399">Episodic Memory</text>

  <text x="125" y="240" text-anchor="middle" class="layer-detail">Active → region brightens</text>
  <text x="125" y="255" text-anchor="middle" class="layer-detail">Inactive → region darkens</text>

  <!-- Layer 2: Node Click -->
  <rect x="255" y="55" width="190" height="220" fill="#1a1d27" class="layer-box" stroke="#facc15"/>
  <text x="350" y="80" text-anchor="middle" class="layer-title" fill="#facc15">2. Node Click</text>
  <text x="350" y="100" text-anchor="middle" class="layer-desc">Ego-neighborhood highlight</text>

  <!-- Mini graph showing highlighted node -->
  <circle cx="350" cy="150" r="10" fill="#facc15" opacity="0.9"/>
  <circle cx="310" cy="170" r="6" fill="#f472b6" opacity="0.7"/>
  <circle cx="390" cy="165" r="6" fill="#34d399" opacity="0.7"/>
  <circle cx="330" cy="130" r="6" fill="#60a5fa" opacity="0.7"/>
  <circle cx="380" cy="130" r="6" fill="#fb923c" opacity="0.7"/>
  <line x1="350" y1="150" x2="310" y2="170" stroke="#facc15" stroke-width="1.5" opacity="0.8"/>
  <line x1="350" y1="150" x2="390" y2="165" stroke="#facc15" stroke-width="1.5" opacity="0.8"/>
  <line x1="350" y1="150" x2="330" y2="130" stroke="#facc15" stroke-width="1.5" opacity="0.8"/>
  <line x1="350" y1="150" x2="380" y2="130" stroke="#facc15" stroke-width="1.5" opacity="0.8"/>
  <!-- Dimmed nodes -->
  <circle cx="290" cy="210" r="5" fill="#6b7280" opacity="0.2"/>
  <circle cx="410" cy="200" r="5" fill="#6b7280" opacity="0.2"/>
  <circle cx="370" cy="215" r="5" fill="#6b7280" opacity="0.2"/>

  <text x="350" y="240" text-anchor="middle" class="layer-detail">Clicked → bright + detail panel</text>
  <text x="350" y="255" text-anchor="middle" class="layer-detail">Neighbors → semi-bright</text>
  <text x="350" y="268" text-anchor="middle" class="layer-detail">Rest → dimmed</text>

  <!-- Layer 3: Ego Focus -->
  <rect x="480" y="55" width="190" height="220" fill="#1a1d27" class="layer-box" stroke="#6366f1"/>
  <text x="575" y="80" text-anchor="middle" class="layer-title" fill="#6366f1">3. Node Focus</text>
  <text x="575" y="100" text-anchor="middle" class="layer-desc">Ego-centric drill-down</text>

  <!-- Mini zoom animation -->
  <path d="M 540 130 C 540 120, 560 110, 575 115" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <path d="M 555 140 C 555 130, 570 120, 575 125" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.6"/>
  <circle cx="575" cy="150" r="14" fill="#6366f1" opacity="0.3"/>
  <circle cx="575" cy="150" r="8" fill="#6366f1" opacity="0.5"/>
  <circle cx="575" cy="150" r="4" fill="#6366f1" opacity="0.9"/>
  <text x="575" y="180" text-anchor="middle" class="layer-detail" fill="#c9cdd5">Camera zooms in</text>
  <text x="575" y="195" text-anchor="middle" class="layer-detail" fill="#c9cdd5">Brain fades out</text>
  <text x="575" y="210" text-anchor="middle" class="layer-detail" fill="#c9cdd5">Ego graph loads</text>

  <text x="575" y="240" text-anchor="middle" class="layer-detail">Right-click → "Focus"</text>
  <text x="575" y="255" text-anchor="middle" class="layer-detail">"← Brain" to return</text>

  <!-- Composition arrows -->
  <path class="arrow" d="M 225 165 L 250 165"/>
  <text x="237" y="155" text-anchor="middle" class="compose-label">+</text>

  <path class="arrow" d="M 450 165 L 475 165"/>
  <text x="462" y="155" text-anchor="middle" class="compose-label">→</text>

  <!-- Bottom note -->
  <text x="350" y="300" text-anchor="middle" class="layer-detail" fill="#8b8fa3">Layers 1+2 compose: filter regions, then click to see cross-region connections within the filter.</text>
  <text x="350" y="314" text-anchor="middle" class="layer-detail" fill="#8b8fa3">Layer 3 is a deliberate exit from the brain view into focused exploration.</text>
</svg>
