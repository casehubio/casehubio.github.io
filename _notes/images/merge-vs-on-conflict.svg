<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Concurrent Upsert: Three Approaches</text>

  <!-- Column headers -->
  <text x="130" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">UPDATE-then-INSERT</text>
  <text x="370" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">SQL MERGE</text>
  <text x="600" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">INSERT ON CONFLICT</text>

  <!-- Separators -->
  <line x1="245" y1="45" x2="245" y2="400" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="485" y1="45" x2="485" y2="400" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Column 1: UPDATE-then-INSERT -->
  <rect x="30" y="80" width="200" height="32" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="130" y="100" text-anchor="middle" font-size="11" fill="#334155">Thread A: UPDATE → 0 rows</text>

  <rect x="30" y="125" width="200" height="32" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="130" y="145" text-anchor="middle" font-size="11" fill="#334155">Thread B: UPDATE → 0 rows</text>

  <line x1="130" y1="157" x2="130" y2="175" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="30" y="180" width="200" height="32" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="130" y="200" text-anchor="middle" font-size="11" fill="#166534">Thread A: INSERT ✓</text>

  <rect x="30" y="225" width="200" height="32" rx="4" fill="#fecaca" stroke="#f87171"/>
  <text x="130" y="245" text-anchor="middle" font-size="11" fill="#991b1b">Thread B: INSERT ✗ (UK violation)</text>

  <rect x="30" y="285" width="200" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="130" y="305" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Race window: two statements</text>
  <text x="130" y="322" text-anchor="middle" font-size="11" fill="#92400e">Activation silently lost</text>

  <!-- Column 2: SQL MERGE -->
  <rect x="270" y="80" width="200" height="32" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="370" y="100" text-anchor="middle" font-size="11" fill="#334155">Thread A: MERGE (no row)</text>

  <rect x="270" y="125" width="200" height="32" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="370" y="145" text-anchor="middle" font-size="11" fill="#334155">Thread B: MERGE (no row)</text>

  <line x1="370" y1="157" x2="370" y2="175" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="270" y="180" width="200" height="32" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="370" y="200" text-anchor="middle" font-size="11" fill="#166534">Thread A: NOT MATCHED → INSERT ✓</text>

  <rect x="270" y="225" width="200" height="32" rx="4" fill="#fecaca" stroke="#f87171"/>
  <text x="370" y="245" text-anchor="middle" font-size="11" fill="#991b1b">Thread B: NOT MATCHED → INSERT ✗</text>

  <rect x="270" y="285" width="200" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="370" y="305" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Race window: single statement</text>
  <text x="370" y="322" text-anchor="middle" font-size="11" fill="#92400e">Same race for first activation</text>

  <!-- Column 3: INSERT ON CONFLICT -->
  <rect x="500" y="80" width="200" height="32" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="600" y="100" text-anchor="middle" font-size="11" fill="#334155">Thread A: INSERT (index lock)</text>

  <rect x="500" y="125" width="200" height="32" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="600" y="145" text-anchor="middle" font-size="11" fill="#334155">Thread B: INSERT (waits on lock)</text>

  <line x1="600" y1="157" x2="600" y2="175" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="500" y="180" width="200" height="32" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="600" y="200" text-anchor="middle" font-size="11" fill="#166534">Thread A: commits → weight = 1</text>

  <rect x="500" y="225" width="200" height="32" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="600" y="245" text-anchor="middle" font-size="11" fill="#166534">Thread B: ON CONFLICT → weight = 2</text>

  <rect x="500" y="285" width="200" height="50" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="600" y="305" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">No race: index-level lock</text>
  <text x="600" y="322" text-anchor="middle" font-size="11" fill="#166534">Zero lost activations</text>

  <!-- Footer -->
  <text x="360" y="370" text-anchor="middle" font-size="11" fill="#64748b">H2 (test): MERGE works atomically. PostgreSQL (production): only ON CONFLICT guarantees it.</text>
  <text x="360" y="390" text-anchor="middle" font-size="11" fill="#64748b">The MERGE closes the existing race; the ON CONFLICT closes the remaining one.</text>
</svg>
