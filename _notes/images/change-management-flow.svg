<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7dd3fc" />
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3fb950" />
    </marker>
  </defs>

  <rect width="720" height="200" rx="8" fill="#0f1117" />

  <!-- Phase boxes -->
  <rect x="30" y="50" width="180" height="60" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1" />
  <text x="120" y="73" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">Compliance Check</text>
  <text x="120" y="92" fill="#7dd3fc" font-size="10" text-anchor="middle">subCase → ops/compliance</text>
  <text x="120" y="103" fill="#6b7280" font-size="9" text-anchor="middle">waitForCompletion: true</text>

  <rect x="270" y="50" width="180" height="60" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1" />
  <text x="360" y="73" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">Approval Gate</text>
  <text x="360" y="92" fill="#7dd3fc" font-size="10" text-anchor="middle">subCase → ops/deploy-approval</text>
  <text x="360" y="103" fill="#6b7280" font-size="9" text-anchor="middle">when: compliance resolved</text>

  <rect x="510" y="50" width="180" height="60" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1" />
  <text x="600" y="73" fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">Drift Monitor</text>
  <text x="600" y="92" fill="#7dd3fc" font-size="10" text-anchor="middle">subCase → ops/drift</text>
  <text x="600" y="103" fill="#6b7280" font-size="9" text-anchor="middle">waitForCompletion: false</text>

  <!-- Arrows between phases -->
  <line x1="210" y1="80" x2="268" y2="80" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#arr)" />
  <line x1="450" y1="80" x2="508" y2="80" stroke="#7dd3fc" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Guard labels -->
  <text x="239" y="72" fill="#3fb950" font-size="9" text-anchor="middle">✓</text>
  <text x="479" y="72" fill="#3fb950" font-size="9" text-anchor="middle">✓</text>

  <!-- Title -->
  <text x="360" y="30" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">change-management.yaml — three-phase declarative orchestration</text>

  <!-- Guard explanation -->
  <text x="120" y="140" fill="#6b7280" font-size="10" text-anchor="middle">contextChange filter</text>
  <text x="360" y="140" fill="#6b7280" font-size="10" text-anchor="middle">when: guard</text>
  <text x="600" y="140" fill="#6b7280" font-size="10" text-anchor="middle">fire and forget</text>

  <!-- Bottom note -->
  <text x="360" y="175" fill="#8b949e" font-size="10" text-anchor="middle">Sequencing emerges from data conditions — the engine evaluates guards on every context change</text>
</svg>
