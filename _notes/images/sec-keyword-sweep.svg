<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#c0392b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">SEC Appraisal: Keyword Fallback vs LLM-Only</text>

  <!-- BEFORE section -->
  <text x="200" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">BEFORE: SchererAppraisalStrategy</text>

  <!-- Narrative input -->
  <rect x="30" y="80" width="140" height="40" rx="6" fill="#f0f0f0" stroke="#999"/>
  <text x="100" y="105" text-anchor="middle" font-size="11" fill="#333">Narrative text</text>

  <!-- Four keyword boxes -->
  <rect x="30" y="145" width="80" height="50" rx="4" fill="#fce4e4" stroke="#c0392b"/>
  <text x="70" y="166" text-anchor="middle" font-size="9" fill="#8b1a1a">Relevance</text>
  <text x="70" y="180" text-anchor="middle" font-size="8" fill="#999">keywords</text>

  <rect x="120" y="145" width="80" height="50" rx="4" fill="#fce4e4" stroke="#c0392b"/>
  <text x="160" y="166" text-anchor="middle" font-size="9" fill="#8b1a1a">Implication</text>
  <text x="160" y="180" text-anchor="middle" font-size="8" fill="#999">keywords</text>

  <rect x="210" y="145" width="80" height="50" rx="4" fill="#fce4e4" stroke="#c0392b"/>
  <text x="250" y="166" text-anchor="middle" font-size="9" fill="#8b1a1a">Coping</text>
  <text x="250" y="180" text-anchor="middle" font-size="8" fill="#999">keywords</text>

  <rect x="300" y="145" width="80" height="50" rx="4" fill="#fce4e4" stroke="#c0392b"/>
  <text x="340" y="166" text-anchor="middle" font-size="9" fill="#8b1a1a">Normative</text>
  <text x="340" y="180" text-anchor="middle" font-size="8" fill="#999">keywords</text>

  <!-- Arrows from narrative to checks -->
  <line x1="100" y1="120" x2="70" y2="145" stroke="#c0392b" stroke-width="1" marker-end="url(#arrow-red)"/>
  <line x1="100" y1="120" x2="160" y2="145" stroke="#c0392b" stroke-width="1" marker-end="url(#arrow-red)"/>
  <line x1="100" y1="120" x2="250" y2="145" stroke="#c0392b" stroke-width="1" marker-end="url(#arrow-red)"/>
  <line x1="100" y1="120" x2="340" y2="145" stroke="#c0392b" stroke-width="1" marker-end="url(#arrow-red)"/>

  <!-- False positive examples -->
  <rect x="30" y="215" width="350" height="75" rx="6" fill="#fff5f5" stroke="#e0c0c0" stroke-dasharray="4"/>
  <text x="45" y="235" font-size="10" fill="#8b1a1a" font-style="italic">False positives:</text>
  <text x="45" y="252" font-size="9" fill="#666">"can" matches candy, "won" matches wonder</text>
  <text x="45" y="266" font-size="9" fill="#666">"right" matches bright, "power" matches empowered</text>
  <text x="45" y="280" font-size="9" fill="#666">99 keywords across 4 checks, all substring matching</text>

  <!-- AFTER section -->
  <text x="600" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">AFTER: LlmAppraisalStrategy</text>

  <!-- Narrative input -->
  <rect x="530" y="80" width="140" height="40" rx="6" fill="#f0f0f0" stroke="#999"/>
  <text x="600" y="105" text-anchor="middle" font-size="11" fill="#333">Narrative text</text>

  <!-- Single LLM box -->
  <rect x="510" y="145" width="180" height="65" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="600" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">LLM Appraisal</text>
  <text x="600" y="185" text-anchor="middle" font-size="9" fill="#666">single call, 7 dimensions</text>
  <text x="600" y="198" text-anchor="middle" font-size="9" fill="#666">+ evocative narrative</text>

  <!-- Arrow -->
  <line x1="600" y1="120" x2="600" y2="145" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Dimension outputs -->
  <rect x="510" y="230" width="180" height="100" rx="6" fill="#f0faf0" stroke="#c0e0c0"/>
  <text x="520" y="248" font-size="9" fill="#1b5e20">relevance: 0.85</text>
  <text x="520" y="262" font-size="9" fill="#1b5e20">conduciveness: -0.6</text>
  <text x="520" y="276" font-size="9" fill="#1b5e20">controllability: 0.3</text>
  <text x="520" y="290" font-size="9" fill="#1b5e20">novelty: 0.7</text>
  <text x="520" y="304" font-size="9" fill="#1b5e20">urgency: 0.8</text>
  <text x="520" y="318" font-size="9" fill="#1b5e20">internal/external-standards</text>

  <line x1="600" y1="210" x2="600" y2="230" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Stats -->
  <rect x="510" y="350" width="180" height="55" rx="6" fill="#e8f5e9" stroke="#c0e0c0"/>
  <text x="600" y="370" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">-1,828 lines</text>
  <text x="600" y="387" text-anchor="middle" font-size="9" fill="#666">8 source + 11 test files deleted</text>
  <text x="600" y="400" text-anchor="middle" font-size="9" fill="#666">SessionPipeline now required</text>

  <!-- Big X over the keyword section -->
  <line x1="20" y1="70" x2="390" y2="300" stroke="#c0392b" stroke-width="3" opacity="0.3"/>
  <line x1="390" y1="70" x2="20" y2="300" stroke="#c0392b" stroke-width="3" opacity="0.3"/>
</svg>
