<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" fill="#fafafa" rx="8"/>

  <!-- Three source boxes -->
  <rect x="40" y="30" width="180" height="120" rx="6" fill="#f0f9ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Programmatic API</text>
  <text x="130" y="80" text-anchor="middle" font-size="11" fill="#475569">OrganizationalUnit</text>
  <text x="130" y="96" text-anchor="middle" font-size="11" fill="#475569">.builder()</text>
  <text x="130" y="112" text-anchor="middle" font-size="11" fill="#475569">.roleSpecs(...)</text>
  <text x="130" y="128" text-anchor="middle" font-size="11" fill="#475569">.policy(...).build()</text>

  <rect x="270" y="30" width="180" height="120" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="360" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">YAML</text>
  <text x="360" y="80" text-anchor="middle" font-size="11" fill="#475569">organization.yaml</text>
  <text x="360" y="96" text-anchor="middle" font-size="11" fill="#475569">roleSpecs:</text>
  <text x="360" y="112" text-anchor="middle" font-size="11" fill="#475569">  - roleName: lead</text>
  <text x="360" y="128" text-anchor="middle" font-size="11" fill="#475569">    maxCardinality: 1</text>

  <rect x="500" y="30" width="180" height="120" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="590" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#6b21a8">Annotations</text>
  <text x="590" y="80" text-anchor="middle" font-size="11" fill="#475569">@OrgUnit(</text>
  <text x="590" y="96" text-anchor="middle" font-size="11" fill="#475569">  roleSpecs = {</text>
  <text x="590" y="112" text-anchor="middle" font-size="11" fill="#475569">    @RoleSpecDef(...)</text>
  <text x="590" y="128" text-anchor="middle" font-size="11" fill="#475569">  })</text>

  <!-- Arrows converging -->
  <line x1="130" y1="150" x2="320" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="150" x2="360" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="150" x2="400" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Convergence: OrgRegistrar -->
  <rect x="270" y="210" width="180" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">OrgRegistrar SPI</text>
  <text x="360" y="248" text-anchor="middle" font-size="11" fill="#78350f">units + relationships</text>

  <!-- Arrow down -->
  <line x1="360" y1="260" x2="360" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Runtime -->
  <rect x="200" y="290" width="320" height="80" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="360" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">GroupLifecycleService</text>
  <text x="360" y="338" text-anchor="middle" font-size="11" fill="#475569">createGroup → joinGroup → adoptRole → activateGroup</text>
  <text x="360" y="354" text-anchor="middle" font-size="11" fill="#475569">validation · state machine · event listeners</text>
</svg>
