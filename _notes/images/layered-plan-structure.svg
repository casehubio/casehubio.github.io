<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="dep-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" rx="12" fill="url(#bg2)" stroke="#e2e8f0" stroke-width="1"/>

  <text x="300" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Layered Plan — List&lt;List&lt;OrderedStep&gt;&gt;</text>

  <!-- Layer 1 -->
  <rect x="40" y="55" width="520" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="60" y="75" font-size="11" font-weight="600" fill="#1e40af">Layer 1</text>
  <text x="135" y="75" font-size="10" fill="#3b82f6">(no dependencies — provision first)</text>
  <rect x="60" y="82" width="100" height="26" rx="6" fill="#3b82f6" stroke="none"/>
  <text x="110" y="99" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">manifest</text>

  <!-- Layer 2 -->
  <rect x="40" y="130" width="520" height="60" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="60" y="150" font-size="11" font-weight="600" fill="#166534">Layer 2</text>
  <text x="135" y="150" font-size="10" fill="#22c55e">(depends on layer 1)</text>
  <rect x="60" y="157" width="100" height="26" rx="6" fill="#22c55e" stroke="none"/>
  <text x="110" y="174" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">eidos</text>

  <!-- Dependency arrow 1→2 -->
  <line x1="110" y1="108" x2="110" y2="155" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dep-arrow)"/>

  <!-- Layer 3 -->
  <rect x="40" y="205" width="520" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="60" y="225" font-size="11" font-weight="600" fill="#92400e">Layer 3</text>
  <text x="135" y="225" font-size="10" fill="#f59e0b">(depends on layer 2 — parallel within layer)</text>
  <rect x="60" y="232" width="100" height="26" rx="6" fill="#f59e0b" stroke="none"/>
  <text x="110" y="249" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">engine</text>
  <rect x="180" y="232" width="100" height="26" rx="6" fill="#f59e0b" stroke="none"/>
  <text x="230" y="249" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">my-llm</text>

  <!-- Dependency arrows 2→3 -->
  <line x1="110" y1="183" x2="110" y2="230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dep-arrow)"/>
  <line x1="110" y1="183" x2="230" y2="230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dep-arrow)"/>

  <!-- Annotation -->
  <text x="380" y="100" font-size="10" fill="#64748b">Each layer is a List&lt;OrderedStep&gt;.</text>
  <text x="380" y="115" font-size="10" fill="#64748b">Steps within a layer are independent.</text>
  <text x="380" y="175" font-size="10" fill="#64748b">Layer N waits for Layer N-1</text>
  <text x="380" y="190" font-size="10" fill="#64748b">to complete before starting.</text>
  <text x="380" y="250" font-size="10" fill="#64748b">Terraform-style: "3 additions</text>
  <text x="380" y="265" font-size="10" fill="#64748b">in dependency order"</text>

  <!-- Footer -->
  <text x="300" y="300" text-anchor="middle" font-size="10" fill="#94a3b8">The plan preserves parallelism — layers are not flattened into a sequential list.</text>
</svg>
