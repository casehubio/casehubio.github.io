<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Joint Account Confirmation — Voice Pipeline</text>

  <!-- Phase 1: Register -->
  <rect x="30" y="55" width="195" height="130" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="127" y="75" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">1. REGISTER VOICES</text>
  <rect x="45" y="88" width="165" height="28" rx="4" fill="white" stroke="#93c5fd"/>
  <text x="127" y="107" text-anchor="middle" font-size="11" fill="#1e293b">TTS (af_heart) → sample</text>
  <rect x="45" y="122" width="165" height="28" rx="4" fill="white" stroke="#93c5fd"/>
  <text x="127" y="141" text-anchor="middle" font-size="11" fill="#1e293b">speaker register → Alice</text>
  <text x="127" y="172" text-anchor="middle" font-size="10" fill="#64748b">repeat for Bob (bm_daniel)</text>

  <!-- Phase 2: Confirm -->
  <rect x="245" y="55" width="195" height="130" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="342" y="75" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">2. RECEIVE CONFIRMATIONS</text>
  <rect x="260" y="88" width="165" height="28" rx="4" fill="white" stroke="#86efac"/>
  <text x="342" y="107" text-anchor="middle" font-size="11" fill="#1e293b">TTS (af_heart) → Alice msg</text>
  <rect x="260" y="122" width="165" height="28" rx="4" fill="white" stroke="#86efac"/>
  <text x="342" y="141" text-anchor="middle" font-size="11" fill="#1e293b">TTS (bm_daniel) → Bob msg</text>
  <text x="342" y="172" text-anchor="middle" font-size="10" fill="#64748b">distinct voices per speaker</text>

  <!-- Phase 3: Process -->
  <rect x="460" y="55" width="195" height="130" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
  <text x="557" y="75" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">3. PROCESS AUDIO</text>
  <rect x="475" y="88" width="165" height="28" rx="4" fill="white" stroke="#fcd34d"/>
  <text x="557" y="107" text-anchor="middle" font-size="11" fill="#1e293b">audio-denoise × 2</text>
  <rect x="475" y="122" width="165" height="28" rx="4" fill="white" stroke="#fcd34d"/>
  <text x="557" y="141" text-anchor="middle" font-size="11" fill="#1e293b">speaker identify × 2</text>
  <text x="557" y="172" text-anchor="middle" font-size="10" fill="#64748b">cosine similarity matching</text>

  <!-- Phase 4: Combine -->
  <rect x="675" y="55" width="195" height="130" rx="6" fill="#fce7f3" stroke="#fbcfe8" stroke-width="1.5"/>
  <text x="772" y="75" text-anchor="middle" font-size="11" font-weight="600" fill="#9d174d">4. COMBINE &amp; DELIVER</text>
  <rect x="690" y="88" width="165" height="28" rx="4" fill="white" stroke="#f9a8d4"/>
  <text x="772" y="107" text-anchor="middle" font-size="11" fill="#1e293b">audio join → WAV</text>
  <rect x="690" y="122" width="165" height="28" rx="4" fill="white" stroke="#f9a8d4"/>
  <text x="772" y="141" text-anchor="middle" font-size="11" fill="#1e293b">stt-transcribe → text</text>
  <rect x="690" y="156" width="165" height="22" rx="4" fill="white" stroke="#f9a8d4"/>
  <text x="772" y="172" text-anchor="middle" font-size="11" fill="#1e293b">chat-send + attachment</text>

  <!-- Arrows between phases -->
  <line x1="225" y1="120" x2="245" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="120" x2="460" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="655" y1="120" x2="675" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SPI Layer -->
  <rect x="30" y="210" width="840" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">SPI Layer — @Plugin Records</text>

  <rect x="50" y="242" width="120" height="40" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="110" y="258" text-anchor="middle" font-size="10" font-weight="500" fill="#1e40af">tts-synthesise</text>
  <text x="110" y="272" text-anchor="middle" font-size="9" fill="#64748b">streaming=true</text>

  <rect x="185" y="242" width="120" height="40" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="245" y="258" text-anchor="middle" font-size="10" font-weight="500" fill="#1e40af">stt-transcribe</text>
  <text x="245" y="272" text-anchor="middle" font-size="9" fill="#64748b">streaming=true</text>

  <rect x="320" y="242" width="120" height="40" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="380" y="258" text-anchor="middle" font-size="10" font-weight="500" fill="#166534">audio-denoise</text>
  <text x="380" y="272" text-anchor="middle" font-size="9" fill="#64748b">SpeechDenoiser</text>

  <rect x="455" y="242" width="120" height="40" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="515" y="258" text-anchor="middle" font-size="10" font-weight="500" fill="#166534">audio join/trim</text>
  <text x="515" y="272" text-anchor="middle" font-size="9" fill="#64748b">javax.sound</text>

  <rect x="590" y="242" width="120" height="40" rx="4" fill="#fef9c3" stroke="#fde047"/>
  <text x="650" y="258" text-anchor="middle" font-size="10" font-weight="500" fill="#854d0e">speaker</text>
  <text x="650" y="272" text-anchor="middle" font-size="9" fill="#64748b">register/identify</text>

  <rect x="725" y="242" width="120" height="40" rx="4" fill="#fce7f3" stroke="#f9a8d4"/>
  <text x="785" y="258" text-anchor="middle" font-size="10" font-weight="500" fill="#9d174d">chat-send</text>
  <text x="785" y="272" text-anchor="middle" font-size="9" fill="#64748b">+ attachment byte[]</text>

  <!-- Discovery Layer -->
  <rect x="30" y="320" width="840" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="450" y="342" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Discovery — Zero Configuration</text>

  <text x="170" y="365" text-anchor="middle" font-size="11" fill="#334155">META-INF/yaml-plugins/*.json</text>
  <text x="170" y="375" text-anchor="middle" font-size="9" fill="#94a3b8">APT-generated at compile time</text>

  <text x="450" y="365" text-anchor="middle" font-size="11" fill="#334155">META-INF/yaml-services.yaml</text>
  <text x="450" y="375" text-anchor="middle" font-size="9" fill="#94a3b8">per ref module, classpath merged</text>

  <text x="730" y="365" text-anchor="middle" font-size="11" fill="#334155">src/test/playbooks/**/*.test.yaml</text>
  <text x="730" y="375" text-anchor="middle" font-size="9" fill="#94a3b8">directory scan by engine</text>

  <!-- Implementations -->
  <rect x="30" y="405" width="405" height="100" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="232" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">Reference Implementations (test/demo)</text>
  <text x="232" y="448" text-anchor="middle" font-size="11" fill="#334155">ReferenceVoicePlatform — WAV-wrapped text round-trip</text>
  <text x="232" y="465" text-anchor="middle" font-size="11" fill="#334155">RefSpeakerRegistry — cosine similarity on hash vectors</text>
  <text x="232" y="482" text-anchor="middle" font-size="11" fill="#334155">RefSpeechDenoiser — passthrough</text>
  <text x="232" y="499" text-anchor="middle" font-size="10" fill="#64748b">Same YAML playbooks, lightweight backends</text>

  <rect x="465" y="405" width="405" height="100" rx="6" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
  <text x="667" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="#854d0e">Production Implementations (speech-sherpa)</text>
  <text x="667" y="448" text-anchor="middle" font-size="11" fill="#334155">Kokoro TTS — multi-voice neural synthesis</text>
  <text x="667" y="465" text-anchor="middle" font-size="11" fill="#334155">Whisper STT — local transcription via ONNX</text>
  <text x="667" y="482" text-anchor="middle" font-size="11" fill="#334155">CAM++ — real speaker embeddings</text>
  <text x="667" y="499" text-anchor="middle" font-size="10" fill="#64748b">Same YAML playbooks, real models</text>

  <!-- Swap arrow -->
  <line x1="435" y1="440" x2="435" y2="480" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="450" y="462" font-size="10" fill="#3b82f6" font-weight="500">swap</text>
  <text x="450" y="474" font-size="9" fill="#3b82f6">yaml-services</text>
</svg>
