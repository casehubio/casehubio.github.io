<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">charOffset Clamping — Before and After</text>

  <!-- === TOP HALF: UNCLAMPED === -->
  <text x="40" y="58" font-size="12" font-weight="600" fill="#dc2626">Without clamp</text>

  <!-- Text ruler -->
  <rect x="60" y="68" width="330" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="75" y="86" font-size="11" fill="#334155" font-family="monospace">h e l l o   w o r l d</text>
  <!-- Position markers -->
  <text x="60" y="110" font-size="9" fill="#6b7280">0</text>
  <text x="385" y="110" font-size="9" fill="#6b7280">11</text>

  <!-- Mark at 20 (way past the end) -->
  <line x1="508" y1="96" x2="508" y2="72" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="508" y="112" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="600">charOffset=20</text>

  <!-- Audio timeline - unclamped -->
  <text x="60" y="140" font-size="10" fill="#6b7280">audio</text>
  <rect x="100" y="130" width="220" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="100" y="158" font-size="9" fill="#6b7280">0ms</text>
  <text x="310" y="158" font-size="9" fill="#6b7280">550ms</text>

  <!-- Result mark exceeding duration -->
  <rect x="100" y="130" width="400" height="16" rx="3" fill="none" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="500" y1="145" x2="500" y2="130" stroke="#dc2626" stroke-width="2"/>
  <circle cx="500" cy="128" r="3" fill="#dc2626"/>
  <text x="500" y="158" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="600">1000ms</text>
  <text x="500" y="170" text-anchor="middle" font-size="9" fill="#dc2626">past end of audio</text>

  <!-- fraction label -->
  <text x="440" y="86" font-size="10" fill="#dc2626">20 / 11 = 1.82</text>

  <!-- === BOTTOM HALF: CLAMPED === -->
  <text x="40" y="208" font-size="12" font-weight="600" fill="#059669">With clamp</text>

  <!-- Text ruler -->
  <rect x="60" y="218" width="330" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="75" y="236" font-size="11" fill="#334155" font-family="monospace">h e l l o   w o r l d</text>
  <text x="60" y="260" font-size="9" fill="#6b7280">0</text>
  <text x="385" y="260" font-size="9" fill="#6b7280">11</text>

  <!-- Original mark at 20 -->
  <line x1="508" y1="250" x2="508" y2="234" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="508" y="264" text-anchor="middle" font-size="9" fill="#94a3b8">20</text>

  <!-- Clamp arrow pulling back to 11 -->
  <line x1="496" y1="232" x2="400" y2="232" stroke="#059669" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="448" y="226" text-anchor="middle" font-size="9" fill="#059669" font-weight="600">clamp</text>

  <!-- Clamped mark at 11 -->
  <line x1="390" y1="248" x2="390" y2="224" stroke="#059669" stroke-width="2"/>
  <circle cx="390" cy="222" r="3" fill="#059669"/>

  <!-- Audio timeline - clamped -->
  <text x="60" y="290" font-size="10" fill="#6b7280">audio</text>
  <rect x="100" y="280" width="220" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="100" y="308" font-size="9" fill="#6b7280">0ms</text>
  <text x="310" y="308" font-size="9" fill="#6b7280">550ms</text>

  <!-- Result mark at duration boundary -->
  <line x1="320" y1="296" x2="320" y2="280" stroke="#059669" stroke-width="2"/>
  <circle cx="320" cy="278" r="3" fill="#059669"/>
  <text x="320" y="308" text-anchor="middle" font-size="9" fill="#059669" font-weight="600">550ms</text>

  <!-- fraction label -->
  <text x="440" y="236" font-size="10" fill="#059669">min(20, 11) / 11 = 1.0</text>
</svg>
