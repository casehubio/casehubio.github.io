<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      text { font-family: -apple-system, 'Segoe UI', sans-serif; fill: #333; }
      .ev { rx: 4; stroke-width: 1.2; }
      .alice { fill: #dbeafe; stroke: #3b82f6; }
      .bob { fill: #dcfce7; stroke: #22c55e; }
      .sys { fill: #f3f4f6; stroke: #9ca3af; }
      .warn-bg { fill: #fef3c7; stroke: #f59e0b; rx: 4; stroke-width: 1.2; }
      .sender { font-size: 11px; font-weight: 600; }
      .type { font-size: 10px; fill: #666; }
      .count { font-size: 12px; font-weight: 700; }
      .count-ok { fill: #16a34a; }
      .count-warn { fill: #dc2626; }
      .label { font-size: 11px; fill: #666; }
      .title { font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <text class="title" x="350" y="20" text-anchor="middle">contribution-required — consecutive sender tracking (maxConsecutive = 3)</text>

  <!-- Event boxes -->
  <rect class="ev alice" x="20" y="40" width="75" height="45"/>
  <text class="sender" x="57" y="56" text-anchor="middle">alice</text>
  <text class="type" x="57" y="72" text-anchor="middle">INFORM</text>

  <rect class="ev alice" x="110" y="40" width="75" height="45"/>
  <text class="sender" x="147" y="56" text-anchor="middle">alice</text>
  <text class="type" x="147" y="72" text-anchor="middle">QUERY</text>

  <rect class="ev alice" x="200" y="40" width="75" height="45"/>
  <text class="sender" x="237" y="56" text-anchor="middle">alice</text>
  <text class="type" x="237" y="72" text-anchor="middle">INFORM</text>

  <rect class="ev sys" x="290" y="40" width="75" height="45"/>
  <text class="sender" x="327" y="56" text-anchor="middle">system</text>
  <text class="type" x="327" y="72" text-anchor="middle">EVENT</text>

  <rect class="ev alice" x="380" y="40" width="75" height="45"/>
  <text class="sender" x="417" y="56" text-anchor="middle">alice</text>
  <text class="type" x="417" y="72" text-anchor="middle">INFORM</text>

  <rect class="ev bob" x="470" y="40" width="75" height="45"/>
  <text class="sender" x="507" y="56" text-anchor="middle">bob</text>
  <text class="type" x="507" y="72" text-anchor="middle">RESPONSE</text>

  <rect class="ev alice" x="560" y="40" width="75" height="45"/>
  <text class="sender" x="597" y="56" text-anchor="middle">alice</text>
  <text class="type" x="597" y="72" text-anchor="middle">INFORM</text>

  <!-- Consecutive counts -->
  <text class="count count-ok" x="57" y="110" text-anchor="middle">1</text>
  <text class="count count-ok" x="147" y="110" text-anchor="middle">2</text>
  <text class="count count-warn" x="237" y="110" text-anchor="middle">3</text>
  <text class="label" x="327" y="110" text-anchor="middle">skip</text>
  <text class="count count-warn" x="417" y="110" text-anchor="middle">4</text>
  <text class="count count-ok" x="507" y="110" text-anchor="middle">1</text>
  <text class="count count-ok" x="597" y="110" text-anchor="middle">1</text>

  <!-- Warning markers -->
  <rect class="warn-bg" x="207" y="122" width="60" height="22"/>
  <text x="237" y="137" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">WARNING</text>

  <rect class="warn-bg" x="387" y="122" width="60" height="22"/>
  <text x="417" y="137" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">WARNING</text>

  <!-- Reset arrow -->
  <line x1="507" y1="118" x2="507" y2="130" stroke="#22c55e" stroke-width="1.5"/>
  <text x="507" y="150" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="600">reset</text>

  <!-- Legend -->
  <text class="label" x="350" y="180" text-anchor="middle">consecutive count per sender — EVENT skipped, sender change resets to 1</text>
</svg>
