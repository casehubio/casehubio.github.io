<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, sans-serif; }
      .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
      .label { font-size: 11px; fill: #555; }
      .score-label { font-size: 10px; fill: #333; font-weight: 500; }
      .threshold-label { font-size: 11px; font-weight: 600; }
      .note { font-size: 10px; fill: #777; font-style: italic; }
      .bar-c { fill: #4a7c59; }
      .bar-a { fill: #a0a0a0; }
      .bar-gap { fill: #e8e8e8; }
      .threshold-line { stroke-dasharray: 6,4; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" class="title">Tension Score Distribution vs Routing Thresholds</text>

  <!-- Y axis -->
  <line x1="100" y1="50" x2="100" y2="340" stroke="#ccc" stroke-width="1"/>
  <text x="20" y="200" text-anchor="middle" class="label" transform="rotate(-90,20,200)">Tension Score</text>

  <!-- Y axis ticks -->
  <text x="90" y="340" text-anchor="end" class="score-label">0.0</text>
  <line x1="95" y1="337" x2="100" y2="337" stroke="#ccc"/>
  <text x="90" y="253" text-anchor="end" class="score-label">0.3</text>
  <line x1="95" y1="250" x2="100" y2="250" stroke="#ccc"/>
  <text x="90" y="195" text-anchor="end" class="score-label">0.5</text>
  <line x1="95" y1="192" x2="100" y2="192" stroke="#ccc"/>
  <text x="90" y="137" text-anchor="end" class="score-label">0.7</text>
  <line x1="95" y1="134" x2="100" y2="134" stroke="#ccc"/>
  <text x="90" y="54" text-anchor="end" class="score-label">1.0</text>
  <line x1="95" y1="50" x2="100" y2="50" stroke="#ccc"/>

  <!-- Gap region: 0.0 to 0.6 -->
  <rect x="100" y="223" width="600" height="114" class="bar-gap" opacity="0.5"/>
  <text x="400" y="285" text-anchor="middle" class="note">no scores in this range — table is binary</text>

  <!-- Threshold lines -->
  <line x1="100" y1="250" x2="700" y2="250" stroke="#d4a017" class="threshold-line"/>
  <text x="705" y="254" class="threshold-label" fill="#d4a017">T=0.3</text>

  <line x1="100" y1="192" x2="700" y2="192" stroke="#2e86ab" class="threshold-line"/>
  <text x="705" y="196" class="threshold-label" fill="#2e86ab">T=0.5</text>

  <line x1="100" y1="134" x2="700" y2="134" stroke="#c1440e" class="threshold-line"/>
  <text x="705" y="138" class="threshold-label" fill="#c1440e">T=0.7</text>

  <!-- Bars for each tension entry -->
  <!-- bold+strict: 1.0 -->
  <rect x="120" y="50" width="70" height="287" class="bar-c" rx="3"/>
  <text x="155" y="365" text-anchor="middle" class="score-label">bold</text>
  <text x="155" y="377" text-anchor="middle" class="score-label">+strict</text>
  <text x="155" y="44" text-anchor="middle" class="score-label">1.0</text>

  <!-- high autonomy+avoidant: 0.9 -->
  <rect x="210" y="79" width="70" height="258" class="bar-c" rx="3"/>
  <text x="245" y="365" text-anchor="middle" class="score-label">autonomy</text>
  <text x="245" y="377" text-anchor="middle" class="score-label">+avoidant</text>
  <text x="245" y="73" text-anchor="middle" class="score-label">0.9</text>

  <!-- cooperative+high autonomy: 0.8 -->
  <rect x="300" y="108" width="70" height="229" class="bar-c" rx="3"/>
  <text x="335" y="365" text-anchor="middle" class="score-label">coop</text>
  <text x="335" y="377" text-anchor="middle" class="score-label">+autonomy</text>
  <text x="335" y="102" text-anchor="middle" class="score-label">0.8</text>

  <!-- bold+avoidant: 0.7 -->
  <rect x="390" y="134" width="70" height="203" class="bar-c" rx="3"/>
  <text x="425" y="365" text-anchor="middle" class="score-label">bold</text>
  <text x="425" y="377" text-anchor="middle" class="score-label">+avoidant</text>
  <text x="425" y="128" text-anchor="middle" class="score-label">0.7</text>

  <!-- independent+low: 0.7 -->
  <rect x="480" y="134" width="70" height="203" class="bar-c" rx="3"/>
  <text x="515" y="365" text-anchor="middle" class="score-label">indep</text>
  <text x="515" y="377" text-anchor="middle" class="score-label">+low auton</text>
  <text x="515" y="128" text-anchor="middle" class="score-label">0.7</text>

  <!-- competitive+strict: 0.6 -->
  <rect x="570" y="163" width="70" height="174" class="bar-c" rx="3"/>
  <text x="605" y="365" text-anchor="middle" class="score-label">compet</text>
  <text x="605" y="377" text-anchor="middle" class="score-label">+strict</text>
  <text x="605" y="157" text-anchor="middle" class="score-label">0.6</text>

  <!-- Legend -->
  <rect x="120" y="392" width="12" height="8" class="bar-c" rx="1"/>
  <text x="138" y="399" class="score-label">Path C (personality system prompt)</text>
  <rect x="340" y="392" width="12" height="8" class="bar-gap" rx="1" stroke="#ccc" stroke-width="0.5"/>
  <text x="358" y="399" class="score-label">Empty score range</text>
</svg>
