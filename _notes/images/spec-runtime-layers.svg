<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="specGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f0fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d2e3fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="runtimeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fce8e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8d0cc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Spec Layer -->
  <rect x="40" y="20" width="640" height="170" rx="12" fill="url(#specGrad)" stroke="#4285f4" stroke-width="2"/>
  <text x="60" y="50" font-size="15" font-weight="bold" fill="#1a73e8">Spec Layer — OrganizationalUnit (immutable)</text>
  <text x="60" y="75" font-size="13" fill="#3c4043">The org diagram. What the structure should look like.</text>

  <rect x="70" y="95" width="140" height="40" rx="6" fill="#fff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="95" y="120" font-size="12" fill="#1a73e8">RoleSpec</text>

  <rect x="230" y="95" width="140" height="40" rx="6" fill="#fff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="252" y="120" font-size="12" fill="#1a73e8">MissionSpec</text>

  <rect x="390" y="95" width="140" height="40" rx="6" fill="#fff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="412" y="120" font-size="12" fill="#1a73e8">GroupPolicy</text>

  <rect x="70" y="145" width="140" height="30" rx="6" fill="#fff" stroke="#4285f4" stroke-width="1"/>
  <text x="90" y="165" font-size="11" fill="#5f6368">cardinality</text>

  <rect x="230" y="145" width="140" height="30" rx="6" fill="#fff" stroke="#4285f4" stroke-width="1"/>
  <text x="255" y="165" font-size="11" fill="#5f6368">goal bundles</text>

  <rect x="390" y="145" width="140" height="30" rx="6" fill="#fff" stroke="#4285f4" stroke-width="1"/>
  <text x="405" y="165" font-size="11" fill="#5f6368">formation rules</text>

  <rect x="550" y="95" width="115" height="80" rx="6" fill="#fff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="565" y="118" font-size="12" fill="#1a73e8">Topology</text>
  <text x="565" y="138" font-size="11" fill="#5f6368">Authority</text>
  <text x="565" y="158" font-size="11" fill="#5f6368">Self-det.</text>

  <!-- Arrow -->
  <path d="M 360 195 L 360 235" stroke="#5f6368" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="370" y="220" font-size="11" fill="#5f6368" font-style="italic">reconciliation</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <!-- Runtime Layer -->
  <rect x="40" y="240" width="640" height="180" rx="12" fill="url(#runtimeGrad)" stroke="#ea4335" stroke-width="2"/>
  <text x="60" y="270" font-size="15" font-weight="bold" fill="#c5221f">Runtime Layer — GroupInstance (mutable state)</text>
  <text x="60" y="295" font-size="13" fill="#3c4043">The live group. Who is actually here and what they're doing.</text>

  <rect x="70" y="310" width="160" height="40" rx="6" fill="#fff" stroke="#ea4335" stroke-width="1.5"/>
  <text x="82" y="335" font-size="12" fill="#c5221f">ActualMembership</text>

  <rect x="250" y="310" width="140" height="40" rx="6" fill="#fff" stroke="#ea4335" stroke-width="1.5"/>
  <text x="272" y="335" font-size="12" fill="#c5221f">RoleAdoption</text>

  <rect x="410" y="310" width="160" height="40" rx="6" fill="#fff" stroke="#ea4335" stroke-width="1.5"/>
  <text x="418" y="335" font-size="12" fill="#c5221f">MissionCommitment</text>

  <rect x="70" y="360" width="160" height="45" rx="6" fill="#fff" stroke="#ea4335" stroke-width="1"/>
  <text x="80" y="378" font-size="11" fill="#5f6368">Lifecycle state</text>
  <text x="80" y="394" font-size="10" fill="#888">PROPOSED → ACTIVE → DISSOLVED</text>

  <rect x="250" y="360" width="320" height="45" rx="6" fill="#fff" stroke="#ea4335" stroke-width="1"/>
  <text x="262" y="378" font-size="11" fill="#5f6368">Constraint enforcement at runtime</text>
  <text x="262" y="394" font-size="10" fill="#888">cardinality · incompatibility · membership invariant</text>
</svg>
