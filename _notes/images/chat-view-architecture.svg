<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Inter, system-ui, sans-serif">
  <!-- Background -->
  <rect width="800" height="360" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="400" y="30" fill="#e0e0e0" font-size="14" font-weight="600" text-anchor="middle">Two Modes, Same Backend</text>

  <!-- Terminal-first mode (left) -->
  <rect x="20" y="50" width="370" height="280" fill="#16213e" rx="6" stroke="#334155" stroke-width="1"/>
  <text x="205" y="72" fill="#4ec9b0" font-size="12" font-weight="600" text-anchor="middle">TERMINAL-FIRST (workbench)</text>

  <!-- Terminal area -->
  <rect x="30" y="85" width="250" height="235" fill="#0d1117" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="155" y="105" fill="#7ee787" font-size="10" font-weight="500" text-anchor="middle" font-family="monospace">$ claude</text>
  <text x="40" y="125" fill="#8b949e" font-size="9" font-family="monospace">⚡ Session active</text>
  <text x="40" y="140" fill="#8b949e" font-size="9" font-family="monospace">Working on issue-288...</text>
  <text x="40" y="165" fill="#58a6ff" font-size="9" font-family="monospace">human&gt; fix the layout</text>
  <text x="40" y="180" fill="#c9d1d9" font-size="9" font-family="monospace">Reading channel-feed.ts...</text>

  <!-- Channel sidebar (narrow) -->
  <rect x="290" y="85" width="90" height="235" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="335" y="105" fill="#8b949e" font-size="9" text-anchor="middle">Channels</text>
  <rect x="298" y="115" width="74" height="18" fill="#1f2937" rx="3"/>
  <text x="335" y="128" fill="#4ec9b0" font-size="8" text-anchor="middle"># work</text>
  <rect x="298" y="138" width="74" height="18" fill="#1f2937" rx="3"/>
  <text x="335" y="151" fill="#8b949e" font-size="8" text-anchor="middle"># observe</text>
  <text x="335" y="190" fill="#6e7681" font-size="8" text-anchor="middle" font-style="italic">360px</text>

  <!-- Arrow between modes -->
  <text x="400" y="200" fill="#6e7681" font-size="22" text-anchor="middle" font-weight="300">⟷</text>

  <!-- Conversation-first mode (right) -->
  <rect x="410" y="50" width="370" height="280" fill="#16213e" rx="6" stroke="#334155" stroke-width="1"/>
  <text x="595" y="72" fill="#007acc" font-size="12" font-weight="600" text-anchor="middle">CONVERSATION-FIRST (chat view)</text>

  <!-- Channel nav (left panel) -->
  <rect x="420" y="85" width="100" height="235" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="470" y="105" fill="#8b949e" font-size="9" text-anchor="middle">Channels</text>
  <rect x="428" y="115" width="84" height="20" fill="#1c3a5f" rx="3" stroke="#007acc" stroke-width="1"/>
  <text x="470" y="129" fill="#58a6ff" font-size="9" text-anchor="middle"># general</text>
  <rect x="428" y="140" width="84" height="20" fill="#1f2937" rx="3"/>
  <text x="470" y="154" fill="#8b949e" font-size="9" text-anchor="middle"># engineering</text>
  <rect x="428" y="165" width="84" height="20" fill="#1f2937" rx="3"/>
  <text x="470" y="179" fill="#8b949e" font-size="9" text-anchor="middle"># standup</text>
  <text x="470" y="220" fill="#6e7681" font-size="8" text-anchor="middle" font-style="italic">full height</text>

  <!-- Feed (centre panel - wide) -->
  <rect x="525" y="85" width="170" height="235" fill="#0d1117" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="610" y="105" fill="#8b949e" font-size="9" text-anchor="middle">Feed</text>
  <!-- Message bubbles -->
  <rect x="535" y="115" width="150" height="35" fill="#161b22" rx="4"/>
  <text x="545" y="130" fill="#4ec9b0" font-size="8" font-weight="600">mark</text>
  <text x="545" y="143" fill="#c9d1d9" font-size="8">Landed chat view, fixed...</text>
  <rect x="535" y="158" width="150" height="35" fill="#161b22" rx="4"/>
  <text x="545" y="173" fill="#58a6ff" font-size="8" font-weight="600">alex</text>
  <text x="545" y="186" fill="#c9d1d9" font-size="8">Code review on auth...</text>
  <!-- Input bar -->
  <rect x="535" y="290" width="150" height="22" fill="#1f2937" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="545" y="305" fill="#6e7681" font-size="8">Type a message...</text>

  <!-- Context dock (right panel) -->
  <rect x="700" y="85" width="70" height="235" fill="#161b22" rx="4" stroke="#30363d" stroke-width="1"/>
  <text x="735" y="105" fill="#8b949e" font-size="8" text-anchor="middle">Members</text>
  <text x="735" y="125" fill="#8b949e" font-size="8" text-anchor="middle">Tasks</text>
  <text x="735" y="145" fill="#8b949e" font-size="8" text-anchor="middle">Artifacts</text>

  <!-- Labels -->
  <text x="155" y="345" fill="#6e7681" font-size="10" text-anchor="middle">terminal dominates viewport</text>
  <text x="595" y="345" fill="#6e7681" font-size="10" text-anchor="middle">conversation dominates viewport</text>
</svg>
