<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="system-ui, sans-serif">
  <style>
    .bg { fill: #1a1a2e; }
    .card { fill: #252538; stroke: #3a3a52; stroke-width: 1; rx: 8; }
    .header { fill: #93c5fd; font-size: 13px; font-weight: 600; }
    .row { fill: #c0c0d0; font-size: 12px; }
    .arrow { fill: #6b7280; font-size: 14px; }
    .dim { fill: #6b7280; font-size: 11px; }
    .accent { fill: #3b82f6; }
    .danger { fill: #ef4444; }
    .label { fill: #93c5fd; font-size: 14px; font-weight: 600; }
    .question { fill: #f59e0b; font-size: 13px; font-style: italic; }
  </style>

  <rect class="bg" width="720" height="280"/>

  <!-- Table view -->
  <rect class="card" x="20" y="20" width="300" height="200"/>
  <text class="label" x="170" y="15" text-anchor="middle">Table View</text>
  <text class="header" x="40" y="50">SUPERVISES</text>
  <text class="row" x="40" y="78">Boot</text>
  <text class="arrow" x="120" y="78">→</text>
  <text class="row" x="150" y="78">Deacon</text>
  <text class="row" x="40" y="102">Deacon</text>
  <text class="arrow" x="120" y="102">→</text>
  <text class="row" x="150" y="102">Witness Alpha</text>
  <text class="row" x="40" y="126">Deacon</text>
  <text class="arrow" x="120" y="126">→</text>
  <text class="row" x="150" y="126">Witness Beta</text>
  <text class="row" x="40" y="150">Witness Alpha</text>
  <text class="arrow" x="168" y="150">→</text>
  <text class="row" x="198" y="150">Polecat 1</text>
  <text class="row" x="40" y="174">Witness Alpha</text>
  <text class="arrow" x="168" y="174">→</text>
  <text class="row" x="198" y="174">Polecat 2</text>
  <text class="row" x="40" y="198">Witness Beta</text>
  <text class="arrow" x="155" y="198">→</text>
  <text class="row" x="185" y="198">Polecat 3</text>

  <!-- Gap indicator -->
  <text class="question" x="360" y="130" text-anchor="middle">Each row is isolated.</text>
  <text class="question" x="360" y="150" text-anchor="middle">Where's the chain?</text>

  <!-- Chain view -->
  <rect class="card" x="400" y="20" width="300" height="200"/>
  <text class="label" x="550" y="15" text-anchor="middle">Chain View</text>
  <text class="row" x="420" y="50">▾ Boot</text>
  <text class="row" x="444" y="74">▾ Deacon</text>
  <text class="row" x="468" y="98">▾ Witness Alpha</text>
  <text class="row" x="492" y="122">Polecat 1</text>
  <text class="row" x="492" y="146">Polecat 2</text>
  <text class="row" x="468" y="170">▾ Witness Beta</text>
  <text class="row" x="492" y="194">Polecat 3</text>

  <!-- Connecting line showing hierarchy -->
  <line x1="435" y1="54" x2="435" y2="170" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="459" y1="78" x2="459" y2="170" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="483" y1="102" x2="483" y2="146" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <text class="dim" x="360" y="260" text-anchor="middle">The table shows edges. The chain shows structure.</text>
</svg>
