<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="680" height="340" fill="#fafafa" rx="4"/>

  <!-- Eidos layer -->
  <rect x="20" y="20" width="640" height="90" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="40" y="42" font-weight="bold" fill="#1565c0" font-size="13">eidos-api — identity boundary</text>

  <rect x="40" y="52" width="170" height="44" rx="4" fill="#bbdefb" stroke="#1976d2" stroke-width="1"/>
  <text x="125" y="78" text-anchor="middle" fill="#0d47a1" font-size="11">AgentRegistry</text>

  <rect x="230" y="52" width="170" height="44" rx="4" fill="#bbdefb" stroke="#1976d2" stroke-width="1"/>
  <text x="315" y="72" text-anchor="middle" fill="#0d47a1" font-size="11">findEffective()</text>
  <text x="315" y="86" text-anchor="middle" fill="#64b5f6" font-size="10">→ composed disposition</text>

  <rect x="420" y="52" width="220" height="44" rx="4" fill="#bbdefb" stroke="#1976d2" stroke-width="1"/>
  <text x="530" y="72" text-anchor="middle" fill="#0d47a1" font-size="11">LivedDispositionSource SPI</text>
  <text x="530" y="86" text-anchor="middle" fill="#64b5f6" font-size="10">resolveEffective()</text>

  <!-- Arrow from findEffective to SPI -->
  <line x1="400" y1="74" x2="418" y2="74" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- cognitive-eidos bridge -->
  <rect x="20" y="130" width="640" height="80" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.2"/>
  <text x="40" y="152" font-weight="bold" fill="#7b1fa2" font-size="13">cognitive-eidos — bridge module</text>

  <rect x="40" y="162" width="280" height="38" rx="4" fill="#e1bee7" stroke="#8e24aa" stroke-width="1"/>
  <text x="180" y="178" text-anchor="middle" fill="#4a148c" font-size="11">EidosLivedDispositionSource</text>
  <text x="180" y="192" text-anchor="middle" fill="#9c27b0" font-size="10">implements LivedDispositionSource</text>

  <rect x="350" y="162" width="290" height="38" rx="4" fill="#e1bee7" stroke="#8e24aa" stroke-width="1"/>
  <text x="495" y="178" text-anchor="middle" fill="#4a148c" font-size="11">LivedComposition.profile()</text>
  <text x="495" y="192" text-anchor="middle" fill="#9c27b0" font-size="10">fingerprint check → composed terms</text>

  <!-- Arrow from impl to composition -->
  <line x1="320" y1="181" x2="348" y2="181" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Arrow from SPI down to impl -->
  <line x1="530" y1="96" x2="530" y2="120" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="530" y1="120" x2="180" y2="120" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="180" y1="120" x2="180" y2="160" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="355" y="116" text-anchor="middle" fill="#888" font-size="10">CDI resolution</text>

  <!-- Neocortex layer -->
  <rect x="20" y="230" width="640" height="90" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="40" y="252" font-weight="bold" fill="#2e7d32" font-size="13">neocortex — cognitive engine</text>

  <rect x="40" y="262" width="190" height="44" rx="4" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
  <text x="135" y="282" text-anchor="middle" fill="#1b5e20" font-size="11">PersonalityStateService</text>
  <text x="135" y="296" text-anchor="middle" fill="#66bb6a" font-size="10">find() → LivedProfile</text>

  <rect x="250" y="262" width="190" height="44" rx="4" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
  <text x="345" y="282" text-anchor="middle" fill="#1b5e20" font-size="11">DispositionEvolutionPhase</text>
  <text x="345" y="296" text-anchor="middle" fill="#66bb6a" font-size="10">commitEvolution()</text>

  <rect x="460" y="262" width="180" height="44" rx="4" fill="#c8e6c9" stroke="#388e3c" stroke-width="1"/>
  <text x="550" y="282" text-anchor="middle" fill="#1b5e20" font-size="11">CAPS Engine</text>
  <text x="550" y="296" text-anchor="middle" fill="#66bb6a" font-size="10">settling → personality shift</text>

  <!-- Arrows within neocortex -->
  <line x1="460" y1="284" x2="442" y2="284" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="250" y1="284" x2="232" y2="284" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Arrow from PSS up to bridge -->
  <line x1="135" y1="262" x2="135" y2="202" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="145" y="234" fill="#888" font-size="10">Instance&lt;PSS&gt;</text>
</svg>
