<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Pipeline Components — Before Observability</text>

  <!-- Memory Recall -->
  <rect x="30" y="55" width="160" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="110" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Memory Recall</text>
  <text x="110" y="97" text-anchor="middle" font-size="10" fill="#92400e">memories=0 for</text>
  <text x="110" y="110" text-anchor="middle" font-size="10" fill="#92400e">100 ticks. Silent.</text>

  <!-- Session Clear -->
  <rect x="220" y="55" width="160" height="70" rx="8" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>
  <text x="300" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Session Clear</text>
  <text x="300" y="97" text-anchor="middle" font-size="10" fill="#991b1b">clear() was a no-op.</text>
  <text x="300" y="110" text-anchor="middle" font-size="10" fill="#991b1b">Nobody noticed.</text>

  <!-- Observation Cache -->
  <rect x="410" y="55" width="160" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="490" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Segment Cache</text>
  <text x="490" y="97" text-anchor="middle" font-size="10" fill="#92400e">Inferred working from</text>
  <text x="490" y="110" text-anchor="middle" font-size="10" fill="#92400e">output quality. Maybe.</text>

  <!-- Compaction -->
  <rect x="600" y="55" width="170" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="685" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Compaction</text>
  <text x="685" y="97" text-anchor="middle" font-size="10" fill="#92400e">Log output exists.</text>
  <text x="685" y="110" text-anchor="middle" font-size="10" fill="#92400e">No structured data.</text>

  <!-- Arrows down to "what you know" -->
  <line x1="110" y1="125" x2="110" y2="165" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="125" x2="300" y2="165" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="125" x2="490" y2="165" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="685" y1="125" x2="685" y2="165" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- What you know row -->
  <rect x="30" y="170" width="160" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="110" y="195" text-anchor="middle" font-size="10" fill="#475569">Nothing until tick 50</text>

  <rect x="220" y="170" width="160" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="300" y="195" text-anchor="middle" font-size="10" fill="#475569">Nothing until API crash</text>

  <rect x="410" y="170" width="160" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="490" y="195" text-anchor="middle" font-size="10" fill="#475569">Hope. Vibes.</text>

  <rect x="600" y="170" width="170" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="685" y="195" text-anchor="middle" font-size="10" fill="#475569">Grep the logs</text>

  <!-- Diagnosis label -->
  <rect x="180" y="240" width="440" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Diagnosis method: forensic archaeology after the fact</text>
  <text x="400" y="285" text-anchor="middle" font-size="11" fill="#991b1b">Every blind spot discovered by accident, not by design</text>
</svg>
