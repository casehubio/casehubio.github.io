<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="720" height="380" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Deployment Target Routing — Before and After</text>

  <!-- BEFORE section -->
  <text x="40" y="60" font-size="13" font-weight="600" fill="#dc2626">Before: hardcoded in YAML</text>

  <!-- YAML -->
  <rect x="40" y="72" width="140" height="44" rx="5" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="110" y="90" text-anchor="middle" font-weight="500" fill="#9a3412" font-size="11">01-hello-llm.yaml</text>
  <text x="110" y="104" text-anchor="middle" fill="#c2410c" font-size="10">target: claudony</text>

  <!-- Compile -->
  <rect x="220" y="72" width="120" height="44" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="280" y="90" text-anchor="middle" font-weight="500" fill="#334155" font-size="11">Compile</text>
  <text x="280" y="104" text-anchor="middle" fill="#64748b" font-size="10">NodeSpecFactory</text>

  <!-- Graph -->
  <rect x="380" y="72" width="140" height="44" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="450" y="90" text-anchor="middle" font-weight="500" fill="#334155" font-size="11">DesiredStateGraph</text>
  <text x="450" y="104" text-anchor="middle" fill="#dc2626" font-size="10">target: claudony ← baked</text>

  <!-- resolveTarget -->
  <rect x="560" y="72" width="130" height="44" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="625" y="90" text-anchor="middle" font-weight="500" fill="#991b1b" font-size="11">resolveTarget()</text>
  <text x="625" y="104" text-anchor="middle" fill="#dc2626" font-size="10">→ ClaudonyTarget</text>

  <line x1="180" y1="94" x2="215" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="340" y1="94" x2="375" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="94" x2="555" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Divider -->
  <line x1="40" y1="140" x2="680" y2="140" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- AFTER section -->
  <text x="40" y="170" font-size="13" font-weight="600" fill="#16a34a">After: config override at deploy time</text>

  <!-- YAML (same) -->
  <rect x="40" y="182" width="140" height="44" rx="5" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="110" y="200" text-anchor="middle" font-weight="500" fill="#9a3412" font-size="11">01-hello-llm.yaml</text>
  <text x="110" y="214" text-anchor="middle" fill="#c2410c" font-size="10">target: claudony</text>

  <!-- Compile (same) -->
  <rect x="220" y="182" width="120" height="44" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="280" y="200" text-anchor="middle" font-weight="500" fill="#334155" font-size="11">Compile</text>
  <text x="280" y="214" text-anchor="middle" fill="#64748b" font-size="10">NodeSpecFactory</text>

  <!-- Graph (truthful) -->
  <rect x="380" y="182" width="140" height="44" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="450" y="200" text-anchor="middle" font-weight="500" fill="#334155" font-size="11">DesiredStateGraph</text>
  <text x="450" y="214" text-anchor="middle" fill="#64748b" font-size="10">target: claudony (truthful)</text>

  <!-- resolveTarget with override -->
  <rect x="560" y="182" width="130" height="44" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="625" y="200" text-anchor="middle" font-weight="500" fill="#166534" font-size="11">resolveTarget()</text>
  <text x="625" y="214" text-anchor="middle" fill="#16a34a" font-size="10">→ PodmanTarget ✓</text>

  <line x1="180" y1="204" x2="215" y2="204" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="340" y1="204" x2="375" y2="204" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="204" x2="555" y2="204" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Config property callout -->
  <rect x="520" y="250" width="170" height="36" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-dasharray="4,2"/>
  <text x="605" y="265" text-anchor="middle" fill="#166534" font-size="10">%dev.casehub.ops</text>
  <text x="605" y="278" text-anchor="middle" fill="#166534" font-size="10">.deployment-target-override=podman</text>
  <line x1="625" y1="250" x2="625" y2="230" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>

  <!-- Key insight -->
  <rect x="40" y="310" width="640" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="360" y="330" text-anchor="middle" font-weight="500" fill="#1e40af" font-size="12">The graph stays truthful — plan views show what the YAML says.</text>
  <text x="360" y="345" text-anchor="middle" fill="#3b82f6" font-size="12">The override is purely a runtime routing concern for local dev.</text>
</svg>
