<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Provider String → Family:Flow Resolution</text>

  <!-- Provider strings -->
  <rect x="20" y="60" width="160" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="83" text-anchor="middle" font-weight="600" fill="#1e40af">"microsoft"</text>

  <rect x="20" y="120" width="160" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="143" text-anchor="middle" font-weight="600" fill="#1e40af">"microsoft-app"</text>

  <rect x="20" y="180" width="160" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="203" text-anchor="middle" font-weight="600" fill="#1e40af">"microsoft-bot"</text>

  <!-- resolveFamily box -->
  <rect x="240" y="90" width="150" height="80" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="315" y="118" text-anchor="middle" font-weight="600" fill="#1e293b">resolveFamily()</text>
  <text x="315" y="138" text-anchor="middle" font-size="11" fill="#64748b">exact match →</text>
  <text x="315" y="153" text-anchor="middle" font-size="11" fill="#64748b">primary flow</text>
  <text x="315" y="168" text-anchor="middle" font-size="11" fill="#64748b">prefix + suffix → named</text>

  <!-- Arrows to resolveFamily -->
  <line x1="180" y1="78" x2="240" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="138" x2="240" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="198" x2="240" y2="148" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Flow outputs -->
  <rect x="460" y="50" width="240" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="68" text-anchor="middle" font-size="11" fill="#166534">authorization_code</text>
  <text x="580" y="84" text-anchor="middle" font-weight="600" fill="#166534">delegated → refresh_token</text>

  <rect x="460" y="120" width="240" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="580" y="138" text-anchor="middle" font-size="11" fill="#92400e">client_credentials</text>
  <text x="580" y="154" text-anchor="middle" font-weight="600" fill="#92400e">app → graph.microsoft.com</text>

  <rect x="460" y="190" width="240" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="580" y="208" text-anchor="middle" font-size="11" fill="#92400e">client_credentials</text>
  <text x="580" y="224" text-anchor="middle" font-weight="600" fill="#92400e">bot → botframework.com</text>

  <!-- Arrows from resolveFamily to flows -->
  <line x1="390" y1="110" x2="460" y2="72" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="130" x2="460" y2="142" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="150" x2="460" y2="212" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Credential source -->
  <rect x="240" y="290" width="460" height="100" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="470" y="314" text-anchor="middle" font-weight="600" fill="#475569">Shared Azure AD App Registration</text>
  <text x="350" y="340" text-anchor="middle" font-size="12" fill="#64748b">tenant-id</text>
  <text x="470" y="340" text-anchor="middle" font-size="12" fill="#64748b">client-id</text>
  <text x="590" y="340" text-anchor="middle" font-size="12" fill="#64748b">client-secret</text>
  <text x="470" y="365" text-anchor="middle" font-size="11" fill="#94a3b8">ProviderCredentialFacade — resolved by family ID, not provider string</text>

  <!-- Dashed lines from flows to credentials -->
  <line x1="580" y1="94" x2="470" y2="290" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="580" y1="164" x2="470" y2="290" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="580" y1="234" x2="470" y2="290" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
</svg>
