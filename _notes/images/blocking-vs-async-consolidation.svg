<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      .label { font-size: 13px; fill: #374151; font-weight: 600; }
      .tick-text { font-size: 11px; fill: #6B7280; }
      .phase-text { font-size: 10px; fill: #fff; font-weight: 500; }
      .title { font-size: 15px; fill: #111827; font-weight: 700; }
      .subtitle { font-size: 11px; fill: #9CA3AF; }
      .annotation { font-size: 11px; fill: #DC2626; font-weight: 600; }
      .annotation-ok { font-size: 11px; fill: #059669; font-weight: 600; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Blocking vs Async Consolidation</text>

  <!-- BEFORE: Blocking -->
  <text x="40" y="70" class="label">Before: Blocking</text>
  <text x="40" y="85" class="subtitle">consolidateNow() runs on tick thread</text>

  <!-- Timeline bar -->
  <rect x="40" y="100" width="720" height="6" rx="3" fill="#E5E7EB"/>

  <!-- Tick 49 -->
  <rect x="40" y="96" width="80" height="14" rx="2" fill="#3B82F6"/>
  <text x="80" y="107" text-anchor="middle" class="phase-text">Tick 49</text>

  <!-- Consolidation block -->
  <rect x="120" y="90" width="480" height="24" rx="3" fill="#DC2626" opacity="0.9"/>
  <text x="360" y="106" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">Consolidation — 698s (11.6 min) BLOCKING</text>

  <!-- Dead zone -->
  <rect x="600" y="96" width="60" height="14" rx="2" fill="#EF4444" opacity="0.4"/>
  <text x="630" y="107" text-anchor="middle" font-size="9" fill="#991B1B">FAIL</text>

  <!-- Tick 52 recovery -->
  <rect x="660" y="96" width="80" height="14" rx="2" fill="#3B82F6" opacity="0.6"/>
  <text x="700" y="107" text-anchor="middle" class="phase-text">Tick 52</text>

  <!-- Annotations -->
  <line x1="120" y1="120" x2="120" y2="150" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="122" y="142" class="annotation">tick loop blocked</text>

  <line x1="600" y1="120" x2="600" y2="165" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="602" y="157" class="annotation">all 5 queries fail</text>
  <text x="602" y="170" class="annotation">sessions: 9 → 0</text>

  <!-- Session count -->
  <text x="80" y="135" class="tick-text">sessions: 9</text>
  <text x="700" y="135" class="tick-text">sessions: 0</text>

  <!-- AFTER: Async -->
  <text x="40" y="230" class="label">After: Async</text>
  <text x="40" y="245" class="subtitle">consolidateNow() submits to background executor</text>

  <!-- Timeline bar -->
  <rect x="40" y="260" width="720" height="6" rx="3" fill="#E5E7EB"/>

  <!-- Continuous ticks -->
  <rect x="40" y="256" width="80" height="14" rx="2" fill="#3B82F6"/>
  <text x="80" y="267" text-anchor="middle" class="phase-text">Tick 49</text>

  <rect x="125" y="256" width="70" height="14" rx="2" fill="#3B82F6"/>
  <text x="160" y="267" text-anchor="middle" class="phase-text">Tick 50</text>

  <rect x="200" y="256" width="70" height="14" rx="2" fill="#3B82F6"/>
  <text x="235" y="267" text-anchor="middle" class="phase-text">Tick 51</text>

  <rect x="275" y="256" width="70" height="14" rx="2" fill="#3B82F6"/>
  <text x="310" y="267" text-anchor="middle" class="phase-text">Tick 52</text>

  <rect x="350" y="256" width="70" height="14" rx="2" fill="#3B82F6"/>
  <text x="385" y="267" text-anchor="middle" class="phase-text">Tick 53</text>

  <rect x="425" y="256" width="70" height="14" rx="2" fill="#3B82F6"/>
  <text x="460" y="267" text-anchor="middle" class="phase-text">Tick 54</text>

  <text x="510" y="267" class="tick-text">. . .</text>

  <!-- Background consolidation bar -->
  <rect x="125" y="285" width="420" height="18" rx="3" fill="#059669" opacity="0.8"/>
  <text x="335" y="298" text-anchor="middle" font-size="11" fill="#fff" font-weight="500">Consolidation (background thread) — AIMD admission manages contention</text>

  <!-- Annotations -->
  <line x1="125" y1="275" x2="125" y2="310" stroke="#059669" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="127" y="322" class="annotation-ok">dispatched, tick loop continues</text>

  <text x="125" y="345" class="tick-text">sessions: 9 → 9 (character sessions uninterrupted)</text>

  <!-- Legend -->
  <rect x="40" y="380" width="14" height="14" rx="2" fill="#3B82F6"/>
  <text x="60" y="392" class="tick-text">Character ticks</text>

  <rect x="180" y="380" width="14" height="14" rx="2" fill="#DC2626" opacity="0.9"/>
  <text x="200" y="392" class="tick-text">Blocking consolidation</text>

  <rect x="380" y="380" width="14" height="14" rx="2" fill="#059669" opacity="0.8"/>
  <text x="400" y="392" class="tick-text">Background consolidation</text>
</svg>