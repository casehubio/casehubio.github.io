<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Dual-Level Personality Influence on CAPS</text>

  <!-- Observation box -->
  <rect x="20" y="130" width="120" height="50" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="80" y="160" text-anchor="middle" font-size="12" fill="#334155">Observation</text>

  <!-- Classification level -->
  <rect x="180" y="50" width="260" height="100" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="310" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Level 1: Classification</text>
  <text x="310" y="92" text-anchor="middle" font-size="10" fill="#1e40af">(this spec — primary appraisal)</text>
  <text x="310" y="115" text-anchor="middle" font-size="10" fill="#334155">DispositionAxes → interpretive framing</text>
  <text x="310" y="132" text-anchor="middle" font-size="10" fill="#334155">Which CAPS input nodes activate</text>

  <!-- Arrow obs → classification -->
  <line x1="140" y1="155" x2="175" y2="105" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- CAPS input nodes -->
  <rect x="480" y="60" width="100" height="30" rx="4" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
  <text x="530" y="80" text-anchor="middle" font-size="10" fill="#166534">reward: 0.8</text>
  <rect x="480" y="100" width="100" height="30" rx="4" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
  <text x="530" y="120" text-anchor="middle" font-size="10" fill="#166534">threat: 0.6</text>

  <!-- Arrow classification → nodes -->
  <line x1="440" y1="100" x2="475" y2="90" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Propagation level -->
  <rect x="180" y="190" width="260" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="212" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Level 2: Propagation</text>
  <text x="310" y="232" text-anchor="middle" font-size="10" fill="#92400e">(existing — secondary appraisal)</text>
  <text x="310" y="255" text-anchor="middle" font-size="10" fill="#334155">disposition_modifiers → weight modulation</text>
  <text x="310" y="272" text-anchor="middle" font-size="10" fill="#334155">How activations flow through network</text>

  <!-- Arrow nodes → propagation -->
  <line x1="530" y1="135" x2="530" y2="170" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="530" y1="170" x2="445" y2="230" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Output attractors -->
  <rect x="500" y="210" width="120" height="50" rx="6" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="560" y="232" text-anchor="middle" font-size="10" fill="#991b1b">Behavioral</text>
  <text x="560" y="248" text-anchor="middle" font-size="10" fill="#991b1b">Attractors</text>

  <!-- Arrow propagation → output -->
  <line x1="440" y1="240" x2="495" y2="235" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Personality source -->
  <rect x="20" y="250" width="120" height="40" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
  <text x="80" y="274" text-anchor="middle" font-size="11" fill="#7e22ce">DispositionAxes</text>

  <!-- Arrows from personality to both levels -->
  <line x1="80" y1="250" x2="175" y2="120" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <line x1="140" y1="270" x2="175" y2="250" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
</svg>
