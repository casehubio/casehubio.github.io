<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Read-Persisted-State Architecture</text>

  <!-- Cognition module (writes) -->
  <rect x="30" y="55" width="300" height="160" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="180" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">cognition module (writes)</text>

  <rect x="50" y="90" width="120" height="36" rx="4" fill="white" stroke="#93c5fd"/>
  <text x="110" y="113" text-anchor="middle" font-size="10" fill="#374151">MoodOrchestrator</text>

  <rect x="190" y="90" width="120" height="36" rx="4" fill="white" stroke="#93c5fd"/>
  <text x="250" y="113" text-anchor="middle" font-size="10" fill="#374151">DriveOrchestrator</text>

  <rect x="50" y="140" width="120" height="36" rx="4" fill="white" stroke="#93c5fd"/>
  <text x="110" y="163" text-anchor="middle" font-size="10" fill="#374151">ReflectionService</text>

  <rect x="190" y="140" width="120" height="36" rx="4" fill="white" stroke="#93c5fd"/>
  <text x="250" y="163" text-anchor="middle" font-size="10" fill="#374151">Consolidation</text>
  <text x="250" y="174" text-anchor="middle" font-size="9" fill="#6b7280">Scheduler</text>

  <!-- Persistent stores (middle) -->
  <rect x="160" y="250" width="400" height="60" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="360" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Persistent Stores</text>

  <text x="230" y="295" text-anchor="middle" font-size="10" fill="#374151">MindMapStore</text>
  <text x="230" y="306" text-anchor="middle" font-size="9" fill="#6b7280">(COGNITIVE subgraph)</text>
  <text x="490" y="295" text-anchor="middle" font-size="10" fill="#374151">CaseMemoryStore</text>
  <text x="490" y="306" text-anchor="middle" font-size="9" fill="#6b7280">(mood, reflection domains)</text>

  <!-- cognitive-runtime (reads) -->
  <rect x="390" y="55" width="300" height="160" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="540" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">cognitive-runtime (reads)</text>

  <rect x="410" y="90" width="120" height="36" rx="4" fill="white" stroke="#fbbf24"/>
  <text x="470" y="113" text-anchor="middle" font-size="10" fill="#374151">NeedsCapability</text>

  <rect x="550" y="90" width="120" height="36" rx="4" fill="white" stroke="#fbbf24"/>
  <text x="610" y="113" text-anchor="middle" font-size="10" fill="#374151">Consolidation</text>
  <text x="610" y="124" text-anchor="middle" font-size="9" fill="#6b7280">Capability</text>

  <rect x="410" y="140" width="120" height="36" rx="4" fill="white" stroke="#fbbf24"/>
  <text x="470" y="163" text-anchor="middle" font-size="10" fill="#374151">AppraisalCapability</text>

  <rect x="550" y="140" width="120" height="36" rx="4" fill="white" stroke="#fbbf24"/>
  <text x="610" y="163" text-anchor="middle" font-size="10" fill="#374151">InnerThoughts</text>
  <text x="610" y="174" text-anchor="middle" font-size="9" fill="#6b7280">Capability</text>

  <!-- Write arrows (blue, down) -->
  <line x1="110" y1="176" x2="230" y2="250" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="250" y1="176" x2="230" y2="250" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="110" y1="176" x2="490" y2="250" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)" stroke-dasharray="4,3"/>
  <line x1="250" y1="176" x2="230" y2="250" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Read arrows (green, up) -->
  <line x1="230" y1="250" x2="470" y2="176" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="230" y1="250" x2="610" y2="176" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="490" y1="250" x2="470" y2="176" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="490" y1="250" x2="610" y2="176" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Legend -->
  <line x1="50" y1="380" x2="90" y2="380" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="100" y="384" font-size="10" fill="#374151">writes (at tick time)</text>

  <line x1="250" y1="380" x2="290" y2="380" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="300" y="384" font-size="10" fill="#374151">reads (at render time)</text>

  <rect x="460" y="372" width="12" height="12" rx="2" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="480" y="384" font-size="10" fill="#374151">cognition (tick loop)</text>

  <rect x="600" y="372" width="12" height="12" rx="2" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="620" y="384" font-size="10" fill="#374151">cognitive-runtime</text>

  <!-- Mutual exclusion annotation -->
  <text x="360" y="400" text-anchor="middle" font-size="9" fill="#6b7280" font-style="italic">When both layers active: cognitive-runtime capabilities yield via isActive()=false</text>
</svg>
