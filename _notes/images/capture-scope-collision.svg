<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="320" rx="6" fill="#f8fafc"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Variable resolver state across step boundaries</text>

  <!-- Step 1 column -->
  <rect x="30" y="50" width="200" height="40" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="130" y="75" text-anchor="middle" font-size="12" font-weight="500" fill="#1e40af">Step 1: agent-invoke</text>
  <text x="130" y="92" text-anchor="middle" font-size="10" fill="#3b82f6">capture: result</text>

  <!-- Arrow down from step 1 -->
  <line x1="130" y1="95" x2="130" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Resolver after step 1 -->
  <rect x="30" y="125" width="200" height="55" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="130" y="145" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">resolver scopes:</text>
  <text x="130" y="162" text-anchor="middle" font-size="10" fill="#15803d" font-family="monospace">"result" → captured output</text>
  <text x="130" y="175" text-anchor="middle" font-size="9" fill="#22c55e">✓ ${result.text} resolves correctly</text>

  <!-- Arrow right -->
  <line x1="235" y1="152" x2="260" y2="152" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2 column -->
  <rect x="265" y="50" width="200" height="40" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="365" y="75" text-anchor="middle" font-size="12" font-weight="500" fill="#1e40af">Step 2: assertThat</text>
  <text x="365" y="92" text-anchor="middle" font-size="10" fill="#3b82f6">${result.text} contains "hello"</text>

  <!-- evaluate() box -->
  <rect x="265" y="110" width="200" height="30" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="365" y="130" text-anchor="middle" font-size="10" font-weight="500" fill="#92400e">evaluate() → withResultScope()</text>

  <!-- Arrow down -->
  <line x1="365" y1="140" x2="365" y2="155" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Resolver after overwrite -->
  <rect x="265" y="160" width="200" height="55" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="365" y="180" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">resolver scopes:</text>
  <text x="365" y="197" text-anchor="middle" font-size="10" fill="#dc2626" font-family="monospace">"result" → built-in (overwrites!)</text>
  <text x="365" y="210" text-anchor="middle" font-size="9" fill="#ef4444">✗ ${result.text} → no step named "text"</text>

  <!-- Fix column -->
  <rect x="490" y="50" width="210" height="40" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="595" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Fix: compile-time rejection</text>

  <!-- Fix detail -->
  <rect x="490" y="110" width="210" height="90" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="595" y="132" text-anchor="middle" font-size="10" fill="#166534">Walker validates capture names</text>
  <text x="595" y="148" text-anchor="middle" font-size="10" fill="#166534">against RESERVED_CAPTURE_NAMES</text>
  <text x="595" y="170" text-anchor="middle" font-size="10" font-family="monospace" fill="#15803d">capture: result → error</text>
  <text x="595" y="186" text-anchor="middle" font-size="10" font-family="monospace" fill="#15803d">capture: output → ok</text>

  <!-- Bottom note -->
  <text x="360" y="260" text-anchor="middle" font-size="11" fill="#64748b">The built-in "result" scope is re-registered on every evaluate() call.</text>
  <text x="360" y="276" text-anchor="middle" font-size="11" fill="#64748b">A user-chosen capture named "result" is silently overwritten at every step boundary.</text>
  <text x="360" y="296" text-anchor="middle" font-size="11" font-weight="500" fill="#475569">The collision is invisible — the data looks correct for the immediately following step.</text>
</svg>
