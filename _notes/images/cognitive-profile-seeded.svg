<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #1a1a2e; }
    .cat-label { font-size: 12px; font-weight: 600; fill: #1a1a2e; }
    .item-label { font-size: 11px; fill: #444; }
    .count { font-size: 13px; font-weight: 700; fill: #fff; }
    .count-dark { font-size: 13px; font-weight: 700; fill: #1a1a2e; }
    .bar-cognitive { fill: #5c6bc0; }
    .bar-behavioral { fill: #26a69a; }
    .bar-social { fill: #ef5350; }
    .bar-memory { fill: #ffa726; }
    .bar-runtime { fill: #7e57c2; }
    .bracket { stroke: #999; stroke-width: 1; fill: none; }
    .note { font-size: 10px; fill: #777; font-style: italic; }
  </style>

  <text x="380" y="28" text-anchor="middle" class="title">What a Character Knows from Memory Alone (Clara Bellingham, 30 ticks)</text>

  <!-- Seeded at startup -->
  <text x="30" y="65" class="cat-label">Seeded at Startup</text>

  <rect x="30" y="75" width="240" height="28" rx="4" class="bar-cognitive"/>
  <text x="40" y="94" class="item-label" fill="#fff">Drive intensities</text>
  <text x="260" y="94" text-anchor="end" class="count">6</text>

  <rect x="30" y="108" width="160" height="28" rx="4" class="bar-cognitive"/>
  <text x="40" y="127" class="item-label" fill="#fff">Personality facets</text>
  <text x="180" y="127" text-anchor="end" class="count">4</text>

  <rect x="30" y="141" width="40" height="28" rx="4" class="bar-cognitive"/>
  <text x="80" y="160" class="item-label">Attachment style</text>
  <text x="50" y="160" text-anchor="middle" class="count">1</text>

  <rect x="30" y="174" width="200" height="28" rx="4" class="bar-cognitive"/>
  <text x="40" y="193" class="item-label" fill="#fff">Need satisfaction</text>
  <text x="220" y="193" text-anchor="end" class="count">5</text>

  <rect x="30" y="207" width="240" height="28" rx="4" class="bar-cognitive"/>
  <text x="40" y="226" class="item-label" fill="#fff">Relational schemas</text>
  <text x="260" y="226" text-anchor="end" class="count">6</text>

  <rect x="30" y="240" width="200" height="28" rx="4" class="bar-memory"/>
  <text x="40" y="259" class="item-label" fill="#fff">Formation memories</text>
  <text x="220" y="259" text-anchor="end" class="count">5</text>

  <rect x="30" y="273" width="400" height="28" rx="4" class="bar-behavioral"/>
  <text x="40" y="292" class="item-label" fill="#fff">CAPS behavioral attractors</text>
  <text x="420" y="292" text-anchor="end" class="count">25</text>

  <rect x="30" y="306" width="280" height="28" rx="4" class="bar-social"/>
  <text x="40" y="325" class="item-label" fill="#fff">Social overlays (relationships)</text>
  <text x="300" y="325" text-anchor="end" class="count">18</text>

  <!-- Runtime -->
  <text x="500" y="65" class="cat-label">Earned at Runtime (30 ticks)</text>

  <rect x="500" y="75" width="120" height="28" rx="4" class="bar-runtime"/>
  <text x="510" y="94" class="item-label" fill="#fff">New drives</text>
  <text x="610" y="94" text-anchor="end" class="count">3</text>

  <rect x="500" y="108" width="80" height="28" rx="4" class="bar-runtime"/>
  <text x="510" y="127" class="item-label" fill="#fff">New facets</text>
  <text x="570" y="127" text-anchor="end" class="count">2</text>

  <rect x="500" y="141" width="200" height="28" rx="4" class="bar-runtime"/>
  <text x="510" y="160" class="item-label" fill="#fff">Need updates</text>
  <text x="690" y="160" text-anchor="end" class="count">5</text>

  <rect x="500" y="174" width="120" height="28" rx="4" class="bar-runtime"/>
  <text x="510" y="193" class="item-label" fill="#fff">New relationships</text>
  <text x="610" y="193" text-anchor="end" class="count">3</text>

  <rect x="500" y="207" width="360" height="28" rx="4" class="bar-runtime" opacity="0.5"/>
  <text x="510" y="226" class="item-label" fill="#fff">Experience memories (stored)</text>
  <text x="680" y="226" text-anchor="start" class="count-dark">14</text>
  <text x="710" y="226" class="note">← can't recall (bug)</text>

  <rect x="500" y="240" width="360" height="28" rx="4" class="bar-social"/>
  <text x="510" y="259" class="item-label" fill="#fff">Dialogue extraction nodes</text>
  <text x="850" y="259" text-anchor="end" class="count">9</text>

  <!-- Totals -->
  <line x1="30" y1="355" x2="730" y2="355" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="380" class="cat-label">Seeded: 70 nodes</text>
  <text x="250" y="380" class="cat-label" fill="#7e57c2">+ Runtime: 31 nodes</text>
  <text x="520" y="380" class="cat-label">= 93 → 124 total</text>
</svg>
