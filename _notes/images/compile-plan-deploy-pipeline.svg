<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="720" height="280" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Compile → Plan → Deploy Pipeline</text>

  <!-- YAML Files -->
  <rect x="30" y="60" width="130" height="70" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="95" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Topology YAML</text>
  <text x="95" y="102" text-anchor="middle" font-size="10" fill="#64748b">01-hello-llm/</text>
  <text x="95" y="118" text-anchor="middle" font-size="10" fill="#64748b">*.yaml files</text>

  <!-- Arrow 1 -->
  <line x1="160" y1="95" x2="195" y2="95" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Compile -->
  <rect x="200" y="60" width="130" height="70" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="265" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">compileTopology()</text>
  <text x="265" y="102" text-anchor="middle" font-size="10" fill="#6366f1">Parse, resolve types,</text>
  <text x="265" y="118" text-anchor="middle" font-size="10" fill="#6366f1">compose graph</text>

  <!-- Arrow 2 -->
  <line x1="330" y1="95" x2="365" y2="95" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DesiredStateGraph -->
  <rect x="370" y="52" width="130" height="86" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="435" y="75" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">DesiredStateGraph</text>
  <text x="435" y="93" text-anchor="middle" font-size="10" fill="#64748b">4 nodes</text>
  <text x="435" y="108" text-anchor="middle" font-size="10" fill="#64748b">3 dependencies</text>
  <text x="435" y="123" text-anchor="middle" font-size="10" fill="#64748b">(DAG)</text>

  <!-- Fork down to Plan -->
  <line x1="435" y1="138" x2="435" y2="165" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- TransitionPlan -->
  <rect x="335" y="170" width="200" height="70" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="435" y="193" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">TransitionPlanner.plan()</text>
  <text x="435" y="211" text-anchor="middle" font-size="10" fill="#22c55e">Layer 1: [manifest]</text>
  <text x="435" y="226" text-anchor="middle" font-size="10" fill="#22c55e">Layer 2: [eidos]  Layer 3: [engine, my-llm]</text>

  <!-- Arrow to Deploy -->
  <line x1="535" y1="95" x2="560" y2="95" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Deploy -->
  <rect x="565" y="52" width="130" height="86" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="630" y="75" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">deploy()</text>
  <text x="630" y="93" text-anchor="middle" font-size="10" fill="#b45309">Start reconciliation</text>
  <text x="630" y="108" text-anchor="middle" font-size="10" fill="#b45309">loop + create</text>
  <text x="630" y="123" text-anchor="middle" font-size="10" fill="#b45309">lifecycle case</text>
</svg>
