<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="system-ui, sans-serif">
  <style>
    .bg { fill: #1a1a2e; }
    .pill { rx: 12; ry: 12; stroke-width: 1.5; }
    .pill-normal { fill: #252538; stroke: #3a3a52; }
    .pill-remove { fill: #2e1a1a; stroke: #ef4444; stroke-dasharray: 4,2; }
    .pill-add { fill: #0a2e1a; stroke: #16a34a; }
    .name { font-size: 12px; font-weight: 500; fill: #c0c0d0; }
    .name-remove { font-size: 12px; font-weight: 500; fill: #ef4444; text-decoration: line-through; }
    .name-add { font-size: 12px; font-weight: 500; fill: #22c55e; }
    .edge { stroke: #6b7280; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .edge-remove { stroke: #ef4444; stroke-width: 1.5; fill: none; stroke-dasharray: 4,2; }
    .edge-add { stroke: #22c55e; stroke-width: 1.5; fill: none; marker-end: url(#arrow-green); }
    .label { fill: #93c5fd; font-size: 14px; font-weight: 600; }
    .sublabel { fill: #6b7280; font-size: 11px; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="#6b7280"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="#22c55e"/>
    </marker>
  </defs>

  <rect class="bg" width="720" height="200"/>

  <!-- Before: A → B → C, A → B → D -->
  <text class="label" x="180" y="20" text-anchor="middle">Before</text>

  <rect class="pill pill-normal" x="60" y="35" width="80" height="28"/>
  <text class="name" x="100" y="54" text-anchor="middle">Boot</text>

  <rect class="pill pill-remove" x="200" y="35" width="80" height="28"/>
  <text class="name-remove" x="240" y="54" text-anchor="middle">Deacon</text>

  <rect class="pill pill-normal" x="60" y="80" width="110" height="28"/>
  <text class="name" x="115" y="99" text-anchor="middle">Witness Alpha</text>

  <rect class="pill pill-normal" x="200" y="80" width="110" height="28"/>
  <text class="name" x="255" y="99" text-anchor="middle">Witness Beta</text>

  <path class="edge-remove" d="M140,49 L198,49"/>
  <path class="edge-remove" d="M240,63 L240,72 L115,72 L115,78"/>
  <path class="edge-remove" d="M240,63 L240,72 L255,72 L255,78"/>

  <text class="sublabel" x="180" y="130" text-anchor="middle">3 removals</text>

  <!-- After: A → C, A → D -->
  <text class="label" x="540" y="20" text-anchor="middle">After</text>

  <rect class="pill pill-normal" x="500" y="35" width="80" height="28"/>
  <text class="name" x="540" y="54" text-anchor="middle">Boot</text>

  <rect class="pill pill-add" x="420" y="80" width="110" height="28"/>
  <text class="name-add" x="475" y="99" text-anchor="middle">Witness Alpha</text>

  <rect class="pill pill-add" x="560" y="80" width="110" height="28"/>
  <text class="name-add" x="615" y="99" text-anchor="middle">Witness Beta</text>

  <path class="edge-add" d="M540,63 L540,72 L475,72 L475,78"/>
  <path class="edge-add" d="M540,63 L540,72 L615,72 L615,78"/>

  <text class="sublabel" x="540" y="130" text-anchor="middle">2 additions (scope inherited)</text>

  <!-- Bottom label -->
  <text class="sublabel" x="360" y="170" text-anchor="middle">Remove Deacon, reconnect children to Boot — one atomic ChainOperation</text>
  <text class="sublabel" x="360" y="186" text-anchor="middle">Scope from Deacon→child edges propagates to Boot→child edges. Attestation does not.</text>
</svg>
