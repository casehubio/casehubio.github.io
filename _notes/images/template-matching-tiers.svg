<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Template Matching Pipeline — Four-Tier Cascade</text>

  <!-- Tier 0: Regex -->
  <rect x="40" y="50" width="640" height="52" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="60" y="72" font-size="11" font-weight="bold" fill="#0369a1">TIER 0</text>
  <text x="120" y="72" font-size="13" fill="#1e293b">Regex — compiled pattern match</text>
  <text x="60" y="90" font-size="11" fill="#64748b">InMemoryTemplateRegistry.matchInNamespace()</text>

  <!-- Arrow down -->
  <line x1="360" y1="102" x2="360" y2="118" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="375" y="114" font-size="10" fill="#dc2626">miss</text>

  <!-- Tier 1: Keyword Affinity / Trie -->
  <rect x="40" y="120" width="310" height="72" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="60" y="142" font-size="11" font-weight="bold" fill="#15803d">TIER 1a</text>
  <text x="125" y="142" font-size="13" fill="#1e293b">Keyword Affinity</text>
  <text x="60" y="158" font-size="11" fill="#64748b">bag-of-words lemma overlap</text>
  <text x="60" y="174" font-size="10" fill="#94a3b8">&lt; 100 patterns per namespace</text>

  <rect x="370" y="120" width="310" height="72" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="390" y="142" font-size="11" font-weight="bold" fill="#15803d">TIER 1b</text>
  <text x="455" y="142" font-size="13" fill="#1e293b">Discrimination Trie</text>
  <text x="390" y="158" font-size="11" fill="#64748b">positional literal + wildcard walk</text>
  <text x="390" y="174" font-size="10" fill="#94a3b8">&ge; 100 patterns per namespace</text>

  <!-- Arrow between 1a and 1b -->
  <text x="358" y="160" font-size="10" fill="#475569" text-anchor="middle">or</text>

  <!-- Both go to structural matcher -->
  <line x1="195" y1="192" x2="195" y2="210" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="525" y1="192" x2="525" y2="210" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="140" y="206" font-size="10" fill="#16a34a">candidates</text>
  <text x="470" y="206" font-size="10" fill="#16a34a">candidates</text>

  <!-- Structural Matcher -->
  <rect x="120" y="212" width="480" height="44" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="260" y="234" font-size="13" fill="#1e293b">Structural Matcher</text>
  <text x="410" y="234" font-size="11" fill="#64748b">— sequential element alignment</text>

  <!-- Arrow down from structural -->
  <line x1="360" y1="256" x2="360" y2="272" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="375" y="268" font-size="10" fill="#dc2626">miss</text>

  <!-- Tier 2: Embedding Rescue -->
  <rect x="40" y="274" width="640" height="62" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="60" y="296" font-size="11" font-weight="bold" fill="#7e22ce">TIER 2</text>
  <text x="120" y="296" font-size="13" fill="#1e293b">Embedding Rescue</text>
  <text x="280" y="296" font-size="11" fill="#64748b">— cosine similarity on keyword embeddings</text>
  <text x="60" y="316" font-size="11" fill="#94a3b8">synonym learning feeds back to Tier 1a</text>
  <!-- feedback arrow -->
  <path d="M 60,320 C 20,320 20,160 60,160" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="8" y="240" font-size="9" fill="#a855f7" transform="rotate(-90 8 240)">synonyms</text>

  <!-- Arrow down -->
  <line x1="360" y1="336" x2="360" y2="352" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="375" y="348" font-size="10" fill="#dc2626">miss</text>

  <!-- Tier 3: LLM -->
  <rect x="40" y="354" width="640" height="52" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="60" y="376" font-size="11" font-weight="bold" fill="#c2410c">TIER 3</text>
  <text x="120" y="376" font-size="13" fill="#1e293b">LLM Classification</text>
  <text x="290" y="376" font-size="11" fill="#64748b">— AdaptiveFallbackMatcher (variation learning)</text>
  <text x="60" y="394" font-size="11" fill="#94a3b8">AdaptiveTemplateRegistry.adaptiveFallback()</text>
</svg>
