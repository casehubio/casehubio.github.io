<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Callable Dispatch Architecture — Before and After</text>

  <!-- Before section -->
  <rect x="20" y="50" width="330" height="350" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="185" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">BEFORE</text>

  <!-- YAML do: block -->
  <rect x="40" y="90" width="130" height="36" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="105" y="113" text-anchor="middle" font-size="11" fill="#1e40af">YAML do: block</text>

  <!-- casehub:dispatch -->
  <rect x="40" y="150" width="130" height="36" rx="4" fill="#bbf7d0" stroke="#22c55e"/>
  <text x="105" y="173" text-anchor="middle" font-size="11" fill="#166534">casehub:dispatch</text>

  <!-- casehub:judgment -->
  <rect x="195" y="150" width="130" height="36" rx="4" fill="#bbf7d0" stroke="#22c55e"/>
  <text x="260" y="173" text-anchor="middle" font-size="11" fill="#166534">casehub:judgment</text>

  <!-- WorkOrchestrator -->
  <rect x="40" y="220" width="130" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="105" y="243" text-anchor="middle" font-size="11" fill="#475569">WorkOrchestrator</text>

  <!-- capability lookup -->
  <rect x="40" y="280" width="130" height="50" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="105" y="300" text-anchor="middle" font-size="11" fill="#92400e">AgentQuery</text>
  <text x="105" y="316" text-anchor="middle" font-size="10" fill="#92400e">.bySlot() / .byCap()</text>

  <!-- No direct agent path -->
  <rect x="195" y="280" width="130" height="50" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-dasharray="4,3"/>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#991b1b">findById()</text>
  <text x="260" y="316" text-anchor="middle" font-size="10" fill="#991b1b">⚠ never called</text>

  <!-- Arrows before -->
  <line x1="105" y1="126" x2="105" y2="150" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="105" y1="186" x2="105" y2="220" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="105" y1="256" x2="105" y2="280" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- After section -->
  <rect x="370" y="50" width="330" height="350" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="535" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">AFTER</text>

  <!-- YAML do: block -->
  <rect x="390" y="90" width="130" height="36" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="455" y="113" text-anchor="middle" font-size="11" fill="#1e40af">YAML do: block</text>

  <!-- casehub:dispatch -->
  <rect x="390" y="150" width="90" height="36" rx="4" fill="#bbf7d0" stroke="#22c55e"/>
  <text x="435" y="173" text-anchor="middle" font-size="10" fill="#166534">:dispatch</text>

  <!-- casehub:judgment -->
  <rect x="490" y="150" width="90" height="36" rx="4" fill="#bbf7d0" stroke="#22c55e"/>
  <text x="535" y="173" text-anchor="middle" font-size="10" fill="#166534">:judgment</text>

  <!-- casehub:agent (NEW) -->
  <rect x="590" y="150" width="90" height="36" rx="4" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/>
  <text x="635" y="168" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6">:agent</text>
  <text x="635" y="181" text-anchor="middle" font-size="9" fill="#7c3aed">NEW</text>

  <!-- WorkOrchestrator -->
  <rect x="390" y="220" width="90" height="36" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="435" y="238" text-anchor="middle" font-size="10" fill="#475569">Work</text>
  <text x="435" y="250" text-anchor="middle" font-size="10" fill="#475569">Orchestrator</text>

  <!-- capability lookup -->
  <rect x="390" y="280" width="90" height="50" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="435" y="300" text-anchor="middle" font-size="10" fill="#92400e">AgentQuery</text>
  <text x="435" y="316" text-anchor="middle" font-size="10" fill="#92400e">.bySlot()</text>

  <!-- findById path (NEW) -->
  <rect x="590" y="220" width="90" height="36" rx="4" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/>
  <text x="635" y="238" text-anchor="middle" font-size="10" fill="#5b21b6">AgentRegistry</text>
  <text x="635" y="250" text-anchor="middle" font-size="10" fill="#5b21b6">.findById()</text>

  <!-- Agent invocation -->
  <rect x="590" y="280" width="90" height="50" rx="4" fill="#c4b5fd" stroke="#7c3aed"/>
  <text x="635" y="300" text-anchor="middle" font-size="10" fill="#5b21b6">WorkerAgent</text>
  <text x="635" y="316" text-anchor="middle" font-size="10" fill="#5b21b6">Invoker</text>

  <!-- Arrows after -->
  <line x1="455" y1="126" x2="435" y2="150" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="455" y1="126" x2="535" y2="150" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="455" y1="126" x2="635" y2="150" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="435" y1="186" x2="435" y2="220" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="435" y1="256" x2="435" y2="280" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="635" y1="186" x2="635" y2="220" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="635" y1="256" x2="635" y2="280" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Legend -->
  <rect x="390" y="355" width="12" height="12" rx="2" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="408" y="366" font-size="10" fill="#475569">New identity-based dispatch path</text>
</svg>
