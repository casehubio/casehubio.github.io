<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="fp-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <!-- Path 1: Top-down -->
  <rect x="20" y="20" width="220" height="260" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="40" y="48" font-size="13" font-weight="bold" fill="#1a73e8">Top-Down</text>
  <text x="40" y="68" font-size="10" fill="#5f6368">Orchestrator declares a group</text>

  <rect x="45" y="85" width="170" height="32" rx="6" fill="#fff" stroke="#4285f4" stroke-width="1.5"/>
  <text x="62" y="105" font-size="11" fill="#1a73e8">createGroup(specId)</text>

  <path d="M 130 117 L 130 140" stroke="#5f6368" stroke-width="1.5" marker-end="url(#fp-arw)"/>

  <rect x="65" y="142" width="130" height="28" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="95" y="161" font-size="11" font-weight="bold" fill="#2e7d32">FORMING</text>

  <path d="M 130 170 L 130 192" stroke="#5f6368" stroke-width="1.5" marker-end="url(#fp-arw)"/>

  <rect x="45" y="195" width="170" height="32" rx="6" fill="#fff" stroke="#5f6368" stroke-width="1"/>
  <text x="55" y="215" font-size="10" fill="#5f6368">agents join, adopt roles</text>

  <text x="45" y="258" font-size="10" fill="#5f6368" font-style="italic">Like deploying a service</text>

  <!-- Path 2: Bottom-up proposal -->
  <rect x="270" y="20" width="220" height="260" rx="10" fill="#fff3e0" stroke="#f9a825" stroke-width="1.5"/>
  <text x="290" y="48" font-size="13" font-weight="bold" fill="#e65100">Bottom-Up Proposal</text>
  <text x="290" y="68" font-size="10" fill="#5f6368">Agent proposes, peers vote</text>

  <rect x="295" y="85" width="170" height="32" rx="6" fill="#fff" stroke="#f9a825" stroke-width="1.5"/>
  <text x="310" y="105" font-size="11" fill="#e65100">proposeGroup(agent)</text>

  <path d="M 380 117 L 380 140" stroke="#5f6368" stroke-width="1.5" marker-end="url(#fp-arw)"/>

  <rect x="315" y="142" width="130" height="28" rx="6" fill="#fff3e0" stroke="#f9a825" stroke-width="1.5"/>
  <text x="340" y="161" font-size="11" font-weight="bold" fill="#e65100">PROPOSED</text>

  <path d="M 380 170 L 380 192" stroke="#5f6368" stroke-width="1.5" marker-end="url(#fp-arw)"/>
  <text x="388" y="185" font-size="9" fill="#43a047">approved</text>

  <rect x="315" y="195" width="130" height="28" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="345" y="214" font-size="11" font-weight="bold" fill="#2e7d32">FORMING</text>

  <text x="295" y="258" font-size="10" fill="#5f6368" font-style="italic">Like a pull request for</text>
  <text x="295" y="272" font-size="10" fill="#5f6368" font-style="italic">team structure</text>

  <!-- Path 3: Emergence -->
  <rect x="520" y="20" width="220" height="260" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="540" y="48" font-size="13" font-weight="bold" fill="#6a1b9a">Emergence</text>
  <text x="540" y="68" font-size="10" fill="#5f6368">Detected by swarm, promoted</text>

  <rect x="545" y="85" width="170" height="32" rx="6" fill="#fff" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="558" y="100" font-size="10" fill="#6a1b9a">Engine detects team</text>
  <text x="558" y="112" font-size="10" fill="#6a1b9a">via stigmergy signals</text>

  <path d="M 630 117 L 630 140" stroke="#5f6368" stroke-width="1.5" marker-end="url(#fp-arw)"/>
  <text x="638" y="132" font-size="9" fill="#6a1b9a">promote</text>

  <rect x="565" y="142" width="130" height="28" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
  <text x="595" y="161" font-size="11" font-weight="bold" fill="#2e7d32">FORMING</text>

  <path d="M 630 170 L 630 192" stroke="#5f6368" stroke-width="1.5" marker-end="url(#fp-arw)"/>

  <rect x="545" y="195" width="170" height="32" rx="6" fill="#fff" stroke="#5f6368" stroke-width="1"/>
  <text x="555" y="215" font-size="10" fill="#5f6368">gets roles, constraints, policy</text>

  <text x="540" y="258" font-size="10" fill="#5f6368" font-style="italic">Like recognising an informal</text>
  <text x="540" y="272" font-size="10" fill="#5f6368" font-style="italic">team and making it official</text>
</svg>
