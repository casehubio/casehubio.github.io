<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow-a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="420" fill="#fafafa" rx="8"/>
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">After — Domain-Generic Dispatch</text>

  <!-- Orchestrator box - smaller, cleaner -->
  <rect x="220" y="46" width="280" height="100" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">KnowledgePipelineOrchestrator</text>
  <text x="360" y="88" text-anchor="middle" font-size="11" fill="#64748b">normalize → cache check → fetch → resolve → store</text>
  <rect x="240" y="100" width="240" height="30" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="360" y="120" text-anchor="middle" font-size="12" font-weight="500" fill="#166534">Domain-agnostic flow only</text>

  <!-- Arrow down to DomainRegistry -->
  <line x1="360" y1="146" x2="360" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-a)"/>
  <text x="372" y="163" font-size="10" fill="#94a3b8">query.domain()</text>

  <!-- DomainRegistry -->
  <rect x="250" y="172" width="220" height="36" rx="6" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="360" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">DomainRegistry</text>

  <!-- Arrow down to DomainSupport -->
  <line x1="360" y1="208" x2="360" y2="232" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-a)"/>
  <text x="372" y="225" font-size="10" fill="#94a3b8">lookup(domain)</text>

  <!-- DomainSupport - wide box with fields -->
  <rect x="100" y="234" width="520" height="70" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="360" y="254" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">DomainSupport</text>

  <!-- Fields inside DomainSupport -->
  <rect x="112" y="262" width="100" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="162" y="281" text-anchor="middle" font-size="10" fill="#1e40af">provider</text>

  <rect x="220" y="262" width="90" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="265" y="281" text-anchor="middle" font-size="10" fill="#1e40af">keyGenerator</text>

  <rect x="318" y="262" width="90" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="363" y="281" text-anchor="middle" font-size="10" fill="#1e40af">subsumption</text>

  <rect x="416" y="262" width="90" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="461" y="281" text-anchor="middle" font-size="10" fill="#1e40af">blocking</text>

  <rect x="514" y="262" width="96" height="28" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="562" y="281" text-anchor="middle" font-size="10" fill="#1e40af">normalizerChain</text>

  <!-- Arrow down from provider to implementations -->
  <line x1="162" y1="304" x2="162" y2="330" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-a)"/>

  <!-- Spatial impl -->
  <rect x="30" y="332" width="160" height="70" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="110" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">location</text>
  <text x="110" y="370" text-anchor="middle" font-size="10" fill="#059669">SpatialSearchableProvider</text>
  <text x="110" y="384" text-anchor="middle" font-size="10" fill="#059669">SpatialBlockingStrategy</text>
  <text x="110" y="398" text-anchor="middle" font-size="10" fill="#059669">SpatialCacheKeyGenerator</text>

  <!-- Commerce impl (future) -->
  <rect x="210" y="332" width="160" height="70" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-dasharray="4,3"/>
  <text x="290" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#6d28d9">commerce</text>
  <text x="290" y="370" text-anchor="middle" font-size="10" fill="#7c3aed">ProductSearchProvider</text>
  <text x="290" y="384" text-anchor="middle" font-size="10" fill="#a78bfa" font-style="italic">future</text>

  <!-- Contacts impl (future) -->
  <rect x="390" y="332" width="160" height="70" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-dasharray="4,3"/>
  <text x="470" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#6d28d9">contacts</text>
  <text x="470" y="370" text-anchor="middle" font-size="10" fill="#7c3aed">ContactSearchProvider</text>
  <text x="470" y="384" text-anchor="middle" font-size="10" fill="#a78bfa" font-style="italic">future</text>

  <!-- More (future) -->
  <rect x="570" y="332" width="130" height="70" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-dasharray="4,3"/>
  <text x="635" y="370" text-anchor="middle" font-size="14" fill="#a78bfa">. . .</text>

  <!-- Connecting lines from DomainSupport down -->
  <line x1="290" y1="304" x2="290" y2="330" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="460" y1="304" x2="470" y2="330" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="560" y1="304" x2="635" y2="330" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
