<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .box { rx: 8; ry: 8; stroke-width: 1.5; }
    .label { font-size: 13px; fill: #374151; }
    .title { font-size: 14px; font-weight: 600; fill: #111827; }
    .small { font-size: 11px; fill: #6b7280; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .divider { stroke: #e5e7eb; stroke-width: 1; stroke-dasharray: 4,4; }
    .accent { font-size: 12px; fill: #059669; font-weight: 500; }
    .warn { font-size: 12px; fill: #dc2626; font-weight: 500; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Personality Metadata Pipeline — Before and After #977</text>

  <!-- BEFORE section -->
  <rect x="20" y="48" width="370" height="440" fill="#fef3c7" class="box" stroke="#f59e0b"/>
  <text x="205" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">BEFORE — Direction Only</text>

  <!-- CognitiveDefaults box -->
  <rect x="60" y="92" width="290" height="60" fill="#fff" class="box" stroke="#d1d5db"/>
  <text x="205" y="112" text-anchor="middle" class="title">CognitiveDefaults</text>
  <text x="205" y="130" text-anchor="middle" class="small">descriptor().disposition() → 5 axes</text>

  <path d="M 205 152 L 205 178" class="arrow"/>

  <!-- addDispositionMetadata box -->
  <rect x="60" y="178" width="290" height="70" fill="#fff" class="box" stroke="#d1d5db"/>
  <text x="205" y="198" text-anchor="middle" class="title">addDispositionMetadata()</text>
  <text x="205" y="216" text-anchor="middle" class="label">disposition.socialOrient = cooperative</text>
  <text x="205" y="232" text-anchor="middle" class="label">disposition.ruleFollowing = strict</text>

  <path d="M 205 248 L 205 274" class="arrow"/>

  <!-- Prompt box -->
  <rect x="60" y="274" width="290" height="50" fill="#fff" class="box" stroke="#d1d5db"/>
  <text x="205" y="294" text-anchor="middle" class="title">PersonalityPromptBuilder</text>
  <text x="205" y="310" text-anchor="middle" class="label">"Character disposition: cooperative, strict..."</text>

  <path d="M 205 324 L 205 350" class="arrow"/>

  <!-- Cache key box -->
  <rect x="60" y="350" width="290" height="50" fill="#fff" class="box" stroke="#d1d5db"/>
  <text x="205" y="370" text-anchor="middle" class="title">CBR Cache Key (SHA-256)</text>
  <text x="205" y="386" text-anchor="middle" class="label">desc + eventType + 5 disposition values</text>

  <path d="M 205 400 L 205 426" class="arrow"/>

  <!-- Result -->
  <rect x="80" y="426" width="250" height="44" fill="#fecaca" class="box" stroke="#ef4444"/>
  <text x="205" y="446" text-anchor="middle" class="warn">Anxious cooperator = Calm cooperator</text>
  <text x="205" y="460" text-anchor="middle" class="small">Same hash → same cached result</text>

  <!-- AFTER section -->
  <rect x="410" y="48" width="370" height="440" fill="#d1fae5" class="box" stroke="#10b981"/>
  <text x="595" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">AFTER — Direction + Magnitude</text>

  <!-- CognitiveDefaults box -->
  <rect x="450" y="92" width="290" height="80" fill="#fff" class="box" stroke="#d1d5db"/>
  <text x="595" y="112" text-anchor="middle" class="title">CognitiveDefaults</text>
  <text x="595" y="130" text-anchor="middle" class="small">descriptor().disposition() → 5 axes</text>
  <text x="595" y="146" text-anchor="middle" class="accent">descriptor().personalityFacets() → 13 PID-5</text>
  <text x="595" y="160" text-anchor="middle" class="accent">appraisalWeights() → 5 derived fields</text>

  <path d="M 595 172 L 595 198" class="arrow"/>

  <!-- addPersonalityMetadata box -->
  <rect x="450" y="198" width="290" height="90" fill="#fff" class="box" stroke="#d1d5db"/>
  <text x="595" y="218" text-anchor="middle" class="title">addPersonalityMetadata()</text>
  <text x="595" y="236" text-anchor="middle" class="label">disposition.socialOrient = cooperative</text>
  <text x="595" y="252" text-anchor="middle" class="accent">pid5.Anxiousness = 0.85</text>
  <text x="595" y="268" text-anchor="middle" class="accent">appraisal.fearOnsetThreshold = 1.60</text>

  <path d="M 595 288 L 595 314" class="arrow"/>

  <!-- Prompt box -->
  <rect x="450" y="314" width="290" height="50" fill="#fff" class="box" stroke="#d1d5db"/>
  <text x="595" y="334" text-anchor="middle" class="title">PersonalityPromptBuilder</text>
  <text x="595" y="350" text-anchor="middle" class="label">"...high Anxiousness, heightened fear onset"</text>

  <path d="M 595 364 L 595 390" class="arrow"/>

  <!-- Cache key box -->
  <rect x="450" y="390" width="290" height="50" fill="#fff" class="box" stroke="#d1d5db"/>
  <text x="595" y="410" text-anchor="middle" class="title">CBR Cache Key (SHA-256)</text>
  <text x="595" y="426" text-anchor="middle" class="label">desc + eventType + disp + pid5 + appraisal</text>

  <path d="M 595 440 L 595 462" class="arrow"/>

  <!-- Result -->
  <rect x="470" y="462" width="250" height="20" fill="#bbf7d0" class="box" stroke="#22c55e"/>
  <text x="595" y="477" text-anchor="middle" class="accent">Different profiles → different classifications</text>
</svg>
