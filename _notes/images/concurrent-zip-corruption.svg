<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    text { font-size: 13px; fill: #1e293b; }
    .label { font-size: 11px; fill: #64748b; }
    .title { font-size: 15px; font-weight: 600; fill: #0f172a; }
    .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; }
    .danger { fill: #dc2626; }
    .safe { fill: #16a34a; }
    .dim { fill: #94a3b8; }
  </style>

  <text x="360" y="28" text-anchor="middle" class="title">Concurrent ZIP Writes — How Filenames Corrupt</text>

  <!-- Timeline axis -->
  <line x1="80" y1="70" x2="680" y2="70" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="74" text-anchor="end" class="label">time →</text>

  <!-- Thread A -->
  <rect x="80" y="90" width="260" height="36" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="90" y="112" class="mono">Thread A: append("vincent-marsh/...")</text>

  <!-- Thread A steps -->
  <rect x="100" y="140" width="100" height="26" rx="3" fill="#eff6ff"/>
  <text x="110" y="157" class="mono" font-size="10">read ZIP headers</text>

  <rect x="210" y="140" width="120" height="26" rx="3" fill="#eff6ff"/>
  <text x="218" y="157" class="mono" font-size="10">write local header A</text>

  <!-- Thread B -->
  <rect x="160" y="190" width="260" height="36" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="170" y="212" class="mono">Thread B: append("clara-bellingham/...")</text>

  <!-- Thread B steps -->
  <rect x="180" y="240" width="100" height="26" rx="3" fill="#fdf2f8"/>
  <text x="190" y="257" class="mono" font-size="10">read ZIP headers</text>

  <rect x="290" y="240" width="120" height="26" rx="3" fill="#fdf2f8"/>
  <text x="298" y="257" class="mono" font-size="10">write local header B</text>

  <!-- Overlap zone -->
  <rect x="210" y="85" width="130" height="190" rx="0" fill="#fef2f2" fill-opacity="0.3" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="275" y="300" text-anchor="middle" class="label danger" font-size="12" font-weight="600">interleaved writes</text>

  <!-- Result -->
  <rect x="420" y="130" width="270" height="100" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="440" y="155" font-size="12" font-weight="600" class="danger">Result: corrupted filename bytes</text>
  <text x="440" y="175" class="mono" font-size="11">PK\x03\x04 ... filename: 1/vi</text>
  <text x="440" y="192" class="mono danger" font-size="11">  0xED 0xA0 0x80  ← surrogate</text>
  <text x="440" y="209" class="mono" font-size="11">cent-marsh/tick-0001.json</text>
  <text x="440" y="226" class="label">Python: UnicodeDecodeError</text>

  <!-- Arrow from overlap to result -->
  <line x1="340" y1="180" x2="415" y2="180" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
</svg>