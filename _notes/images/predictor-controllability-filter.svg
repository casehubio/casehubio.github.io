<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif">
  <style>
    text { font-size: 13px; fill: #1a1a2e; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 11px; fill: #555; }
    .dim { font-size: 11px; fill: #888; }
    .box { rx: 6; ry: 6; stroke-width: 1.5; }
    .arrow { stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" class="title">CopingStrategyPredictor: controllability filters the strategy space</text>

  <!-- Controllability axis -->
  <line x1="60" y1="80" x2="660" y2="80" stroke="#ccc" stroke-width="2"/>
  <text x="60" y="72" class="label" text-anchor="middle">0.0</text>
  <text x="240" y="72" class="label" text-anchor="middle">0.3</text>
  <text x="460" y="72" class="label" text-anchor="middle">0.6</text>
  <text x="660" y="72" class="label" text-anchor="middle">1.0</text>
  <text x="360" y="100" text-anchor="middle" class="dim">controllability →</text>

  <!-- Threshold markers -->
  <line x1="240" y1="75" x2="240" y2="85" stroke="#e74c3c" stroke-width="2"/>
  <line x1="460" y1="75" x2="460" y2="85" stroke="#2ecc71" stroke-width="2"/>

  <!-- Zone labels -->
  <text x="150" y="115" text-anchor="middle" font-size="12" fill="#e74c3c" font-weight="600">LOW</text>
  <text x="350" y="115" text-anchor="middle" font-size="12" fill="#f39c12" font-weight="600">MEDIUM</text>
  <text x="560" y="115" text-anchor="middle" font-size="12" fill="#2ecc71" font-weight="600">HIGH</text>

  <!-- Low zone: BELIEF + DESIRE only -->
  <rect x="60" y="135" width="180" height="130" class="box" fill="#fde8e8" stroke="#e74c3c"/>
  <text x="150" y="155" text-anchor="middle" font-weight="600" font-size="12">BELIEF + DESIRE only</text>
  <text x="80" y="178" font-size="11" fill="#444">SHIFT_RESPONSIBILITY</text>
  <text x="80" y="196" font-size="11" fill="#444">WISHFUL_THINKING</text>
  <text x="80" y="214" font-size="11" fill="#444">DENIAL</text>
  <text x="80" y="232" font-size="11" fill="#444">MENTAL_DISENGAGEMENT</text>
  <text x="80" y="250" font-size="11" fill="#444">POSITIVE_REINTERPRETATION</text>

  <!-- Medium zone: ALL categories -->
  <rect x="250" y="135" width="200" height="130" class="box" fill="#fef9e7" stroke="#f39c12"/>
  <text x="350" y="155" text-anchor="middle" font-weight="600" font-size="12">ALL categories viable</text>
  <text x="270" y="178" font-size="11" fill="#444">All 16 EMA strategies</text>
  <text x="270" y="196" font-size="11" fill="#444">Personality dimension</text>
  <text x="270" y="214" font-size="11" fill="#444">scores break the tie</text>
  <text x="270" y="240" font-size="11" fill="#888">reinterpretation: 0.70</text>
  <text x="270" y="256" font-size="11" fill="#888">→ wins for CHAINING</text>

  <!-- High zone: INTENTION only -->
  <rect x="460" y="135" width="200" height="130" class="box" fill="#e8f8f5" stroke="#2ecc71"/>
  <text x="560" y="155" text-anchor="middle" font-weight="600" font-size="12">INTENTION only</text>
  <text x="480" y="178" font-size="11" fill="#444">PLANNING</text>
  <text x="480" y="196" font-size="11" fill="#444">ACTIVE_CONFRONTATION</text>
  <text x="480" y="214" font-size="11" fill="#444">SEEK_INSTRUMENTAL_SUPPORT</text>
  <text x="480" y="232" font-size="11" fill="#444">SUPPRESSION</text>
  <text x="480" y="250" font-size="11" fill="#444">AVOIDANCE, RESIGNATION…</text>

  <!-- Personality profiles as arrows -->
  <text x="150" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#e74c3c">NEUROTIC</text>
  <text x="150" y="316" text-anchor="middle" class="dim">ctrl = 0.15</text>
  <text x="150" y="332" text-anchor="middle" class="dim">avoidance = 0.85</text>
  <line x1="150" y1="338" x2="150" y2="265" class="arrow" stroke="#e74c3c"/>

  <text x="350" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#f39c12">CHAINING</text>
  <text x="350" y="316" text-anchor="middle" class="dim">ctrl = 0.45</text>
  <text x="350" y="332" text-anchor="middle" class="dim">reinterp = 0.70</text>
  <line x1="350" y1="338" x2="350" y2="265" class="arrow" stroke="#f39c12"/>

  <text x="560" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#2ecc71">CONSCIENTIOUS</text>
  <text x="560" y="316" text-anchor="middle" class="dim">ctrl = 0.80</text>
  <text x="560" y="332" text-anchor="middle" class="dim">planful = 0.85</text>
  <line x1="560" y1="338" x2="560" y2="265" class="arrow" stroke="#2ecc71"/>

  <!-- Bottom note -->
  <text x="360" y="370" text-anchor="middle" font-size="11" fill="#666">The predictor is deterministic: personality + controllability = exact strategy.</text>
  <text x="360" y="388" text-anchor="middle" font-size="11" fill="#666">The LLM-as-judge scores whether the generated behaviour matches that prediction.</text>
</svg>
