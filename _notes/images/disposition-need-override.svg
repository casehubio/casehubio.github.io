<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1.2"/>
    </marker>
    <linearGradient id="globalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff"/>
      <stop offset="100%" style="stop-color:#c7d2fe"/>
    </linearGradient>
    <linearGradient id="providerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </linearGradient>
    <linearGradient id="coopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5"/>
      <stop offset="100%" style="stop-color:#a7f3d0"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fee2e2"/>
      <stop offset="100%" style="stop-color:#fecaca"/>
    </linearGradient>
  </defs>

  <!-- Global config -->
  <rect x="20" y="30" width="200" height="80" rx="8" fill="url(#globalGrad)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="120" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">NeedSatisfactionConfig</text>
  <text x="120" y="78" text-anchor="middle" font-size="11" fill="#4338ca">@ConfigMapping global</text>
  <text x="120" y="96" text-anchor="middle" font-size="10" fill="#6366f1">social decay: 0.08 · resting: 0.4</text>

  <!-- Provider -->
  <rect x="280" y="20" width="200" height="100" rx="8" fill="url(#providerGrad)" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="48" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">NeedSatisfaction</text>
  <text x="380" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">ConfigProvider</text>
  <text x="380" y="86" text-anchor="middle" font-size="11" fill="#92400e">configFor(agentId)</text>
  <text x="380" y="104" text-anchor="middle" font-size="10" fill="#b45309">disposition → override</text>

  <!-- Arrow: global → provider -->
  <line x1="220" y1="70" x2="275" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Cooperative output -->
  <rect x="540" y="20" width="160" height="90" rx="8" fill="url(#coopGrad)" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="46" text-anchor="middle" font-size="12" font-weight="600" fill="#064e3b">Cooperative</text>
  <text x="620" y="64" text-anchor="middle" font-size="11" fill="#065f46">Penelope, Peter</text>
  <text x="620" y="84" text-anchor="middle" font-size="10" fill="#047857">→ global config unchanged</text>
  <text x="620" y="100" text-anchor="middle" font-size="10" fill="#047857">decay 0.08 · resting 0.40</text>

  <!-- Competitive output -->
  <rect x="540" y="140" width="160" height="90" rx="8" fill="url(#compGrad)" stroke="#dc2626" stroke-width="1.5"/>
  <text x="620" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">Competitive</text>
  <text x="620" y="184" text-anchor="middle" font-size="11" fill="#991b1b">Hooded Claw, Dastardly</text>
  <text x="620" y="204" text-anchor="middle" font-size="10" fill="#b91c1c">→ social overrides applied</text>
  <text x="620" y="220" text-anchor="middle" font-size="10" fill="#b91c1c">decay 0.12 · resting 0.24</text>

  <!-- Arrows: provider → outputs -->
  <line x1="480" y1="55" x2="535" y2="55" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="85" x2="520" y2="170" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DriveAdaptationPhase -->
  <rect x="180" y="280" width="360" height="90" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="360" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">DriveAdaptationPhase</text>
  <text x="360" y="330" text-anchor="middle" font-size="11" fill="#475569">processSubgraph resolves agentId</text>
  <text x="360" y="348" text-anchor="middle" font-size="11" fill="#475569">→ provider.configFor(agentId)</text>
  <text x="360" y="362" text-anchor="middle" font-size="10" fill="#64748b">per-agent decay rates, resting levels, satisfaction increments</text>

  <!-- Arrow: provider → phase -->
  <line x1="380" y1="120" x2="380" y2="275" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="392" y="200" font-size="10" fill="#64748b">SPI injection</text>
</svg>
