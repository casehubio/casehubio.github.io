<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;font-family:system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#475569"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#0284c7"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#16a34a"/></marker>
  </defs>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="700">casehub-blackboard Architecture</text>

  <!-- Engine box (left side) -->
  <rect x="15" y="50" width="220" height="260" rx="10" fill="#fefce8" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="125" y="72" text-anchor="middle" font-size="13" fill="#92400e" font-weight="700">casehub-engine</text>

  <rect x="30" y="85" width="190" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="125" y="108" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">CaseContextChanged</text>
  <text x="125" y="123" text-anchor="middle" font-size="10" fill="#a16207">EventHandler</text>

  <rect x="30" y="150" width="190" height="45" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="125" y="172" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">loopControl.select()</text>
  <text x="125" y="187" text-anchor="middle" font-size="10" fill="#a16207">hook point</text>

  <rect x="30" y="210" width="190" height="45" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="125" y="232" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">Worker Execution</text>
  <text x="125" y="247" text-anchor="middle" font-size="10" fill="#a16207">fire selected bindings</text>

  <rect x="30" y="268" width="190" height="30" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="125" y="288" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">eventBus.publish() fan-out</text>

  <!-- Blackboard module (right side) -->
  <rect x="280" y="50" width="560" height="280" rx="10" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="560" y="72" text-anchor="middle" font-size="13" fill="#0c4a6e" font-weight="700">casehub-blackboard</text>

  <!-- PlanningStrategyLoopControl -->
  <rect x="300" y="90" width="220" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="410" y="116" text-anchor="middle" font-size="11" fill="#0c4a6e" font-weight="600">PlanningStrategy</text>
  <text x="410" y="132" text-anchor="middle" font-size="11" fill="#0c4a6e" font-weight="600">LoopControl</text>
  <text x="410" y="150" text-anchor="middle" font-size="10" fill="#0369a1">coordinates per select()</text>

  <!-- BlackboardRegistry -->
  <rect x="560" y="90" width="160" height="55" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="640" y="113" text-anchor="middle" font-size="11" fill="#0c4a6e" font-weight="600">BlackboardRegistry</text>
  <text x="640" y="130" text-anchor="middle" font-size="10" fill="#0369a1">owns CasePlanModel</text>

  <!-- StageLifecycleEvaluator -->
  <rect x="560" y="160" width="160" height="55" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="640" y="183" text-anchor="middle" font-size="11" fill="#0c4a6e" font-weight="600">StageLifecycle</text>
  <text x="640" y="200" text-anchor="middle" font-size="11" fill="#0c4a6e" font-weight="600">Evaluator</text>

  <!-- PlanningStrategy -->
  <rect x="300" y="185" width="220" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="210" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">PlanningStrategy</text>
  <text x="410" y="228" text-anchor="middle" font-size="10" fill="#2563eb">async Uni&lt;List&lt;Binding&gt;&gt;</text>

  <!-- Event handlers -->
  <rect x="300" y="265" width="220" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="288" text-anchor="middle" font-size="11" fill="#14532d" font-weight="600">PlanItemCompletionHandler</text>
  <text x="410" y="305" text-anchor="middle" font-size="10" fill="#166534">@ConsumeEvent WORKER_FINISHED</text>

  <rect x="560" y="265" width="200" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="660" y="288" text-anchor="middle" font-size="11" fill="#14532d" font-weight="600">MilestoneAchievementHandler</text>
  <text x="660" y="305" text-anchor="middle" font-size="10" fill="#166534">@ConsumeEvent MILESTONE_REACHED</text>

  <!-- Stage events output -->
  <rect x="560" y="230" width="160" height="30" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="640" y="250" text-anchor="middle" font-size="10" fill="#166534">STAGE_ACTIVATED / COMPLETED</text>

  <!-- CasePlanModel data store -->
  <rect x="300" y="370" width="190" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="395" y="396" text-anchor="middle" font-size="12" fill="#5b21b6" font-weight="600">CasePlanModel</text>
  <text x="395" y="414" text-anchor="middle" font-size="10" fill="#6d28d9">per-case control blackboard</text>

  <!-- CaseContext -->
  <rect x="530" y="370" width="170" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="615" y="396" text-anchor="middle" font-size="12" fill="#5b21b6" font-weight="600">CaseContext</text>
  <text x="615" y="414" text-anchor="middle" font-size="10" fill="#6d28d9">domain state (separate)</text>

  <!-- Divider label -->
  <text x="430" y="358" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="600">STATE SEPARATION</text>
  <line x1="280" y1="345" x2="780" y2="345" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Arrows: engine to blackboard -->
  <line x1="220" y1="172" x2="295" y2="125" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="255" y="140" text-anchor="middle" font-size="9" fill="#0284c7">select()</text>

  <!-- PlanningStrategyLC to components -->
  <line x1="520" y1="115" x2="555" y2="115" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <line x1="520" y1="135" x2="555" y2="180" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <line x1="410" y1="160" x2="410" y2="180" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arr-blue)"/>

  <!-- Fan-out to handlers -->
  <line x1="220" y1="283" x2="295" y2="290" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="220" y1="283" x2="555" y2="290" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="250" y="278" font-size="9" fill="#16a34a">fan-out</text>

  <!-- Handlers to CasePlanModel -->
  <line x1="410" y1="320" x2="395" y2="365" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="640" y1="320" x2="440" y2="375" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Registry to CasePlanModel -->
  <line x1="640" y1="145" x2="640" y2="155" stroke="#0284c7" stroke-width="1" marker-end="url(#arr-blue)"/>
  <path d="M 720 118 L 760 118 L 760 380 L 510 395" stroke="#7c3aed" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="775" y="250" text-anchor="start" font-size="9" fill="#7c3aed" transform="rotate(90, 775, 250)">owns</text>

  <!-- StageLifecycleEvaluator to stage events -->
  <line x1="640" y1="215" x2="640" y2="225" stroke="#16a34a" stroke-width="1" marker-end="url(#arr-green)"/>
</svg>
