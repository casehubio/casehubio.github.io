<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;font-family:system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#475569"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#0284c7"/></marker>
  </defs>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="700">Engine Reactive Event Loop</text>

  <!-- CONTEXT_CHANGED event -->
  <rect x="20" y="55" width="160" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="100" y="82" text-anchor="middle" font-size="13" fill="#92400e" font-weight="600">CONTEXT_CHANGED</text>
  <text x="100" y="100" text-anchor="middle" font-size="11" fill="#a16207">EventBus event</text>

  <!-- Handler -->
  <rect x="230" y="55" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="330" y="78" text-anchor="middle" font-size="12" fill="#334155" font-weight="600">CaseContextChanged</text>
  <text x="330" y="94" text-anchor="middle" font-size="12" fill="#334155" font-weight="600">EventHandler</text>
  <text x="330" y="110" text-anchor="middle" font-size="11" fill="#64748b">evaluate triggers</text>

  <!-- Eligible bindings -->
  <rect x="480" y="55" width="140" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="550" y="82" text-anchor="middle" font-size="13" fill="#334155" font-weight="600">Eligible Bindings</text>
  <text x="550" y="100" text-anchor="middle" font-size="11" fill="#64748b">List&lt;Binding&gt;</text>

  <!-- Hook point - highlighted -->
  <rect x="490" y="155" width="180" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="580" y="183" text-anchor="middle" font-size="13" fill="#0c4a6e" font-weight="700">loopControl.select()</text>
  <text x="580" y="203" text-anchor="middle" font-size="12" fill="#0369a1">HOOK POINT</text>

  <!-- Returns Uni -->
  <rect x="490" y="260" width="180" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="287" text-anchor="middle" font-size="13" fill="#14532d" font-weight="600">Uni&lt;List&lt;Binding&gt;&gt;</text>
  <text x="580" y="305" text-anchor="middle" font-size="11" fill="#166534">selected workers</text>

  <!-- Fire workers -->
  <rect x="230" y="260" width="200" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="330" y="287" text-anchor="middle" font-size="13" fill="#14532d" font-weight="600">Fire Workers</text>
  <text x="330" y="305" text-anchor="middle" font-size="11" fill="#166534">execute selected bindings</text>

  <!-- Loop back -->
  <rect x="20" y="260" width="160" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="100" y="287" text-anchor="middle" font-size="13" fill="#92400e" font-weight="600">Workers Complete</text>
  <text x="100" y="305" text-anchor="middle" font-size="11" fill="#a16207">emit new events</text>

  <!-- Arrows -->
  <line x1="180" y1="85" x2="225" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="85" x2="475" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="550" y1="115" x2="550" y2="150" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="580" y1="225" x2="580" y2="255" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="485" y1="290" x2="435" y2="290" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="225" y1="290" x2="185" y2="290" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Loop-back arrow -->
  <path d="M 100 260 L 100 140 L 225 140 L 225 100" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <text x="160" y="135" text-anchor="middle" font-size="10" fill="#94a3b8">next cycle</text>
</svg>
