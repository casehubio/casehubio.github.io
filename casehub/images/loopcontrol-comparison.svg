<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;font-family:system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#475569"/></marker>
  </defs>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="700">LoopControl Implementations at the Hook Point</text>

  <!-- Shared input -->
  <rect x="20" y="120" width="150" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="95" y="148" text-anchor="middle" font-size="13" fill="#92400e" font-weight="600">Eligible Bindings</text>
  <text x="95" y="168" text-anchor="middle" font-size="11" fill="#a16207">List&lt;Binding&gt;</text>

  <!-- Divider labels -->
  <text x="410" y="60" text-anchor="middle" font-size="12" fill="#94a3b8" font-weight="600">DEFAULT</text>
  <text x="410" y="230" text-anchor="middle" font-size="12" fill="#94a3b8" font-weight="600">WITH casehub-blackboard MODULE</text>
  <line x1="220" y1="195" x2="780" y2="195" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Choreography path (top) -->
  <rect x="230" y="70" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="330" y="96" text-anchor="middle" font-size="12" fill="#334155" font-weight="600">ChoreographyLoopControl</text>
  <text x="330" y="114" text-anchor="middle" font-size="11" fill="#64748b">return all eligible</text>

  <rect x="500" y="70" width="160" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="96" text-anchor="middle" font-size="13" fill="#14532d" font-weight="600">All Workers Fire</text>
  <text x="580" y="114" text-anchor="middle" font-size="11" fill="#166534">identity function</text>

  <!-- Planning path (bottom) -->
  <rect x="230" y="240" width="200" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="330" y="263" text-anchor="middle" font-size="11" fill="#0c4a6e" font-weight="600">PlanningStrategy</text>
  <text x="330" y="279" text-anchor="middle" font-size="11" fill="#0c4a6e" font-weight="600">LoopControl</text>
  <text x="330" y="297" text-anchor="middle" font-size="10" fill="#0369a1">@Alternative @Priority(10)</text>

  <rect x="480" y="240" width="130" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="545" y="265" text-anchor="middle" font-size="11" fill="#0c4a6e" font-weight="600">Stage Lifecycle</text>
  <text x="545" y="281" text-anchor="middle" font-size="11" fill="#0369a1">+ Plan Model</text>
  <text x="545" y="297" text-anchor="middle" font-size="10" fill="#0369a1">+ EventLog queries</text>

  <rect x="650" y="240" width="140" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="720" y="268" text-anchor="middle" font-size="13" fill="#14532d" font-weight="600">Selected Subset</text>
  <text x="720" y="288" text-anchor="middle" font-size="11" fill="#166534">async Uni result</text>

  <!-- Arrows - top path -->
  <path d="M 170 140 L 195 140 L 195 100 L 225 100" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <line x1="430" y1="100" x2="495" y2="100" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrows - bottom path -->
  <path d="M 170 170 L 195 170 L 195 275 L 225 275" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <line x1="430" y1="275" x2="475" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="610" y1="275" x2="645" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
